erini değiştirebilir.","Ahtapotların renk değiştirmeyi nasıl başardığı henüz kesin olarak açıklanamamıştır.","Ahtapotlar, renk değiştirme yeteneklerini en çok avlanırken kullanır.","Ahtapotların kolları, tat alma işlevi de görür."],"a":3,"c":"Parçada renk değiştirmenin hangi amaçla, örneğin avlanmak için kullanıldığından söz edilmez. Bilim insanlarının yalnızca bir olasılık ileri sürmesi, konunun henüz kesin olarak açıklanamadığını gösterir."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Türk kahvesi, çekirdeklerin çok ince öğütülmesi ve süzülmeden, telvesiyle birlikte sunulmasıyla öteki kahve türlerinden ayrılır. Cezvede soğuk suyla karıştırılan kahve, kısık ateşte yavaş yavaş pişirilir; köpüğün korunması, iyi bir kahvenin en önemli işareti sayılır. Kahvenin yanında bir bardak su verilmesi, ağzın temizlenip kahvenin tadının daha iyi alınması içindir. Kahve yalnızca bir içecek değil, aynı zamanda bir sohbet ve misafirlik aracıdır; \"Bir fincan kahvenin kırk yıl hatırı vardır.\" sözü de bu anlayışı yansıtır.\nBu parçadan Türk kahvesiyle ilgili aşağıdakilerden hangisi çıkarılabilir?","o":["En çok sabah saatlerinde içilen bir içecektir.","Hazırlanış biçimi, kahvenin niteliğini belirleyen unsurlardan biridir.","Çekirdekleri yalnızca belirli bir bölgede yetiştirilir.","Yanında su verilmesi, eskiden kalma bir süsleme geleneğidir.","Köpüksüz kahve, misafire hiçbir zaman ikram edilmez."],"a":1,"c":"Kahvenin kısık ateşte pişirilmesi ve köpüğünün korunmasının iyi kahvenin işareti sayılması, hazırlanış biçiminin niteliği etkilediğini gösterir. Suyun ağzı temizlemek için verildiği söylendiğinden süsleme geleneği yargısı parçayla çelişir."},{"d":"turkce","k":"Paragraf tamamlama","q":"Bir masalı kitaptan okumak ile bir ninenin ağzından dinlemek aynı deneyim değildir. Anlatıcı, dinleyenlerin yüzüne bakarak masalı uzatır, kısaltır; korkan bir çocuğu görünce devin sesini yumuşatır, sıkılan birini fark edince olayları hızlandırır. Böylece aynı masal her anlatılışında biraz değişir. ----\nBu parça aşağıdakilerden hangisiyle tamamlanabilir?","o":["Yazıya geçirilen masallar, çocukların hayal gücünü daha çok geliştirir.","Sözlü anlatıda metin, anlatıcı ile dinleyici arasında her seferinde yeniden kurulur.","Masallardaki devler ve cadılar, çocukların korkularını simgeler.","Bu yüzden masallar mutlaka yazıya geçirilerek korunmalıdır.","Ninelerin anlattığı masallar genellikle mutlu sonla biter."],"a":1,"c":"Parça, anlatıcının dinleyiciye göre masalı değiştirdiğini ve masalın her anlatılışta farklılaştığını söylüyor. Bunu genel bir yargıya bağlayan cümle, metnin anlatıcıyla dinleyici arasında yeniden kurulduğunu belirten cümledir."},{"d":"turkce","k":"Paragraf tamamlama","q":"Anadolu kilimlerindeki motifler yalnızca süs amacıyla dokunmaz. ---- Örneğin elibelinde motifi bereketi ve anneliği, koçboynuzu gücü ve yiğitliği, muska ise kötülüklerden korunmayı simgeler. Bu yüzden bir kilime dikkatle bakan kişi, onu dokuyanın dileklerini, korkularını ve umutlarını okuyabilir.\nBu parçada boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","o":["Kilimlerde kullanılan iplikler genellikle koyun yününden elde edilir.","Günümüzde kilim dokumacılığı, yerini fabrikada üretilen halılara bırakmıştır.","Kilimlerin renkleri, yörelere göre büyük farklılıklar gösterir.","Bir kilimin dokunması, büyüklüğüne göre aylar sürebilir.","Her motif, dokuyanın anlatmak istediği bir duyguyu ya da dileği taşır."],"a":4,"c":"Boşluktan sonraki cümle \"Örneğin\" diye başlayıp motiflerin neyi simgelediğini sıralıyor. Bu örneklerin açıkladığı yargı, her motifin bir duygu ya da dilek taşıdığıdır."},{"d":"turkce","k":"Paragraf tamamlama","q":"---- Örneğin geceleyin baktığımız bir yıldızın ışığı, bize ulaşana kadar yüzlerce, hatta binlerce yıl yol almış olabilir. Yani gördüğümüz, o yıldızın bugünkü hâli değil, ışığın yola çıktığı andaki görüntüsüdür. Hatta bazı yıldızlar, biz onları hâlâ gökyüzünde görürken çoktan sönmüş olabilir.\nBu parça aşağıdakilerden hangisiyle başlatılabilir?","o":["Yıldızlar, çıplak gözle görülebilen en uzak gök cisimleridir.","Işık, evrende bilinen en yüksek hıza sahiptir.","Gökyüzünde her gece aynı yıldızları görmek mümkün değildir.","Gökyüzüne baktığımızda aslında geçmişi izleriz.","Yıldızların parlaklığı, büyüklüklerine göre değişir."],"a":3,"c":"Parçanın devamı, yıldızlardan gelen ışığın geçmişte yola çıktığını ve gördüğümüzün yıldızın eski hâli olduğunu örnekliyor. Bu örneklerin dayandığı ana yargı, gökyüzüne bakarken geçmişi izlediğimizdir."},{"d":"turkce","k":"Paragrafta akışı bozan cümle","q":"(I) Hat sanatında bir harfin doğru yazılması, kalem ucunun genişliğiyle ölçülen noktalarla belirlenir. (II) Örneğin elif harfinin boyu, yazı türüne göre belirli sayıda noktaya denk gelmelidir. (III) Hattatlar, kamış kalemlerini kendileri açar ve mürekkeplerini de çoğunlukla kendileri hazırlar. (IV) Bu ölçüler, yazının göze dengeli ve uyumlu görünmesini sağlar. (V) Ölçülere uyulmadan yazılan bir yazı, ne kadar süslenirse süslensin ustaların gözünde kusurlu sayılır.\nBu parçada numaralanmış cümlelerden hangisi düşüncenin akışını bozmaktadır?","o":["I","II","III","IV","V"],"a":2,"c":"Parça, hat sanatında harflerin noktalarla ölçülmesini ve bu ölçülerin önemini anlatıyor. III. cümle, kalem ve mürekkep hazırlığına geçerek konunun dışına çıkıyor; IV. cümledeki \"Bu ölçüler\" de II. cümleye bağlanıyor."},{"d":"turkce","k":"Paragrafta akışı bozan cümle","q":"(I) Ormanlardaki ağaçlar, toprak altında mantar iplikçikleriyle birbirine bağlanır. (II) Mantarlar ağaçlara topraktan su ve mineral taşır; karşılığında ağaçların fotosentezle ürettiği şekerin bir bölümünü alır. (III) Bu ağ sayesinde güneş alan yaşlı ağaçlar, gölgede kalan fidanlara besin aktarabilir. (IV) Bazı araştırmalar, zararlıların saldırısına uğrayan bir ağacın bu ağ aracılığıyla çevresindeki ağaçlara kimyasal uyarılar gönderdiğini de göstermektedir. (V) Ağaçların yaşını belirlemek için gövdedeki yıllık halkalar sayılır.\nBu parçada numaralanmış cümlelerden hangisi düşüncenin akışını bozmaktadır?","o":["I","II","III","IV","V"],"a":4,"c":"Parça, ağaçları toprak altında birbirine bağlayan mantar ağını ve bu ağın işlevlerini anlatıyor. V. cümle ağaçların yaşının belirlenmesine geçtiği için akışı bozuyor."},{"d":"turkce","k":"Paragrafta akışı bozan cümle","q":"(I) Garip akımının şairleri, şiiri ölçünün, uyağın ve söz sanatlarının yükünden kurtarmak istiyordu. (II) Divan şiirinde ise gazel, en çok kullanılan nazım biçimlerinden biriydi. (III) Onlara göre şiir, sokaktaki insanın konuştuğu dille yazılmalı ve onun gündelik yaşamını anlatmalıydı. (IV) Bu yüzden şiirlerinde bir kahvede geçen sohbet, bir otobüs yolculuğu ya da bir balık fiyatı bile konu olabiliyordu. (V) Bu yalınlık, ilk başta pek çok eleştirmen tarafından şiire yakışmayan bir şaka olarak görüldü.\nBu parçada numaralanmış cümlelerden hangisi düşüncenin akışını bozmaktadır?","o":["I","II","III","IV","V"],"a":1,"c":"Parça, Garip şairlerinin şiir anlayışını anlatıyor. II. cümle divan şiirindeki nazım biçimlerine geçerek akışı bozuyor; III. cümledeki \"Onlara göre\" de I. cümledeki şairlere gönderme yapıyor."},{"d":"turkce","k":"Paragraf yapısı","q":"(I) Çay, Türkiye'ye ilk kez 19. yüzyılın sonlarında getirildi; ancak ilk yetiştirme denemeleri başarılı olmadı. (II) Asıl yaygınlaşma, Cumhuriyet'in ilk yıllarında Rize çevresinde kurulan çay bahçeleriyle başladı. (III) Bölgenin bol yağış alan iklimi ve asitli toprakları, çay bitkisi için son derece uygundu. (IV) Bugün çay, Türkiye'de neredeyse her öğünün ve her sohbetin vazgeçilmez bir parçasıdır. (V) Evde, iş yerinde, kahvehanede ince belli bardaklarda sunulan çay, misafire gösterilen ilginin de bir işaretidir. (VI) Bu nedenle çay ikram edilmeyen bir ziyaret, pek çok kişiye eksik kalmış gibi gelir.\nBu parça iki paragrafa ayrılmak istense ikinci paragraf hangi cümleyle başlar?","o":["II","III","IV","V","VI"],"a":2,"c":"I-III. cümleler çayın Türkiye'ye gelişini ve yetiştirilmesini anlatır. IV. cümle \"Bugün\" diyerek çayın gündelik yaşamdaki ve misafirlikteki yerine, yani yeni bir konuya geçer."},{"d":"turkce","k":"Paragraf yapısı","q":"(I) Kazılar ilerledikçe bu inanç merkezinin, tarımın başlamasından önce avcı-toplayıcı topluluklar tarafından kurulduğu anlaşıldı.\n(II) Şanlıurfa yakınlarındaki Göbeklitepe'de 1990'ların ortasında başlayan kazılar, üzerinde hayvan kabartmaları bulunan dev T biçimli dikilitaşları gün yüzüne çıkardı.\n(III) Bu bulgu, insanların önce yerleşik hayata geçip sonra tapınak yaptığı yönündeki yaygın görüşü sarstı.\n(IV) Bugün pek çok araştırmacı, büyük toplulukları bir araya getiren inanç merkezlerinin yerleşik hayata geçişi hızlandırmış olabileceğini düşünmektedir.\n(V) Yaklaşık on iki bin yıl öncesine tarihlenen bu taşların bir inanç merkezine ait olduğu düşünülmektedir.\nNumaralanmış cümlelerle anlamlı bir paragraf oluşturulduğunda baştan üçüncü cümle hangisi olur?","o":["I","II","III","IV","V"],"a":0,"c":"Sıralama II - V - I - III - IV biçimindedir: II. cümle konuyu açar, V. cümle \"bu taşlar\"ı inanç merkezine bağlar, I. cümle bu merkezin tarımdan önce kurulduğunu söyler, III. cümle \"Bu bulgu\" ile sonucu verir, IV. cümle bugünkü görüşle bitirir. Üçüncü cümle I'dir."},{"d":"turkce","k":"Cümlede anlam","q":"Aşağıdaki cümlelerin hangisinde öznel bir yargı vardır?","o":["Kitap, yazarın on yıllık bir araştırmasının ürünüdür.","Roman, üç bölümden ve yirmi dört kısımdan oluşuyor.","Yazar, bu eserinde İstanbul'un yüz yıllık değişimini anlatıyor.","Eser, ilk baskısından bu yana on iki dile çevrildi.","Romanın son bölümü, okuru derinden sarsan unutulmaz sayfalarla dolu."],"a":4,"c":"\"Okuru derinden sarsan, unutulmaz\" nitelemeleri kişiden kişiye değişebilecek kişisel bir değerlendirmedir. Diğer cümleler doğruluğu araştırılarak kanıtlanabilecek nesnel bilgiler içerir."},{"d":"turkce","k":"Cümlede anlam","q":"Aşağıdaki cümlelerin hangisinde koşul anlamı vardır?","o":["Rüzgâr çıktığı için tekne limandan ayrılamadı.","Sergiyi görmek için şehre gelmiş.","Kardeşi ondan daha sabırlı biridir.","Fidanlar düzenli sulanmazsa ilk yaz kuruyup gider.","Güneş batınca kuşlar ağaçlara döndü."],"a":3,"c":"Fidanların kuruması, düzenli sulanmama koşuluna bağlanmıştır. Diğer cümlelerde neden-sonuç, amaç-sonuç, karşılaştırma ve zaman anlamı vardır."},{"d":"turkce","k":"Cümlede anlam","q":"Ağacın köklerine bakmayan, yaprakların neden sarardığını hiçbir zaman anlayamaz.\nBu cümleyle anlatılmak istenen aşağıdakilerden hangisidir?","o":["Bir sorunun nedenini anlamak için görünenin ardındaki temele bakmak gerekir.","Ağaçların sağlığı en çok yapraklarından anlaşılır.","Sonbaharda yaprakların sararması doğal bir süreçtir.","Her sorunun birden çok çözümü vardır.","Bir işin sonucu, başlangıcından daha önemlidir."],"a":0,"c":"Cümlede \"kök\" görünmeyen temeli, \"yaprakların sararması\" ise göze çarpan sorunu simgeler. Sorunun nedenini anlamak için yüzeyin altındaki temele bakılması gerektiği anlatılmaktadır."},{"d":"turkce","k":"Cümlede anlam","q":"\"Bir şiiri satır satır açıklamaya çalışmak, bir kelebeği iğneyle duvara tutturmaya benzer.\"\nBu sözü söyleyen birinin aşağıdaki yargılardan hangisini benimsediği söylenebilir?","o":["Şiirin anlaşılması için mutlaka satır satır açıklanması gerekir.","Şiir, ayrıntılı biçimde çözümlenmeye çalışıldıkça canlılığını yitirir.","Kelebekler gibi şiirler de kısa ömürlüdür.","İyi bir şiir, ilk okumada anlaşılabilecek kadar açık olmalıdır.","Şiir eleştirmenleri, şairlerden daha çok emek verir."],"a":1,"c":"İğneyle tutturulan kelebek korunur ama artık uçamaz; şiir de satır satır açıklandığında canlılığını yitirir. Söz, çözümlemenin şiiri cansızlaştırdığı yargısını içerir."},{"d":"turkce","k":"Sözcükte anlam","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük terim anlamıyla kullanılmıştır?","o":["Bu konuya farklı bir [[açıdan]] bakmalısın.","Çocuğun [[kalbi]] kırıldı, bütün gün konuşmadı.","Üçgenin iç [[açıları]] toplamı 180 derecedir.","Ağacın [[kökü]] derinlere uzanıyor.","Pazardan iki kilo [[elma]] aldık."],"a":2,"c":"\"Açı\", geometriye özgü bir kavram olarak terim anlamıyla kullanılmıştır. \"Açıdan\" (bakış) ve \"kalbi kırılmak\" mecaz; \"kök\" ve \"elma\" gerçek anlamdadır."},{"d":"turkce","k":"Deyim ve atasözü","q":"Aşağıdaki cümlelerin hangisinde altı çizili deyim, anlamına uygun kullanılmamıştır?","o":["Yıllardır görmediği arkadaşıyla karşılaşınca [[gözleri doldu]].","Komşusunun yeni evini [[gözü tutmadı]], herkese övüp durdu.","Sınavı kazandığını duyunca [[ayakları yere basmadı]].","Bu kadar işi bir günde bitirmek için [[kolları sıvadı]].","Gece boyunca çalıştığı için sabah [[ayakta uyuyordu]]."],"a":1,"c":"\"Gözü tutmamak\" beğenmemek demektir; beğenmediği evi herkese övmesi deyimin anlamıyla çelişir. Diğer deyimler anlamlarına uygun kullanılmıştır."},{"d":"turkce","k":"Deyim ve atasözü","q":"Aşağıdaki atasözlerinden hangisi \"aceleyle yapılan işten iyi sonuç alınamaz\" anlamındadır?","o":["Damlaya damlaya göl olur.","Acele işe şeytan karışır.","Ağaç yaşken eğilir.","Sakla samanı, gelir zamanı.","Bin bilsen de bir bilene danış."],"a":1,"c":"\"Acele işe şeytan karışır.\" atasözü, telaşla yapılan işlerde hata olacağını anlatır. Diğerleri birikimin, erken eğitimin, tutumluluğun ve danışmanın önemini vurgular."},{"d":"turkce","k":"Sözcükte anlam","q":"Aşağıdaki cümlelerin hangisinde \"tutmak\" sözcüğü \"uygun düşmek, uyuşmak\" anlamında kullanılmıştır?","o":["Çocuk, annesinin elini sıkıca [[tuttu]].","Bu yıl fındık toplamak için iki işçi [[tuttuk]].","Anlattıkları, olayın gerçek akışıyla hiç [[tutmuyor]].","Uzun yolculukta onu deniz [[tuttu]].","Yeni çıkan şarkı gençler arasında çok [[tuttu]]."],"a":2,"c":"\"Anlattıkları olayla tutmuyor\", anlattıklarının gerçekle uyuşmadığı anlamındadır. Diğerlerinde \"kavramak\", \"ücretle çalıştırmak\", \"bulantı vermek\" ve \"beğenilmek\" anlamları vardır."},{"d":"turkce","k":"Yazım","q":"Aşağıdaki cümlelerin hangisinde \"de\" bağlacının yazımıyla ilgili bir yanlışlık yapılmıştır?","o":["Toplantıya sen de gelmelisin.","Annemde bu tarifi çok sever, sık sık yapar.","Kitabı okudum, filmini de izledim.","Bahçede oynayan çocuklar eve döndü.","Sınavda da aynı soruyu sordular."],"a":1,"c":"Birinci cümledeki \"de\", \"dahi\" anlamı katan bağlaçtır ve ayrı yazılmalıdır: \"Annem de\". \"Bahçede\" ve \"Sınavda\" sözcüklerindeki \"-de/-da\" ise bulunma hâli ekidir ve bitişik yazılır."},{"d":"turkce","k":"Yazım","q":"Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?","o":["Kurultay 3 Nisan 2025'te Ankara'da toplandı.","Saat 14.30'da başlayan konser iki saat sürdü.","Hazırladıkları raporu TBMM'ye gönderdiler.","Konferansa yüzelli kişi katıldı.","Bu çalışma, Cumhuriyet'in 100. yılına armağan edildi."],"a":3,"c":"Sayılar ayrı yazılır: \"yüz elli\". Belirli tarihteki ay adı büyük harfle başlar, saat ve dakika nokta ile ayrılır, kısaltmaya ve özel ada gelen ekler kesmeyle ayrılır."},{"d":"turkce","k":"Noktalama","q":"Köyümüzün bahçelerinde elma (I) armut (II) ayva (III) dağlarında ise çam (IV) ardıç ve meşe ağaçları yetişir (V)\nBu cümlede numaralanmış yerlerden hangisine noktalı virgül (;) getirilmelidir?","o":["I","II","III","IV","V"],"a":2,"c":"Virgülle ayrılmış eş görevli sözcük grupları noktalı virgülle ayrılır: \"elma, armut, ayva; dağlarında ise çam, ardıç ve meşe\". I, II ve IV'e virgül, V'e nokta gelir."},{"d":"turkce","k":"Noktalama","q":"Aşağıdaki cümlelerin hangisinde iki nokta (:) yanlış kullanılmıştır?","o":["Yazar: bu romanı tam beş yılda tamamladı.","Dedem bize hep şunu söylerdi: Emek olmadan yemek olmaz.","Çantasına şunları koydu: defter, kalem, silgi ve cetvel.","Toplantıda üç konu konuşuldu: bütçe, personel ve taşınma.","Bu işte tek bir sorun var: zaman."],"a":0,"c":"İki nokta, kendisinden sonra açıklama, örnek ya da alıntı gelecek cümlelerde kullanılır. Özne ile yüklemi gereksiz yere ayıran iki nokta yanlıştır."},{"d":"turkce","k":"Ses olayları","q":"Aşağıdaki cümlelerin hangisinde ünlü daralması vardır?","o":["Kuşlar sabahtan beri ötüşüyor.","Yağmur başlıyor, çamaşırları içeri alalım.","Bu yol köye kadar uzanır.","Akşam yemeğini birlikte yedik.","Rüzgâr bütün gece camları sarstı."],"a":1,"c":"\"Başla-\" fiiline \"-yor\" eki gelince sondaki geniş \"a\" ünlüsü daralarak \"ı\" olur: başlıyor. Diğer cümlelerde ünlü daralması yoktur."},{"d":"turkce","k":"Öge dizilişi","q":"Kütüphanedeki eski el yazmalarını uzmanlar titizlikle dijital ortama aktarıyor.\nBu cümlenin ögeleri aşağıdakilerin hangisinde sırasıyla verilmiştir?","o":["Belirtili nesne – özne – zarf tümleci – yer tamlayıcısı – yüklem","Özne – belirtili nesne – zarf tümleci – yer tamlayıcısı – yüklem","Belirtili nesne – özne – yer tamlayıcısı – zarf tümleci – yüklem","Yer tamlayıcısı – özne – zarf tümleci – belirtili nesne – yüklem","Belirtili nesne – özne – zarf tümleci – belirtisiz nesne – yüklem"],"a":0,"c":"\"Aktarıyor\" yüklem, \"uzmanlar\" özne; \"Kütüphanedeki eski el yazmalarını\" belirtili nesne, \"titizlikle\" zarf tümleci (nasıl?), \"dijital ortama\" yer tamlayıcısıdır (nereye?)."},{"d":"turkce","k":"Sözcük türleri","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük edattır (ilgeç)?","o":["Sabah [[erken]] kalktı.","Pazardan ekmek [[ve]] peynir aldık.","[[Eyvah]], anahtarı evde unuttum!","Bu kitabı senin [[için]] aldım.","Bu işi [[kimse]] bilmiyor."],"a":3,"c":"\"İçin\", \"senin\" sözcüğüyle öbek kurarak amaç ilgisi sağlayan bir edattır. \"Erken\" zarf, \"ve\" bağlaç, \"eyvah\" ünlem, \"kimse\" zamirdir."},{"d":"turkce","k":"Fiilimsi","q":"Aşağıdaki cümlelerin hangisinde zarf-fiil (bağ-fiil) kullanılmamıştır?","o":["Eve gelince hemen sofraya oturdu.","Kitabı okuyarak uykuya daldı.","Kapıyı çalmadan içeri girdi.","Yağmur yağdıkça toprak yumuşadı.","Yazılan mektuplar hâlâ çekmecede duruyor."],"a":4,"c":"\"Yazılan\" sözcüğü \"-an\" ekiyle türemiş bir sıfat-fiildir. \"Gelince\", \"okuyarak\", \"çalmadan\" ve \"yağdıkça\" ise zarf-fiildir."},{"d":"turkce","k":"Fiilimsi","q":"Aşağıdaki cümlelerin hangisinde isim-fiil (ad-eylem) vardır?","o":["Her sabah yürümek ona iyi geliyor.","Koşan çocuk düşüp dizini yaraladı.","Okuduğu kitabı arkadaşına verdi.","Güneş batarken sahile indik.","Gelecek hafta tatile çıkacağız."],"a":0,"c":"\"Yürümek\", \"-mek\" ekiyle kurulmuş bir isim-fiildir. \"Koşan\", \"okuduğu\", \"gelecek\" sıfat-fiil; \"düşüp\" ve \"batarken\" zarf-fiildir."},{"d":"turkce","k":"Ek ve kök","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük, isimden fiil yapım ekiyle türetilmiş bir gövde içermektedir?","o":["Bu [[yazı]] çok güzel olmuş.","Dedem geçen yıl [[gözlük]] takmaya başladı.","[[Sevgi]] her zorluğu yener.","Ellerini sabunla [[temizledi]].","[[Kırık]] camı bugün değiştirdik."],"a":3,"c":"\"Temiz\" ismine \"-le\" eki gelerek \"temizle-\" fiili türemiştir. \"Yazı\", \"sevgi\" ve \"kırık\" fiilden isim; \"gözlük\" isimden isim yapım ekiyle türemiştir."},{"d":"turkce","k":"Cümle türleri","q":"Aşağıdakilerden hangisi yüklemin yerine göre devrik bir cümledir?","o":["Gelmedi bir türlü beklediğimiz haber.","Akşam yemeğini erkenden yedik.","Bu şehirde çocukluğum geçti.","Kar yağınca yollar kapandı.","Kitabı okuduktan sonra arkadaşına verdi."],"a":0,"c":"Yüklemi sonda olmayan cümle devrik cümledir. \"Gelmedi\" yüklemi başta yer aldığı için bu cümle devriktir; diğerleri kurallıdır."},{"d":"turkce","k":"Anlatım bozukluğu","q":"Aşağıdaki cümlelerin hangisinde tümleç eksikliğinden kaynaklanan bir anlatım bozukluğu vardır?","o":["Babam her sabah gazete okur ve haberleri dikkatle izler.","Toplantıya katılanlar, önerilen planı uygun buldu.","Kitabı bitirince bana vermeyi unutma.","Çocuklarını hem çok seviyor hem de güveniyor.","Bu yıl bahçeye domates, biber ve fasulye ektik."],"a":3,"c":"\"Sevmek\" yüklemi \"çocuklarını\" tümlecini alır; \"güvenmek\" ise \"-e\" hâlinde bir tümleç ister. Ortak kullanılan tümleç ikinci yükleme uymadığı için \"onlara\" sözcüğü eksik kalmıştır."},{"d":"turkce","k":"Anlatım bozukluğu","q":"Aşağıdaki cümlelerin hangisinde bir sözcüğün yanlış anlamda kullanılmasından kaynaklanan bir anlatım bozukluğu vardır?","o":["Yeni yönetmelik, yıl sonuna kadar yürürlükte kalacak.","Bu soruna kalıcı bir çözüm bulunmalıdır.","Kütüphane, hafta sonları da okuyuculara açık olacak.","Gelir dağılımındaki uçurum her geçen yıl biraz daha kapanıyor; bu da toplumsal huzursuzluğu artırıyor.","Konser, yoğun yağmura karşın planlanan saatte başladı."],"a":3,"c":"Uçurumun kapanması farkın azalması demektir; bu durumun huzursuzluğu artırması anlamca çelişkilidir. \"Kapanıyor\" yerine \"derinleşiyor\" ya da \"büyüyor\" kullanılmalıdır."},{"d":"turkce","k":"Sözel mantık","q":"Bir müzede yan yana duran ve soldan sağa 1'den 6'ya kadar numaralandırılmış altı vitrinde halı, kilim, çini, seramik, hat ve minyatür eserleri sergilenmektedir. Her vitrinde yalnızca bir tür eser vardır ve her tür yalnızca bir vitrinde sergilenmektedir. Vitrinlerle ilgili bilinenler şunlardır:\n• Çini, seramiğin hemen solundaki vitrindedir.\n• Hat ile minyatür yan yana vitrinlerde değildir.\n• Kilim, 1 ya da 6 numaralı vitrindedir.\n• Halı, çininin solundaki vitrinlerden birindedir.\n• Minyatür 3 numaralı vitrindedir.\n\nBuna göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Kilim 1 numaralı vitrindedir.","Hat 6 numaralı vitrindedir.","Halı 2 numaralı vitrindedir.","Seramik 4 numaralı vitrindedir.","Çini ile minyatür yan yana değildir."],"a":2,"c":"Minyatür 3'te ve halı çininin solunda olduğundan çini-seramik 4-5'e, halı 2'ye yerleşir. Kilim ile hat 1 ve 6'yı paylaşır; iki dizilim mümkündür: kilim-halı-minyatür-çini-seramik-hat ya da hat-halı-minyatür-çini-seramik-kilim. Her ikisinde de halı 2 numaralıdır."},{"d":"turkce","k":"Sözel mantık","q":"Bir müzede yan yana duran ve soldan sağa 1'den 6'ya kadar numaralandırılmış altı vitrinde halı, kilim, çini, seramik, hat ve minyatür eserleri sergilenmektedir. Her vitrinde yalnızca bir tür eser vardır ve her tür yalnızca bir vitrinde sergilenmektedir. Vitrinlerle ilgili bilinenler şunlardır:\n• Çini, seramiğin hemen solundaki vitrindedir.\n• Hat ile minyatür yan yana vitrinlerde değildir.\n• Kilim, 1 ya da 6 numaralı vitrindedir.\n• Halı, çininin solundaki vitrinlerden birindedir.\n• Minyatür 3 numaralı vitrindedir.\n\nBuna göre hattın ve kilimin hangi vitrinlerde olduğunun kesin olarak belirlenebilmesi için aşağıdaki bilgilerden hangisi tek başına yeterlidir?","o":["Halı ile minyatür yan yana vitrinlerdedir.","Çini 4 numaralı vitrindedir.","Seramik 5 numaralı vitrindedir.","Minyatür, halının sağındaki vitrinlerden birindedir.","Seramik, hattın hemen solundaki vitrindedir."],"a":4,"c":"Olası iki dizilim kilim-halı-minyatür-çini-seramik-hat ile hat-halı-minyatür-çini-seramik-kilim'dir. Seramiğin hattın hemen solunda olması yalnızca ilk dizilimde sağlanır; diğer bilgiler iki dizilimde de doğrudur."},{"d":"turkce","k":"Sözel mantık","q":"Bir müzede yan yana duran ve soldan sağa 1'den 6'ya kadar numaralandırılmış altı vitrinde halı, kilim, çini, seramik, hat ve minyatür eserleri sergilenmektedir. Her vitrinde yalnızca bir tür eser vardır ve her tür yalnızca bir vitrinde sergilenmektedir. Vitrinlerle ilgili bilinenler şunlardır:\n• Çini, seramiğin hemen solundaki vitrindedir.\n• Hat ile minyatür yan yana vitrinlerde değildir.\n• Kilim, 1 ya da 6 numaralı vitrindedir.\n• Halı, çininin solundaki vitrinlerden birindedir.\n• Minyatür 3 numaralı vitrindedir.\n\nBuna göre\nI. hat,\nII. kilim,\nIII. seramik\neserlerinden hangileri 6 numaralı vitrinde sergileniyor olabilir?","o":["Yalnız I","Yalnız III","I ve II","I ve III","II ve III"],"a":2,"c":"Çini 4'te, seramik 5'te olmak zorundadır; kilim ile hat ise 1 ve 6 numaralı vitrinleri kendi aralarında paylaşır. Bu yüzden 6 numaralı vitrinde hat ya da kilim olabilir, seramik olamaz."},{"d":"turkce","k":"Sözel mantık","q":"Bir okulda Arda, Begüm, Cansu, Doğan ve Eren adlı beş öğrencinin her biri resim, müzik ve tiyatro kulüplerinden yalnızca birine kayıtlıdır. Her kulüpte en az bir öğrenci vardır. Kulüplerle ilgili bilinenler şunlardır:\n• Arda ile Begüm aynı kulüptedir.\n• Cansu müzik kulübünde değildir.\n• Doğan ile Eren farklı kulüplerdedir.\n• Tiyatro kulübünde yalnızca bir öğrenci vardır ve bu öğrenci Eren değildir.\n• Müzik kulübündeki öğrenci sayısı, resim kulübündeki öğrenci sayısından fazladır.\n\nBuna göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Cansu tiyatro kulübündedir.","Eren müzik kulübündedir.","Doğan resim kulübündedir.","Resim kulübünde iki öğrenci vardır.","Begüm müzik kulübündedir."],"a":4,"c":"Tiyatroda bir kişi olduğundan kalan dört kişi müzik ve resme dağılır ve müzik fazla olmalıdır: müzikte 3, resimde 1 kişi. Arda ile Begüm birlikte resimde olamaz, öyleyse ikisi de müziktedir. Olası dağılımlar: Cansu tiyatro-Doğan müzik-Eren resim; Cansu tiyatro-Doğan resim-Eren müzik; Cansu resim-Doğan tiyatro-Eren müzik. Begüm her durumda müziktedir."},{"d":"turkce","k":"Sözel mantık","q":"Bir okulda Arda, Begüm, Cansu, Doğan ve Eren adlı beş öğrencinin her biri resim, müzik ve tiyatro kulüplerinden yalnızca birine kayıtlıdır. Her kulüpte en az bir öğrenci vardır. Kulüplerle ilgili bilinenler şunlardır:\n• Arda ile Begüm aynı kulüptedir.\n• Cansu müzik kulübünde değildir.\n• Doğan ile Eren farklı kulüplerdedir.\n• Tiyatro kulübünde yalnızca bir öğrenci vardır ve bu öğrenci Eren değildir.\n• Müzik kulübündeki öğrenci sayısı, resim kulübündeki öğrenci sayısından fazladır.\n\nDoğan müzik kulübünde olduğuna göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Cansu resim kulübündedir.","Eren tiyatro kulübündedir.","Eren resim kulübündedir.","Müzik kulübünde iki öğrenci vardır.","Arda tiyatro kulübündedir."],"a":2,"c":"Müzikte üç, resimde bir, tiyatroda bir öğrenci vardır ve Arda ile Begüm müziktedir. Doğan da müzikteyse müzik dolar; Eren tiyatroda olamayacağı için resimde, Cansu da tiyatrodadır."},{"d":"turkce","k":"Sözel mantık","q":"Bir okulda Arda, Begüm, Cansu, Doğan ve Eren adlı beş öğrencinin her biri resim, müzik ve tiyatro kulüplerinden yalnızca birine kayıtlıdır. Her kulüpte en az bir öğrenci vardır. Kulüplerle ilgili bilinenler şunlardır:\n• Arda ile Begüm aynı kulüptedir.\n• Cansu müzik kulübünde değildir.\n• Doğan ile Eren farklı kulüplerdedir.\n• Tiyatro kulübünde yalnızca bir öğrenci vardır ve bu öğrenci Eren değildir.\n• Müzik kulübündeki öğrenci sayısı, resim kulübündeki öğrenci sayısından fazladır.\n\nBuna göre\nI. Cansu,\nII. Doğan,\nIII. Eren\nöğrencilerinden hangileri resim kulübünde olabilir?","o":["Yalnız I","Yalnız III","I ve II","II ve III","I, II ve III"],"a":4,"c":"Olası dağılımlar (müzik / resim / tiyatro): Arda, Begüm, Doğan / Eren / Cansu; Arda, Begüm, Eren / Doğan / Cansu; Arda, Begüm, Eren / Cansu / Doğan. Resim kulübünde Eren, Doğan ya da Cansu bulunabilir."},{"d":"turkce","k":"Sözel mantık","q":"Bir kitapçıda kasa önünde tek sıra hâlinde bekleyen Gizem, Hakan, Irmak, Kemal, Lale ve Murat adlı altı kişinin her biri ya bir roman ya da bir şiir kitabı satın almıştır. Üç kişi roman, üç kişi şiir kitabı almıştır. Sıra ve alınan kitaplarla ilgili bilinenler şunlardır:\n• Sırada art arda duran iki kişinin ikisi birden şiir kitabı almamıştır.\n• Hakan, Irmak'ın hemen önündedir.\n• Lale sıranın dördüncüsüdür ve şiir kitabı almıştır.\n• Gizem ile Murat arasında iki kişi vardır.\n• Kemal roman almıştır ve sıranın ilk kişisi değildir.\n\nBuna göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Gizem sıranın üçüncüsüdür.","Kemal sıranın beşincisidir.","Hakan roman almıştır.","Murat şiir kitabı almıştır.","Irmak, Gizem'in hemen arkasındadır."],"a":1,"c":"Gizem ile Murat 3 ve 6. sıralarda olmak zorundadır (1-4 ve 2-5 Lale'yle ya da Hakan-Irmak bloğuyla çakışır). Hakan-Irmak 1-2'ye, Kemal 5'e yerleşir. Kitaplar dönüşümlü olduğundan 3 ve 5 roman, 6 şiirdir; 1 ile 2'den biri roman, biri şiirdir. Kemal her durumda beşincidir."},{"d":"turkce","k":"Sözel mantık","q":"Bir kitapçıda kasa önünde tek sıra hâlinde bekleyen Gizem, Hakan, Irmak, Kemal, Lale ve Murat adlı altı kişinin her biri ya bir roman ya da bir şiir kitabı satın almıştır. Üç kişi roman, üç kişi şiir kitabı almıştır. Sıra ve alınan kitaplarla ilgili bilinenler şunlardır:\n• Sırada art arda duran iki kişinin ikisi birden şiir kitabı almamıştır.\n• Hakan, Irmak'ın hemen önündedir.\n• Lale sıranın dördüncüsüdür ve şiir kitabı almıştır.\n• Gizem ile Murat arasında iki kişi vardır.\n• Kemal roman almıştır ve sıranın ilk kişisi değildir.\n\nMurat roman aldığına göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Hakan roman almıştır.","Irmak şiir kitabı almıştır.","Kemal sıranın dördüncüsüdür.","Gizem sıranın altıncısıdır.","Gizem roman almıştır."],"a":3,"c":"Sıralama Hakan, Irmak, (Gizem/Murat), Lale, Kemal, (Murat/Gizem) biçimindedir; 3. kişi roman, 6. kişi şiir alır. Murat roman aldıysa 3., Gizem de 6. sıradadır. Hakan ile Irmak'ın kitapları ise belirlenemez."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Bir kentin belleği yalnızca müzelerde ve anıtlarda saklanmaz. Eski bir fırının önünden geçerken duyulan ekmek kokusu, yıllardır aynı köşede çalışan ayakkabı tamircisinin selamı, taş döşeli bir sokağın yağmurdan sonraki sesi de o belleğin parçasıdır. Bu küçük ayrıntılar silindiğinde kent, haritadaki yerini korusa da kimliğini yitirmeye başlar. Bu yüzden kentleri korumak, büyük yapıları onarmak kadar gündelik hayatın sürekliliğini gözetmeyi de gerektirir.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Kentlerin kimliği, gündelik yaşamın sıradan görünen ayrıntılarıyla da korunur.","Müzeler ve anıtlar, bir kentin tarihini öğrenmenin en güvenilir yoludur.","Eski meslekler, modern kentlerde ekonomik değerini yitirmiştir.","Kentlerin haritadaki yerleri zamanla değişebilmektedir.","Büyük yapıların onarımı, kent yönetimlerinin öncelikli görevi olmalıdır."],"a":0,"c":"Parçanın son cümlesi, kenti korumanın gündelik hayatın küçük ayrıntılarını da korumayı gerektirdiğini söylüyor. Diğer şıklar ya parçada geçmiyor ya da yalnızca bir ayrıntıyı öne çıkarıyor."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Çocuklara kitap okumayı sevdirmenin yolu, onlara okunacak kitapların listesini vermekten geçmez. Zorunlu olarak okunan her sayfa, çocuğun gözünde okumayı bir ödeve dönüştürür. Oysa evde anne babasını elinde kitapla gören, kitaplar üzerine sohbet edilen bir ortamda büyüyen çocuk, okumayı hayatın doğal bir parçası olarak benimser. Kısacası okuma alışkanlığı öğretilmekten çok örnek alınarak kazanılır.\nBu parçada vurgulanmak istenen düşünce aşağıdakilerden hangisidir?","o":["Çocuklara yaşlarına uygun kitaplar seçilmelidir.","Okul, okuma alışkanlığının kazanıldığı tek yerdir.","Okuma alışkanlığı, çocuğun yakın çevresinde gördüğü örneklerle gelişir.","Kitap listeleri, çocukların okuma hızını artırır.","Ödev olarak verilen kitaplar daha dikkatli okunur."],"a":2,"c":"\"Kısacası\" ile başlayan son cümle ana düşünceyi verir: Okuma alışkanlığı örnek alınarak kazanılır. Parça listeyle ve zorunlulukla okutmanın işe yaramadığını söylediği için B, D ve E ters düşer."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Bilimsel bir buluşun değeri çoğu zaman ortaya çıktığı anda anlaşılmaz. Gregor Mendel'in bezelyeler üzerinde yaptığı kalıtım deneyleri, yayımlandıktan sonra otuz yılı aşkın bir süre neredeyse hiç ilgi görmemiştir. Ancak yüzyılın sonunda başka araştırmacılar benzer sonuçlara ulaşınca Mendel'in çalışması yeniden keşfedilmiş ve genetik biliminin temeli sayılmıştır. Demek ki bir fikrin önemi, bazen onu anlayacak birikimin oluşmasını beklemek zorundadır.\nBu parçanın ana düşüncesi aşağıdakilerden hangisidir?","o":["Bilimsel çalışmalar ancak deneylerle doğrulandığında kabul görür.","Mendel, çağının en çok tanınan bilim insanlarından biridir.","Genetik bilimi yalnızca bitkiler üzerinde yapılan deneylere dayanır.","Bir buluşun değeri, ancak onu kavrayabilecek bilgi birikimi oluştuğunda anlaşılabilir.","Bilim insanları birbirlerinin çalışmalarından habersiz araştırma yapmamalıdır."],"a":3,"c":"Mendel örneği, bir buluşun değerinin onu anlayacak birikim oluşunca fark edildiğini göstermek için verilmiştir; bunu son cümle açıkça söyler. B, parçadaki bilgiyle çelişir."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Bir dağcı için zirveye ulaşmak elbette önemlidir; fakat deneyimli dağcılar, asıl ustalığın inişte ortaya çıktığını bilir. Zirvedeki sevinç, yorgunluğu unutturur ve dikkatin dağılmasına yol açar. Kazaların büyük bölümünün dönüş yolunda yaşanması da bundan kaynaklanır. Bu nedenle iyi bir dağcı, gücünü yalnızca tırmanışa göre değil, güvenle geri dönebileceği biçimde ayarlar.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Dağcılık, iyi bir fiziksel hazırlık gerektiren bir spordur.","Zirveye ulaşamayan dağcı başarısız sayılmamalıdır.","Dağcılar, tırmanışa başlamadan önce hava koşullarını incelemelidir.","Zirvedeki sevinç, dağcıların emeğinin en büyük karşılığıdır.","Dağcılıkta başarı, zirveye ulaşmanın yanında güvenle geri dönebilmeyi de gerektirir."],"a":4,"c":"Parça, ustalığın inişte ortaya çıktığını ve iyi dağcının gücünü güvenli dönüşe göre ayarladığını vurguluyor. Hava koşullarından ve fiziksel hazırlıktan söz edilmiyor."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Bir çevirmen, metni bir dilden ötekine aktarırken yalnızca sözcükleri değil, o sözcüklerin taşıdığı kültürü de taşımak zorundadır. Bir atasözünü kelimesi kelimesine çevirmek çoğu zaman okurda anlamsız bir tümce bırakır. Usta çevirmen, kaynak dildeki söyleyişin hedef dilde uyandıracağı etkiyi gözetir ve gerektiğinde sözcüklerden uzaklaşarak anlama sadık kalır. Bu yüzden iyi bir çeviri, aslına benzeyen değil, aslının etkisini yeniden yaratan metindir.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Atasözleri başka dillere çevrilemeyen anlatımlardır.","İyi bir çeviri, kaynak metnin okurda bıraktığı etkiyi hedef dilde yeniden oluşturabilmelidir.","Çevirmenler kaynak metnin sözcüklerine bağlı kalmalıdır.","Her dilin kendine özgü bir söz varlığı vardır.","Çeviri, yazarlıktan daha zor bir uğraştır."],"a":1,"c":"Son cümle ana düşünceyi verir: İyi çeviri, aslının etkisini yeniden yaratır. A aşırı genellemedir; parça atasözlerinin çevrilemeyeceğini değil, kelimesi kelimesine çevrilmemesi gerektiğini söyler."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Kuşlar göç ederken yollarını bulmak için birden fazla ipucundan yararlanır. Gündüz uçanlar güneşin konumuna, gece uçanlar yıldızlara bakarak yön belirler. Bulutlu havalarda ise dünyanın manyetik alanını algılayabilmeleri onları yanılmaktan korur. Bazı türlerin dağ, kıyı ve ırmak gibi belirgin yeryüzü şekillerini de hafızalarında tuttukları bilinmektedir.\nBu parçadan aşağıdakilerin hangisine ulaşılabilir?","o":["Kuşlar, göç yolunu belirlerken tek bir kaynağa bağımlı kalmaz.","Gece göç eden kuşlar, gündüz uçanlardan daha uzun yol kat eder.","Manyetik alanı algılayabilen tek canlılar kuşlardır.","Kuşların göç yolları her yıl değişir.","Bulutlu havalarda kuşlar göçe ara verir."],"a":0,"c":"Parça güneş, yıldızlar, manyetik alan ve yeryüzü şekilleri gibi birden çok ipucunu sayıyor; bu, kuşların tek bir kaynağa bağlı kalmadığını gösterir. E yanlıştır, çünkü bulutlu havada manyetik alandan yararlandıkları söyleniyor."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Ahşap oyma sanatı, Anadolu'da Selçuklulardan bu yana süregelen köklü bir gelenektir. Ustalar çoğunlukla ceviz, armut ve sedir gibi sert ağaçları tercih eder; çünkü bu ağaçlar ince işçiliğe elverişlidir ve zamanla çatlamaz. Cami kapıları, minberler ve rahleler bu sanatın en seçkin örneklerini oluşturur. Günümüzde ise usta-çırak ilişkisinin zayıflaması nedeniyle bu sanatı sürdüren kişilerin sayısı giderek azalmaktadır.\nBu parçada ahşap oymacılıkla ilgili aşağıdakilerden hangisine değinilmemiştir?","o":["Kullanılan ağaç türlerine","Tarihî geçmişine","Uygulandığı eserlere","Günümüzde karşılaştığı soruna","Yapımında kullanılan aletlere"],"a":4,"c":"Ağaç türleri (ceviz, armut, sedir), geçmiş (Selçuklular), eserler (kapı, minber, rahle) ve sorun (usta-çırak ilişkisinin zayıflaması) parçada var; kullanılan aletlerden söz edilmiyor."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Kumaş boyacılığında kullanılan doğal boyalar, yüzyıllar boyunca bitkilerden, böceklerden ve minerallerden elde edildi. Kökboya bitkisinden kırmızı, cehriden sarı, çivit otundan mavi renk alınırdı. Bu boyalarla renklendirilen kumaşlar, ışığa ve yıkamaya karşı oldukça dayanıklıydı. Ancak on dokuzuncu yüzyılda sentetik boyaların bulunmasıyla doğal boyacılık hızla geriledi; ucuz ve kolay üretilen yapay boyalar pazarı ele geçirdi.\nBu parçaya göre doğal boyalarla ilgili aşağıdakilerden hangisi söylenemez?","o":["Farklı kaynaklardan elde edilmiştir.","Bunlarla boyanan kumaşların rengi kolay solmaz.","Günümüzde yeniden yaygınlaşmaya başlamıştır.","Sentetik boyaların ortaya çıkmasıyla kullanımı azalmıştır.","Elde edilmesi, yapay boyalara göre daha zahmetlidir."],"a":2,"c":"Parçada doğal boyaların günümüzde yeniden yaygınlaştığına dair bir bilgi yok. E, yapay boyaların \"ucuz ve kolay üretilen\" diye nitelenmesinden çıkarılabilir."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Arı sütü, genç işçi arıların baş kısmındaki bezlerden salgılanan yoğun kıvamlı bir maddedir. Kovandaki bütün larvalar ilk üç gün bu maddeyle beslenir; ancak yalnızca ana arı olacak larva, yaşamı boyunca arı sütüyle beslenmeye devam eder. Bu beslenme farkı, ana arının işçi arılardan iri olmasını ve yıllarca yaşamasını sağlar. İşçi arıların ömrü ise birkaç haftayla birkaç ay arasında değişir.\nBu parçaya göre aşağıdakilerden hangisi söylenebilir?","o":["Arı sütü, kovandaki bütün arılar tarafından üretilir.","Ana arı ile işçi arılar arasındaki farkların oluşmasında beslenme etkilidir.","İşçi arılar, larva döneminde hiç arı sütü almaz.","Ana arı, işçi arılardan daha kısa yaşar.","Arı sütü, larvaların yalnızca bir kısmına verilir."],"a":1,"c":"Parça, beslenme farkının ana arıyı daha iri ve uzun ömürlü yaptığını söylüyor. C ve E, bütün larvaların ilk üç gün arı sütüyle beslendiği bilgisiyle; A ise sütü yalnızca genç işçi arıların salgıladığı bilgisiyle çelişir."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Halk hikâyeleri, âşıkların kahvehanelerde ve düğünlerde anlattığı, nesirle nazmın iç içe geçtiği anlatılardır. Hikâyede olaylar düzyazıyla aktarılır; kahramanların duyguları ise genellikle saz eşliğinde söylenen türkülerle dile getirilir. Anlatıcı, dinleyicinin ilgisini canlı tutmak için hikâyeyi her seferinde biraz değiştirebilir. Bu yüzden aynı hikâyenin birbirinden farklı pek çok anlatımına rastlanır.\nBu parçada halk hikâyeleriyle ilgili aşağıdakilerden hangisine değinilmemiştir?","o":["Anlatıldığı ortamlara","Biçim özelliklerine","Farklı anlatımlarının bulunma nedenine","Konularının nereden alındığına","Kahramanların duygularının nasıl aktarıldığına"],"a":3,"c":"Ortam (kahvehane, düğün), biçim (nesir ve nazım), farklı anlatımların nedeni (anlatıcının değişiklik yapması) ve duyguların türkülerle aktarılması parçada var; konuların kaynağına değinilmemiş."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Yazar, ilk romanını kırk yaşını geçtikten sonra yayımladı. O güne kadar öğretmenlik yapmış, yazdıklarını kimseye göstermeden çekmecesinde saklamıştı. Romanın yayımlanmasının ardından eleştirmenler, onun yalın ama derinlikli dilini övdü. Yazar ise kendisiyle yapılan söyleşilerde, geç başlamanın kendisine acele etmeden olgunlaşma fırsatı verdiğini söyledi. Sonraki on yılda üç roman daha yazdı ve bunların her biri ilki kadar ilgi gördü.\nBu parçaya göre yazarla ilgili aşağıdakilerden hangisi söylenemez?","o":["Öğretmenliği bırakıp yalnızca yazmaya yönelmiştir.","Yazmaya, ilk romanını yayımlamadan çok önce başlamıştır.","Dili eleştirmenlerce beğenilmiştir.","Edebiyata geç adım atmayı kendisi için bir kazanç olarak görmüştür.","Yayımlanan romanları ilgi görmüştür."],"a":0,"c":"Parçada yazarın öğretmenliği bırakıp bırakmadığına dair bilgi yok. B, yazdıklarını yıllarca çekmecesinde saklamasından; D ise geç başlamanın ona olgunlaşma fırsatı verdiğini söylemesinden çıkarılır."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Tuz Gölü, Türkiye'nin en büyük ikinci gölüdür ve Konya, Aksaray ile Ankara illerinin sınırları içinde yer alır. Gölün derinliği yaz aylarında birkaç santimetreye kadar düşer; bu dönemde yüzeyi kalın bir tuz tabakasıyla kaplanır. Ülkemizde tüketilen sofra tuzunun önemli bir kısmı bu gölden elde edilir. Göl, aynı zamanda flamingoların üreme alanlarından biridir.\nBu parçada aşağıdaki soruların hangisinin cevabı yoktur?","o":["Tuz Gölü hangi illerin sınırları içindedir?","Gölün yaz aylarındaki derinliği ne kadardır?","Göl, hangi jeolojik olaylar sonucunda oluşmuştur?","Göl, hangi kuş türünün üreme alanıdır?","Gölün ülke ekonomisine katkısı nedir?"],"a":2,"c":"Gölün oluşumuyla ilgili bir bilgi verilmemiş. İller, yazın derinliği, flamingolar ve sofra tuzu üretimi (ekonomik katkı) parçada yer alıyor."},{"d":"turkce","k":"Paragraf tamamlama","q":"Pek çok insan, hata yapmaktan korktuğu için yeni bir işe başlamayı sürekli erteler. Her şeyin kusursuz olacağı bir anı beklerken zaman geçer ve o an hiçbir zaman gelmez. Oysa ustalık, ilk denemelerin acemiliğinden geçerek kazanılır; hatalar bu yolun kaçınılmaz duraklarıdır. Kısacası ----\nBu parçanın sonuna düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","o":["yeni işlere başlamadan önce ayrıntılı bir plan yapmak gerekir.","hata yapmamak için deneyimli kişilerden yardım almalıyız.","ustalar, öğrencilerinin hatalarına karşı hoşgörülü olmalıdır.","kusursuzluğu beklemek, insanı yerinde saydırmaktan başka bir işe yaramaz.","zamanı iyi kullanan insanlar her işte başarılı olur."],"a":3,"c":"\"Kısacası\" sözü parçanın özetini ister: Kusursuz anı beklemek insanı ilerletmez, hatalar ustalığın parçasıdır. B, hatalardan kaçınmayı önerdiği için parçanın düşüncesine ters düşer."},{"d":"turkce","k":"Paragraf tamamlama","q":"Eski evlerin avluları, yalnızca evin bir parçası değil, aile yaşamının merkeziydi. ---- Yaz akşamları sofralar burada kurulur, komşular burada ağırlanır, çocuklar burada oyun oynardı. Apartman yaşamına geçişle birlikte bu ortak alan ortadan kalktı ve aile bireyleri evin ayrı odalarına çekildi.\nBu parçada boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","o":["Gündelik hayatın pek çok etkinliği bu açık alanda gerçekleşirdi.","Avluların zemini genellikle yöreden çıkarılan taşlarla döşenirdi.","Apartmanlar, kentlerdeki konut sorununa hızlı bir çözüm getirmiştir.","Eski evlerin çoğu, bugün bakımsızlık nedeniyle yıkılmak üzeredir.","Avlunun duvarları, evi sokağın gürültüsünden korurdu."],"a":0,"c":"Boşluktan önce avlunun aile yaşamının merkezi olduğu söyleniyor, sonra burada yapılan etkinlikler sayılıyor. Bu ikisini bağlayan cümle A'dır; diğerleri avlunun yapısına ya da apartmanlara kayıyor."},{"d":"turkce","k":"Paragraf tamamlama","q":"---- Gerçekten de sabahları tarladan dönen bir köylü, havanın kokusundan yağmurun yaklaştığını anlayabilir. Kırlangıçların alçaktan uçması, karıncaların yuvalarının ağzını kapatması da onun için birer işarettir. Bu bilgiler herhangi bir okulda öğretilmez; kuşaktan kuşağa aktarılarak yaşatılır.\nBu parçanın başına düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","o":["Meteoroloji, son yıllarda hava tahminlerinde büyük ilerleme kaydetmiştir.","Kırsal kesimde yaşayanların sayısı her geçen yıl azalmaktadır.","Toprakla iç içe yaşayan insanlar, doğanın verdiği işaretleri okumayı deneyimle öğrenir.","Karıncalar, yağıştan önce yiyecek depolamaya özen gösterir.","Yağmur, tarım için en önemli doğal kaynaklardan biridir."],"a":2,"c":"\"Gerçekten de\" ile başlayan cümle, ilk cümlede söylenen bir yargıyı örneklendirir. Köylünün doğadaki işaretleri okuması ve bu bilginin deneyimle aktarılması, C'deki yargıyı destekler."},{"d":"turkce","k":"Paragraf tamamlama","q":"Bir müzik parçasında sessizlik de en az sesler kadar önemlidir. Notalar arasındaki kısa duraklar, dinleyicinin duyduğunu algılamasına ve bir sonraki sesi beklemesine imkân tanır. Usta besteciler bu duraklamaları rastgele değil, büyük bir özenle yerleştirir. ----\nBu parçanın sonuna düşüncenin akışına göre aşağıdakilerden hangisi getirilmelidir?","o":["Bu nedenle müzik eğitimine küçük yaşlarda başlanmalıdır.","Klasik müzik, diğer türlere göre daha fazla dikkat ister.","Her müzik aletinin kendine özgü bir tınısı vardır.","Dinleyiciler genellikle hızlı ritimli parçaları tercih eder.","Sessizliği iyi kullanan besteci, aslında sesleri de daha etkili kılar."],"a":4,"c":"Parça sessizliğin müzikteki işlevini anlatıyor ve usta bestecilerin duraklamaları özenle yerleştirdiğini söylüyor. Bu düşünceyi sonuca bağlayan E'dir; diğerleri konudan uzaklaşıyor."},{"d":"turkce","k":"Paragraf tamamlama","q":"Kâğıda yazmak ile ekranda yazmak arasında yalnızca araç farkı yoktur. Kalemle yazan kişi, silmenin zahmetli olduğunu bildiği için cümlesini kurmadan önce daha uzun düşünür. ---- Bu yüzden bazı yazarlar ilk taslaklarını hâlâ elle yazmayı tercih etmektedir.\nBu parçada boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","o":["Kâğıt üretimi, ormanların azalmasına yol açan etkenlerden biridir.","Ekranda ise yazmak kolaylaştığı için düşünce, cümleye dönüşmeden önce çoğu zaman yeterince olgunlaşmaz.","Bilgisayarlar, yazarların işini önemli ölçüde hızlandırmıştır.","El yazısı, kişinin karakteri hakkında ipuçları verir.","Okurlar, basılı kitapları elektronik kitaplara tercih etmektedir."],"a":1,"c":"Boşluktan önce kalemle yazmanın, sonra ekranda yazmanın durumu anlatılmalı ki \"Bu yüzden\" ile elle yazmanın tercih edilmesine varılsın. C ekranı övdüğü için sonraki cümleye bağlanmaz."},{"d":"turkce","k":"Paragrafta akışı bozan cümle","q":"(I) Uyku, vücudun gün içinde yıpranan dokularını onardığı temel bir süreçtir. (II) Derin uyku evresinde büyüme hormonu salgılanır ve kaslar yenilenir. (III) Beyin de bu sırada gün boyunca edindiği bilgileri düzenleyerek kalıcı belleğe aktarır. (IV) Uykusuzluğun en yaygın nedenlerinden biri, akşam saatlerinde tüketilen kafeinli içeceklerdir. (V) Bu nedenle yeterince uyumayan kişilerde hem fiziksel yorgunluk hem de unutkanlık sık görülür.\nBu parçada numaralanmış cümlelerden hangisi düşüncenin akışını bozmaktadır?","o":["I","II","III","IV","V"],"a":3,"c":"Parça uykunun vücuda ve belleğe yararını anlatıyor; V. cümle de bunun sonucunu veriyor. IV. cümle uykusuzluğun nedenine geçerek akışı bozuyor."},{"d":"turkce","k":"Paragrafta akışı bozan cümle","q":"(I) Lale, Osmanlı kültüründe yalnızca bir çiçek değil, bir estetik simgeydi. (II) Laleler, soğanlarından yetiştirilen ve ilkbaharda açan bitkilerdir. (III) On sekizinci yüzyılın başlarında lale yetiştiriciliği öyle ilgi gördü ki dönemin adı bile bu çiçekle anılır oldu. (IV) Nadir lale soğanları için servet denebilecek bedeller ödeniyor, yeni türlere şairane adlar veriliyordu. (V) Çiniden kumaşa, mezar taşından minyatüre pek çok sanat dalında lale motifine rastlanması da bu ilginin bir yansımasıdır.\nBu parçada numaralanmış cümlelerden hangisi düşüncenin akışını bozmaktadır?","o":["I","II","III","IV","V"],"a":1,"c":"Parça lalenin Osmanlı kültüründeki yerini anlatıyor. II. cümle ise bitkinin botanik özelliğine değinerek konunun dışına çıkıyor."},{"d":"turkce","k":"Paragrafta akışı bozan cümle","q":"(I) Kuraklık, yalnızca yağışın azalmasıyla değil, suyun bilinçsizce kullanılmasıyla da derinleşen bir sorundur. (II) Tarımda vahşi sulama yöntemleri, kullanılan suyun büyük bölümünün buharlaşarak boşa gitmesine yol açar. (III) Kentlerde ise eskimiş şebeke borularındaki kaçaklar ciddi kayıplara neden olur. (IV) Damla sulama ve şebeke yenileme çalışmaları bu kayıpları önemli ölçüde azaltabilir. (V) Barajlar, elektrik üretiminde de yararlanılan büyük yapılardır.\nBu parçada numaralanmış cümlelerden hangisi düşüncenin akışını bozmaktadır?","o":["I","II","III","IV","V"],"a":4,"c":"Parça su israfının kuraklığı derinleştirmesini ve çözümlerini anlatıyor. V. cümle barajların elektrik üretimindeki yerine geçerek akışı bozuyor."},{"d":"turkce","k":"Paragraf yapısı","q":"(I) Kapadokya'daki peri bacaları, milyonlarca yıl önce yanardağlardan çıkan küllerin katılaşmasıyla oluşan tüf tabakalarının aşınmasıyla meydana gelmiştir. (II) Yağmur, rüzgâr ve sıcaklık farkları yumuşak tüfü aşındırırken üstteki sert kayaçlar şapka gibi kalmış ve bu ilginç şekiller ortaya çıkmıştır. (III) Bölge, yalnızca doğal güzellikleriyle değil, insanların bu yumuşak kayaya oyduğu yapılarla da dikkat çeker. (IV) Yüzyıllar boyunca burada yaşayanlar, kayalara evler, kiliseler ve yer altı şehirleri oymuştur. (V) Bu yapılar, bölgeyi günümüzde dünyanın dört bir yanından gelen ziyaretçiler için bir cazibe merkezi hâline getirmiştir. (VI) Özellikle balon turları, bölgeyi gökyüzünden izlemek isteyenlerin vazgeçilmez etkinliği olmuştur.\nBu parça iki paragrafa ayrılmak istense ikinci paragraf hangi cümleyle başlar?","o":["II","III","IV","V","VI"],"a":1,"c":"I ve II. cümleler peri bacalarının oluşumunu anlatır. III. cümle, \"yalnızca doğal güzellikleriyle değil\" diyerek insan eliyle oyulan yapılara, yani yeni bir konuya geçer."},{"d":"turkce","k":"Paragraf yapısı","q":"(I) Bu nedenle uzmanlar, ekran başında geçen her yirmi dakikanın ardından yirmi saniye boyunca uzaktaki bir noktaya bakılmasını önermektedir. (II) Günümüzde pek çok insan, gününün büyük bölümünü bilgisayar ve telefon ekranlarına bakarak geçirmektedir. (III) Bu basit alışkanlık, göz kaslarının gevşemesine ve yorgunluğun azalmasına yardımcı olur. (IV) Uzun süre yakına odaklanmak ise göz kaslarını sürekli kasılı tutarak yorgunluğa yol açar.\nBu cümlelerle anlamlı bir paragraf oluşturulduğunda sıralama nasıl olmalıdır?","o":["I - II - III - IV","II - I - IV - III","II - IV - I - III","IV - II - I - III","II - IV - III - I"],"a":2,"c":"Genel durumu veren II başa gelir; IV sorunu açıklar, I (\"Bu nedenle\") öneriyi sunar, III (\"Bu basit alışkanlık\") önerinin yararını söyler."},{"d":"turkce","k":"Cümlede anlam","q":"Kendi sesine kulak vermeyen yazar, başkalarının sözlerini yinelemekten öteye geçemez.\nBu cümleyle anlatılmak istenen aşağıdakilerden hangisidir?","o":["Yazarlar, başka yazarların eserlerini okumaktan kaçınmalıdır.","Özgün bir eser, yazarın kendi iç dünyasını dinleyebilmesiyle ortaya çıkar.","Başkalarının görüşlerine yer veren eserler değersizdir.","Yazarlar, eserlerini yüksek sesle okuyarak düzeltmelidir.","Yazarlık, uzun yıllar süren bir çıraklık ister."],"a":1,"c":"Olumsuz kurulmuş cümlenin olumlu karşılığı: Kendi sesini dinleyen yazar özgün olur. A ve C aşırı yorumdur; D \"ses\" sözcüğünü gerçek anlamıyla alır."},{"d":"turkce","k":"Cümlede anlam","q":"(I) Ressamın son sergisi, şehrin en eski kervansarayında açıldı. (II) Sergide yağlı boyayla yapılmış otuz iki tablo yer alıyor. (III) Tabloların çoğu, sanatçının son iki yılda Ege kıyılarında yaptığı gezilerde çizilmiş. (IV) Mavinin tonlarını bu kadar ustalıkla kullanan başka bir ressam günümüzde yok gibidir. (V) Sergi, ay sonuna kadar ziyaret edilebilecek.\nBu parçadaki numaralanmış cümlelerin hangisinde kişisel bir yargı vardır?","o":["I","II","III","IV","V"],"a":3,"c":"IV. cümledeki \"bu kadar ustalıkla kullanan başka bir ressam yok gibidir\" yargısı kişiden kişiye değişir, kanıtlanamaz. Diğer cümleler doğruluğu araştırılabilecek bilgiler içerir."},{"d":"turkce","k":"Cümlede anlam","q":"Aşağıdaki cümlelerin hangisinde neden-sonuç ilişkisi vardır?","o":["Yol çalışması olduğundan servis bugün yarım saat gecikti.","Toplantıya katılmak için sabah erkenden yola çıktı.","Çalışırsan bu sınavı rahatlıkla geçersin.","Kitabı bitirir bitirmez kütüphaneye geri götürdü.","Hava güzel olsa da pikniğe gitmedik."],"a":0,"c":"Servisin gecikmesinin nedeni yol çalışmasıdır. B'de amaç-sonuç, C'de koşul, D'de zaman, E'de karşıtlık ilişkisi vardır."},{"d":"turkce","k":"Cümlede anlam","q":"Aşağıdaki cümlelerin hangisinde amaç-sonuç ilişkisi vardır?","o":["Yağmur yağınca sokaklar göle döndü.","Bu yolu izlersen köye daha erken ulaşırsın.","Fiyatlar arttığı için alışverişi erteledik.","Sabahleyin erkenden kalkıp bahçeyi suladı.","Çocuklar uyanmasın diye sessizce konuşuyorduk."],"a":4,"c":"\"Uyanmasın diye\" sözü sessiz konuşmanın amacını bildirir. A ve C'de neden-sonuç, B'de koşul vardır; D'de ise iki eylem art arda sıralanmıştır."},{"d":"turkce","k":"Cümlede anlam","q":"Eski ustalar, bir çömleği çarkta biçimlendirirken çamura söz geçirmeye değil, onun ne olmak istediğini anlamaya çalışırdı. Toprağın nemine, dokusuna, elin altında verdiği tepkiye kulak verir; biçimi buna göre yönlendirirlerdi. Onlara göre iyi bir çömlek, [[ustanın inadıyla değil, çamurun rızasıyla]] ortaya çıkardı.\nBu parçada altı çizili sözle anlatılmak istenen aşağıdakilerden hangisidir?","o":["Çömlekçilik, uzun yıllar süren sabırlı bir eğitim gerektirir.","İyi bir çömlek yapmak için en kaliteli çamur seçilmelidir.","Usta, malzemenin özelliklerini gözeterek ve ona uyum sağlayarak çalışmalıdır.","Usta, çırağının fikirlerine de değer vermelidir.","Çarkın hızı, çömleğin biçimini belirleyen temel etkendir."],"a":2,"c":"Önceki cümleler ustaların çamurun nemine ve dokusuna göre biçim verdiğini anlatıyor; altı çizili söz de malzemeye zorla değil, ona uyarak çalışmayı anlatır."},{"d":"turkce","k":"Sözcükte anlam","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük mecaz anlamıyla kullanılmıştır?","o":["Bu [[büyük]] sandığı tek başına taşıyamazsın.","Kış gelmeden [[kalın]] bir mont almalısın.","Toplantıda söylediği [[ağır]] sözler herkesi üzdü.","Bahçedeki [[yüksek]] duvarı boyadılar.","Gölün suyu bu yıl çok [[sığ]] kalmış."],"a":2,"c":"\"Ağır söz\", kırıcı, incitici söz anlamında mecazdır. Diğer sözcükler somut, ölçülebilir nitelikleri anlattığı için gerçek anlamdadır."},{"d":"turkce","k":"Sözcükte anlam","q":"Aşağıdaki cümlelerin hangisinde deyim kullanılmamıştır?","o":["Bu işin sonunu getirmek için kolları sıvadık.","Yıllardır beklediği haberi alınca ağzı kulaklarına vardı.","Komşumuz bu konuda bize hep arka çıktı.","Kardeşinin başarısıyla göğsü kabardı.","Öğretmen, sınav sonuçlarını yarın açıklayacağını söyledi."],"a":4,"c":"\"Kolları sıvamak\", \"ağzı kulaklarına varmak\", \"arka çıkmak\" ve \"göğsü kabarmak\" deyimdir. E'deki sözcüklerin hepsi gerçek anlamıyla kullanılmıştır."},{"d":"turkce","k":"Sözcükte anlam","q":"Bir sanatçının ---- ilk eserlerinden itibaren aranırsa yanılgıya düşülebilir. Çünkü pek çok sanatçı, kendi sesini bulmadan önce uzun süre ustalarını ----; özgün çizgi ancak bu çıraklık döneminden sonra belirginleşir.\nBu parçada boş bırakılan yerlere aşağıdakilerden hangisi sırasıyla getirilmelidir?","o":["ünü – unutur","kişiliği – eleştirir","yeteneği – küçümser","üslubu – taklit eder","geçmişi – anlatır"],"a":3,"c":"\"Kendi sesini bulmak\" ve \"özgün çizgi\" sözleri ilk boşluğun \"üslup\" olduğunu; \"çıraklık dönemi\" de ustaların taklit edildiğini gösterir."},{"d":"turkce","k":"Sözcükte anlam","q":"Bu kitabın [[dili]] oldukça sade ve akıcı.\nCümlesindeki altı çizili sözcük aşağıdakilerin hangisinde aynı anlamda kullanılmıştır?","o":["Şairin [[dili]], ilk şiirlerinden sonra giderek yalınlaştı.","Çocuk, sıcak çorbadan [[dilini]] yaktı.","Kaç yabancı [[dil]] bildiğini sordular.","Ayakkabının [[dili]] yırtılmış.","Kilidin [[dili]] kırıldığı için kapı kapanmıyor."],"a":0,"c":"Örnek cümlede \"dil\", anlatım biçimi, üslup anlamındadır; A'da da şairin anlatım biçimi kastedilir. B'de organ, C'de lisan, D ve E'de nesnenin bir parçası anlamı vardır."},{"d":"turkce","k":"Sözcükte anlam","q":"Aşağıdaki cümlelerin hangisinde altı çizili söz \"bir işi yapmamak için güçlük çıkarmak\" anlamında kullanılmıştır?","o":["Ondan yardım isteyince her seferinde işi [[yokuşa sürdü]].","Yeni gelen müdür, ilk günden [[işi sıkı tuttu]].","Sınav yaklaşınca [[kitaplara gömüldü]].","Bu konuda bize [[yardım eli uzattı]].","Çocuklar ödevlerini [[bir çırpıda]] bitirdi."],"a":0,"c":"\"Yokuşa sürmek\", bir işi yapmamak için güçlük çıkarmak, bahaneler ileri sürmek demektir. B sıkı denetimi, C yoğun çalışmayı, D yardımı, E çabukluğu anlatır."},{"d":"turkce","k":"Yazım","q":"Aşağıdaki cümlelerin hangisinde yazım yanlışı yapılmıştır?","o":["Toplantı 15 Mart Pazartesi günü yapılacak.","Bu konuyu Türk Dil Kurumunun sitesinden öğrendim.","Yarın ki toplantıya herkes katılmalı.","Herkes, bu sorunun çözümünü birbirinden bekliyor.","Ankara'ya her yıl düzenli olarak gidiyoruz."],"a":2,"c":"Sıfat yapan \"-ki\" eki bitişik yazılır: \"yarınki\". Belirli bir tarih bildiren ay ve gün adları büyük harfle başlar; kurum adlarına gelen ekler kesmeyle ayrılmaz."},{"d":"turkce","k":"Yazım","q":"Geçen yaz (I) [[Doğu Karadeniz]] yaylalarını gezdik. Ayder'de (II) [[birkaç]] köy evinin önünde mola verdik. Akşamları bize (III) [[ilk defa]] tattığımız yöresel yemekler ikram edildi. Dönüşte (IV) [[Uzungöl'ün]] kıyısında bir gece konakladık. Bu yolculuk, (V) [[hiç bir]] geziye benzemiyordu.\nBu parçadaki numaralanmış sözlerden hangisinin yazımı yanlıştır?","o":["I","II","III","IV","V"],"a":4,"c":"\"Hiçbir\" bitişik yazılır. \"Birkaç\" bitişik, \"ilk defa\" ayrı yazılır; bölge ve yer adları büyük harfle başlar, özel ada gelen ek kesmeyle ayrılır."},{"d":"turkce","k":"Noktalama","q":"Aşağıdaki cümlelerin hangisinde kesme işareti (') yanlış kullanılmıştır?","o":["Türkiye'nin en uzun ırmağı Kızılırmak'tır.","Bu toplantıya Türk Dil Kurumu'nun uzmanları da katıldı.","1923'te ilan edilen Cumhuriyet, yeni bir dönemin başlangıcı oldu.","Yunus Emre'nin şiirleri pek çok dile çevrildi.","Kitabın 3'üncü bölümünü henüz okumadım."],"a":1,"c":"Kurum ve kuruluş adlarına gelen ekler kesme işaretiyle ayrılmaz: \"Türk Dil Kurumunun\". Ülke, kişi ve ırmak adlarına, rakamla yazılan sayılara gelen ekler ise kesmeyle ayrılır."},{"d":"turkce","k":"Noktalama","q":"Aşağıdaki cümlelerin hangisinde soru işareti yanlış kullanılmıştır?","o":["Yarın sinemaya gelecek misin?","Kimin aradığını bilmiyorum, sen biliyor musun?","Neden geç kaldığını anlamadım?","Ödevini bitirdin mi?","Hangi yoldan gitmemizi önerirsin?"],"a":2,"c":"C'de soru anlamı taşıyan \"neden\" yan cümlededir; cümle bir soru sormaz, bir durum bildirir. Bu yüzden sonuna nokta konmalıdır."},{"d":"turkce","k":"Ses olayları","q":"Aşağıdaki cümlelerin hangisinde ünlü düşmesine örnek vardır?","o":["Kitabı masanın üstüne bıraktı.","Çocuğun burnu soğuktan kızarmıştı.","Sabahleyin erkenden yola koyulduk.","Bu yaz denize hiç girmedik.","Ağacın dallarını budadılar."],"a":1,"c":"\"Burun\" sözcüğü ünlüyle başlayan bir ek alınca ikinci hecedeki \"u\" düşer: \"burnu\". A ve E'de ünsüz yumuşaması vardır."},{"d":"turkce","k":"Ses olayları","q":"Aşağıdaki cümlelerin hangisinde ünsüz benzeşmesi (sertleşme) vardır?","o":["Gözlerini kapayıp derin bir nefes aldı.","Kapının önünde bir kedi bekliyordu.","Yolda eski bir arkadaşını gördü.","Akşam yemeğini bahçede yedik.","Bu dersten tam not almayı başardı."],"a":4,"c":"\"Ders\" sözcüğü sert ünsüzle bittiği için \"-den\" eki \"-ten\" olmuştur: \"dersten\". D'deki \"yemeğini\" ünsüz yumuşamasıdır."},{"d":"turkce","k":"Öge dizilişi","q":"Genç araştırmacı, yıllardır üzerinde çalıştığı tezini geçen hafta jüriye sundu.\nBu cümlenin ögeleri aşağıdakilerin hangisinde sırasıyla verilmiştir?","o":["Özne – belirtili nesne – zarf tümleci – yer tamlayıcısı – yüklem","Özne – belirtisiz nesne – zarf tümleci – yer tamlayıcısı – yüklem","Özne – zarf tümleci – belirtili nesne – yer tamlayıcısı – yüklem","Özne – belirtili nesne – yer tamlayıcısı – zarf tümleci – yüklem","Zarf tümleci – özne – belirtili nesne – yer tamlayıcısı – yüklem"],"a":0,"c":"Genç araştırmacı (özne) / yıllardır üzerinde çalıştığı tezini (belirtili nesne) / geçen hafta (zarf tümleci) / jüriye (yer tamlayıcısı) / sundu (yüklem). \"Yıllardır\" nesne öbeğinin içindedir."},{"d":"turkce","k":"Öge dizilişi","q":"Köyün yaşlıları, akşamları kahvehanenin önünde eski günleri anlatırdı.\nBu cümlenin ögeleri aşağıdakilerin hangisinde sırasıyla verilmiştir?","o":["Özne – yer tamlayıcısı – zarf tümleci – belirtili nesne – yüklem","Özne – zarf tümleci – yer tamlayıcısı – belirtisiz nesne – yüklem","Zarf tümleci – özne – yer tamlayıcısı – belirtili nesne – yüklem","Özne – zarf tümleci – yer tamlayıcısı – belirtili nesne – yüklem","Özne – zarf tümleci – belirtili nesne – yer tamlayıcısı – yüklem"],"a":3,"c":"Köyün yaşlıları (özne) / akşamları (zarf tümleci) / kahvehanenin önünde (yer tamlayıcısı) / eski günleri (belirtili nesne) / anlatırdı (yüklem)."},{"d":"turkce","k":"Sözcük türleri","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük zarf görevindedir?","o":["Bu soruyu [[doğru]] cevapladı.","[[Güzel]] bir gün geçirdik.","[[Doğru]] söze ne denir?","[[Hızlı]] trenle seyahat ettik.","[[İyiler]] her zaman kazanır."],"a":0,"c":"A'da \"doğru\", \"cevapladı\" eyleminin nasıl yapıldığını bildirdiği için zarftır. B, C ve D'de sıfat; E'de adlaşmış sıfat (isim) olarak kullanılmıştır."},{"d":"turkce","k":"Sözcük türleri","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük zamirdir?","o":["[[Bu]] kitabı kim getirdi?","[[Bazı]] öğrenciler erken geldi.","[[Kimi]] gün erken kalkar.","[[Hepsi]] aynı anda konuşmaya başladı.","[[Her]] sabah yürüyüş yapar."],"a":3,"c":"\"Hepsi\" bir ismin yerini tutan belgisiz zamirdir. Diğer sözcükler kendinden sonraki ismi nitelediği için sıfattır."},{"d":"turkce","k":"Ek ve kök","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük yapım eki almıştır?","o":["[[Kalemini]] masada unutmuş.","[[Gözlükçü]] dükkânını erken kapatmış.","[[Evlerden]] dumanlar yükseliyordu.","[[Okulda]] bir tören düzenlendi.","[[Kitapları]] raflara dizdi."],"a":1,"c":"\"Gözlükçü\" sözcüğü \"-çü\" yapım ekiyle türemiştir (meslek bildirir). Diğerlerindeki ekler iyelik, çoğul ve hâl ekleri gibi çekim ekleridir."},{"d":"turkce","k":"Ek ve kök","q":"Aşağıdaki cümlelerin hangisinde altı çizili sözcük sıfat-fiil (ortaç) ekiyle türetilmiştir?","o":["[[Gülerek]] yanımıza geldi.","[[Okumak]] ona huzur veriyordu.","[[Koşan]] çocuklar parkı doldurmuştu.","Eve [[gelince]] seni arayacağım.","[[Yürüyüş]] herkese iyi gelir."],"a":2,"c":"\"Koşan\", \"-an\" sıfat-fiil ekiyle türeyip \"çocuklar\" ismini niteler. A ve D zarf-fiil, B ve E isim-fiildir."},{"d":"turkce","k":"Cümle türleri","q":"Aşağıdakilerden hangisi yapısına göre birleşik bir cümledir?","o":["Kitabı okuyunca yazarın diğer eserlerini de merak etti.","Hava çok soğuktu.","Sabah erkenden kalktı ve kahvaltı hazırladı.","Kapıyı aç, içeri gir.","Annem pazardan meyve aldı."],"a":0,"c":"A'da \"okuyunca\" zarf-fiiliyle kurulmuş bir yan cümle vardır, bu yüzden birleşik cümledir. B ve E basit; C ve D ise bağımsız cümlelerin yan yana gelmesiyle oluşan sıralı cümlelerdir."},{"d":"turkce","k":"Cümle türleri","q":"Aşağıdaki cümlelerin hangisi yapıca olumsuz, anlamca olumludur?","o":["Bu kadar yorulmana gerek yoktu.","Onun ne kadar çalışkan olduğunu bilmeyen yoktur.","Toplantıya gelmediğini öğrendik.","Ne kitabı okudu ne de filmi izledi.","Sınava hazırlanmadan girmemelisin."],"a":1,"c":"B'deki \"bilmeyen yoktur\", \"herkes bilir\" anlamına gelir; yapı olumsuz, anlam olumludur. A ve E hem yapı hem anlamca olumsuz; C ve D ise yapıca olumlu, anlamca olumsuzdur."},{"d":"turkce","k":"Anlatım bozukluğu","q":"Aşağıdaki cümlelerin hangisinde anlatım bozukluğu vardır?","o":["Toplantıda alınan kararlar herkese duyuruldu.","Çocuklar bahçede top oynuyordu.","Bu kitabı okumanızı tavsiye ederim.","Yağmur nedeniyle maç ertelendi.","Bu işi kesinlikle yarın bitirebiliriz belki."],"a":4,"c":"E'de kesinlik bildiren \"kesinlikle\" ile olasılık bildiren \"belki\" bir arada kullanıldığı için anlam çelişkisi vardır."},{"d":"turkce","k":"Anlatım bozukluğu","q":"Aşağıdaki cümlelerin hangisinde gereksiz sözcük kullanımından kaynaklanan bir anlatım bozukluğu vardır?","o":["Ayrıntılı bir rapor hazırlayıp yöneticiye sundu.","Sınavdan önce bütün konuları tekrar etti.","Kardeşim bu yıl üniversiteye başladı.","Yaklaşık beş kilometre kadar yürüdük.","Herkes onun dürüstlüğüne güvenir."],"a":3,"c":"\"Yaklaşık\" ile \"kadar\" aynı anlamı (tahmin) taşır; biri gereksizdir."},{"d":"turkce","k":"Sözel mantık","q":"Altı katlı bir apartmanın her katında yalnızca bir kişi oturmaktadır. Kerem, Leyla, Mert, Nazlı, Oya ve Pelin adlı kişilerin oturdukları katlarla ilgili bilinenler şunlardır:\n• Katlar aşağıdan yukarıya 1'den 6'ya kadar numaralandırılmıştır.\n• Mert, Oya'nın hemen bir üst katında oturmaktadır.\n• Pelin, Leyla'nın üç kat yukarısında oturmaktadır.\n• Kerem, çift numaralı bir katta oturmaktadır.\n• Nazlı, ne birinci katta ne de en üst katta oturmaktadır.\n\nBuna göre aşağıdakilerden hangisi kesinlikle yanlıştır?","o":["Leyla 1. katta oturmaktadır.","Kerem 4. katta oturmaktadır.","Pelin 5. katta oturmaktadır.","Oya 2. katta oturmaktadır.","Nazlı 3. katta oturmaktadır."],"a":2,"c":"Olası yerleşimler (Kerem-Leyla-Mert-Nazlı-Oya-Pelin): ① 2-1-6-3-5-4 ② 4-3-2-5-1-6 ③ 6-1-3-5-2-4. Pelin 5. katta olsaydı Leyla 2. katta olurdu; Mert ile Oya 3. ve 4. katlara, Kerem 6. kata yerleşir ve Nazlı'ya yasak olan 1. kat kalırdı. Bu yüzden Pelin 5. katta oturamaz."},{"d":"turkce","k":"Sözel mantık","q":"Altı katlı bir apartmanın her katında yalnızca bir kişi oturmaktadır. Kerem, Leyla, Mert, Nazlı, Oya ve Pelin adlı kişilerin oturdukları katlarla ilgili bilinenler şunlardır:\n• Katlar aşağıdan yukarıya 1'den 6'ya kadar numaralandırılmıştır.\n• Mert, Oya'nın hemen bir üst katında oturmaktadır.\n• Pelin, Leyla'nın üç kat yukarısında oturmaktadır.\n• Kerem, çift numaralı bir katta oturmaktadır.\n• Nazlı, ne birinci katta ne de en üst katta oturmaktadır.\n\nMert'in Nazlı'dan daha alt bir katta oturduğu biliniyorsa aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Nazlı 5. katta oturmaktadır.","Kerem 6. katta oturmaktadır.","Leyla 1. katta oturmaktadır.","Pelin 6. katta oturmaktadır.","Oya 1. katta oturmaktadır."],"a":0,"c":"Olası yerleşimler (Kerem-Leyla-Mert-Nazlı-Oya-Pelin): ① 2-1-6-3-5-4 ② 4-3-2-5-1-6 ③ 6-1-3-5-2-4. Mert'in Nazlı'nın altında olduğu durumlar ② ve ③'tür; ikisinde de Nazlı 5. kattadır. Diğer şıklar bu iki durumdan yalnızca birinde doğrudur."},{"d":"turkce","k":"Sözel mantık","q":"Altı katlı bir apartmanın her katında yalnızca bir kişi oturmaktadır. Kerem, Leyla, Mert, Nazlı, Oya ve Pelin adlı kişilerin oturdukları katlarla ilgili bilinenler şunlardır:\n• Katlar aşağıdan yukarıya 1'den 6'ya kadar numaralandırılmıştır.\n• Mert, Oya'nın hemen bir üst katında oturmaktadır.\n• Pelin, Leyla'nın üç kat yukarısında oturmaktadır.\n• Kerem, çift numaralı bir katta oturmaktadır.\n• Nazlı, ne birinci katta ne de en üst katta oturmaktadır.\n\nKerem'in oturduğu katın numarası Pelin'in oturduğu katın numarasından büyükse Oya kaçıncı katta oturmaktadır?","o":["1","2","3","4","5"],"a":1,"c":"Olası yerleşimler (Kerem-Leyla-Mert-Nazlı-Oya-Pelin): ① 2-1-6-3-5-4 ② 4-3-2-5-1-6 ③ 6-1-3-5-2-4. Kerem'in Pelin'in üstünde olduğu tek durum ③'tür (Kerem 6, Pelin 4); bu durumda Oya 2. kattadır."},{"d":"turkce","k":"Sözel mantık","q":"Altı katlı bir apartmanın her katında yalnızca bir kişi oturmaktadır. Kerem, Leyla, Mert, Nazlı, Oya ve Pelin adlı kişilerin oturdukları katlarla ilgili bilinenler şunlardır:\n• Katlar aşağıdan yukarıya 1'den 6'ya kadar numaralandırılmıştır.\n• Mert, Oya'nın hemen bir üst katında oturmaktadır.\n• Pelin, Leyla'nın üç kat yukarısında oturmaktadır.\n• Kerem, çift numaralı bir katta oturmaktadır.\n• Nazlı, ne birinci katta ne de en üst katta oturmaktadır.\n\nBuna göre Leyla ile Oya'nın oturdukları katların numaraları arasındaki fark en fazla kaçtır?","o":["1","2","3","4","5"],"a":3,"c":"Olası yerleşimler (Kerem-Leyla-Mert-Nazlı-Oya-Pelin): ① 2-1-6-3-5-4 ② 4-3-2-5-1-6 ③ 6-1-3-5-2-4. Farklar ①'de |1 - 5| = 4, ②'de |3 - 1| = 2, ③'te |1 - 2| = 1'dir; en büyük değer 4'tür."},{"d":"turkce","k":"Sözel mantık","q":"Bir şirkette çalışan Ali, Banu, Can, Deniz ve Emre adlı beş kişi, pazartesiden cumaya kadar olan beş günde nöbet tutacaktır. Her gün yalnızca bir kişi nöbet tutacak ve her kişi yalnızca bir gün nöbetçi olacaktır. Bu kişilerden ikisi muhasebe, ikisi satış, biri ise insan kaynakları biriminde çalışmaktadır. Nöbet çizelgesiyle ilgili bilinenler şunlardır:\n• Art arda iki günde nöbet tutan kişiler aynı birimde çalışmamaktadır.\n• Satış biriminde çalışan Ali, çarşamba günü nöbet tutacaktır.\n• Banu, Can'dan bir gün önce nöbet tutacaktır.\n• Muhasebe biriminde çalışan Deniz, cuma günü nöbet tutmayacaktır.\n• Pazartesi günü nöbet tutacak kişi insan kaynakları biriminde çalışmaktadır.\n\nBuna göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Banu, insan kaynakları biriminde çalışmaktadır.","Emre, cuma günü nöbet tutacaktır.","Deniz, salı günü nöbet tutacaktır.","Can, satış biriminde çalışmaktadır.","Cuma günü nöbet tutacak kişi satış biriminde çalışmaktadır."],"a":4,"c":"Pazartesi İK, çarşamba satış olduğundan salı ve perşembe muhasebe, cuma satış olur. İki çizelge mümkündür: ① Banu (İK) - Can (M) - Ali (S) - Deniz (M) - Emre (S) ② Emre (İK) - Deniz (M) - Ali (S) - Banu (M) - Can (S). Her iki çizelgede de cuma günkü kişi satış birimindendir; diğer şıklar yalnızca birinde doğrudur."},{"d":"turkce","k":"Sözel mantık","q":"Bir şirkette çalışan Ali, Banu, Can, Deniz ve Emre adlı beş kişi, pazartesiden cumaya kadar olan beş günde nöbet tutacaktır. Her gün yalnızca bir kişi nöbet tutacak ve her kişi yalnızca bir gün nöbetçi olacaktır. Bu kişilerden ikisi muhasebe, ikisi satış, biri ise insan kaynakları biriminde çalışmaktadır. Nöbet çizelgesiyle ilgili bilinenler şunlardır:\n• Art arda iki günde nöbet tutan kişiler aynı birimde çalışmamaktadır.\n• Satış biriminde çalışan Ali, çarşamba günü nöbet tutacaktır.\n• Banu, Can'dan bir gün önce nöbet tutacaktır.\n• Muhasebe biriminde çalışan Deniz, cuma günü nöbet tutmayacaktır.\n• Pazartesi günü nöbet tutacak kişi insan kaynakları biriminde çalışmaktadır.\n\nEmre'nin satış biriminde çalıştığı biliniyorsa perşembe günü kim nöbet tutacaktır?","o":["Ali","Banu","Can","Deniz","Emre"],"a":3,"c":"Pazartesi İK, çarşamba satış olduğundan salı ve perşembe muhasebe, cuma satış olur. İki çizelge mümkündür: ① Banu (İK) - Can (M) - Ali (S) - Deniz (M) - Emre (S) ② Emre (İK) - Deniz (M) - Ali (S) - Banu (M) - Can (S). Emre'nin satışta olduğu çizelge ①'dir; perşembe günü Deniz nöbet tutar."},{"d":"turkce","k":"Sözel mantık","q":"Bir şirkette çalışan Ali, Banu, Can, Deniz ve Emre adlı beş kişi, pazartesiden cumaya kadar olan beş günde nöbet tutacaktır. Her gün yalnızca bir kişi nöbet tutacak ve her kişi yalnızca bir gün nöbetçi olacaktır. Bu kişilerden ikisi muhasebe, ikisi satış, biri ise insan kaynakları biriminde çalışmaktadır. Nöbet çizelgesiyle ilgili bilinenler şunlardır:\n• Art arda iki günde nöbet tutan kişiler aynı birimde çalışmamaktadır.\n• Satış biriminde çalışan Ali, çarşamba günü nöbet tutacaktır.\n• Banu, Can'dan bir gün önce nöbet tutacaktır.\n• Muhasebe biriminde çalışan Deniz, cuma günü nöbet tutmayacaktır.\n• Pazartesi günü nöbet tutacak kişi insan kaynakları biriminde çalışmaktadır.\n\nBuna göre\nI. Banu,\nII. Can,\nIII. Emre\nadlı kişilerden hangileri muhasebe biriminde çalışıyor olabilir?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":2,"c":"Pazartesi İK, çarşamba satış olduğundan salı ve perşembe muhasebe, cuma satış olur. İki çizelge mümkündür: ① Banu (İK) - Can (M) - Ali (S) - Deniz (M) - Emre (S) ② Emre (İK) - Deniz (M) - Ali (S) - Banu (M) - Can (S). Can ①'de, Banu ②'de muhasebededir. Emre ise ya satış ya da insan kaynaklarındadır."},{"d":"turkce","k":"Sözel mantık","q":"Bir şirkette çalışan Ali, Banu, Can, Deniz ve Emre adlı beş kişi, pazartesiden cumaya kadar olan beş günde nöbet tutacaktır. Her gün yalnızca bir kişi nöbet tutacak ve her kişi yalnızca bir gün nöbetçi olacaktır. Bu kişilerden ikisi muhasebe, ikisi satış, biri ise insan kaynakları biriminde çalışmaktadır. Nöbet çizelgesiyle ilgili bilinenler şunlardır:\n• Art arda iki günde nöbet tutan kişiler aynı birimde çalışmamaktadır.\n• Satış biriminde çalışan Ali, çarşamba günü nöbet tutacaktır.\n• Banu, Can'dan bir gün önce nöbet tutacaktır.\n• Muhasebe biriminde çalışan Deniz, cuma günü nöbet tutmayacaktır.\n• Pazartesi günü nöbet tutacak kişi insan kaynakları biriminde çalışmaktadır.\n\nCan'ın, Deniz'den önceki bir günde nöbet tuttuğu biliniyorsa aşağıdakilerden hangisi yanlıştır?","o":["Emre, insan kaynakları biriminde çalışmaktadır.","Banu, pazartesi günü nöbet tutacaktır.","Can, muhasebe biriminde çalışmaktadır.","Deniz, perşembe günü nöbet tutacaktır.","Emre, cuma günü nöbet tutacaktır."],"a":0,"c":"Pazartesi İK, çarşamba satış olduğundan salı ve perşembe muhasebe, cuma satış olur. İki çizelge mümkündür: ① Banu (İK) - Can (M) - Ali (S) - Deniz (M) - Emre (S) ② Emre (İK) - Deniz (M) - Ali (S) - Banu (M) - Can (S). Bu koşulu yalnızca ① sağlar (Can salı, Deniz perşembe); bu çizelgede Emre satış biriminde çalışır."},{"d":"turkce","k":"Sözel mantık","q":"Bir koşu yarışına katılan Gül, Hande, İlker, Kaan, Meltem ve Nihat adlı altı sporcu, yarışı farklı sıralarda bitirmiştir. Sporculardan ikisi kırmızı, ikisi mavi, ikisi de yeşil forma giymiştir. Yarışla ilgili bilinenler şunlardır:\n• Aynı renk forma giyen iki sporcu, yarışı art arda sıralarda bitirmemiştir.\n• Kaan, yarışı Gül'den sonra bitirmiştir.\n• Yeşil forma giyen Meltem, yarışı dördüncü sırada bitirmiştir.\n• Yarışı birinci sırada bitiren sporcu mavi forma giymiştir.\n• Hande ile İlker kırmızı forma giymiştir ve Hande yarışı İlker'den önce bitirmiştir.\n\nBuna göre\nI. Gül,\nII. Kaan,\nIII. Nihat\nadlı sporculardan hangileri yarışı birinci sırada bitirmiş olabilir?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":3,"c":"Birinci mavi, dördüncü yeşil (Meltem) olduğundan Hande 2. ya da 3., İlker 5. ya da 6. sıradadır; birinci Gül ya da Nihat'tır. Kaan, Gül'den sonra bitirdiği için birinci olamaz. Gül (ör. Gül-Hande-Kaan-Meltem-İlker-Nihat) ve Nihat (ör. Nihat-Gül-Hande-Meltem-İlker-Kaan) birinci olabilir."},{"d":"turkce","k":"Sözel mantık","q":"Bir koşu yarışına katılan Gül, Hande, İlker, Kaan, Meltem ve Nihat adlı altı sporcu, yarışı farklı sıralarda bitirmiştir. Sporculardan ikisi kırmızı, ikisi mavi, ikisi de yeşil forma giymiştir. Yarışla ilgili bilinenler şunlardır:\n• Aynı renk forma giyen iki sporcu, yarışı art arda sıralarda bitirmemiştir.\n• Kaan, yarışı Gül'den sonra bitirmiştir.\n• Yeşil forma giyen Meltem, yarışı dördüncü sırada bitirmiştir.\n• Yarışı birinci sırada bitiren sporcu mavi forma giymiştir.\n• Hande ile İlker kırmızı forma giymiştir ve Hande yarışı İlker'den önce bitirmiştir.\n\nBuna göre aşağıdakilerden hangisi kesinlikle doğrudur?","o":["Hande, yarışı ikinci sırada bitirmiştir.","İlker, yarışı Meltem'den sonra bitirmiştir.","Kaan yeşil forma giymiştir.","Nihat mavi forma giymiştir.","Gül, yarışı birinci sırada bitirmiştir."],"a":1,"c":"Birinci mavi, dördüncü yeşil (Meltem) olduğundan Hande 2. ya da 3., İlker 5. ya da 6. sıradadır; birinci Gül ya da Nihat'tır. İlker 2. ya da 3. olsaydı iki kırmızı art arda gelir ya da Hande birinci olurdu; bu yüzden İlker hep Meltem'den sonradır. Diğer şıklar bazı sıralamalarda yanlıştır (ör. Nihat-Gül-Hande-Meltem-İlker-Kaan, Gül-Nihat-Hande-Meltem-İlker-Kaan)."},{"d":"turkce","k":"Sözel mantık","q":"Bir koşu yarışına katılan Gül, Hande, İlker, Kaan, Meltem ve Nihat adlı altı sporcu, yarışı farklı sıralarda bitirmiştir. Sporculardan ikisi kırmızı, ikisi mavi, ikisi de yeşil forma giymiştir. Yarışla ilgili bilinenler şunlardır:\n• Aynı renk forma giyen iki sporcu, yarışı art arda sıralarda bitirmemiştir.\n• Kaan, yarışı Gül'den sonra bitirmiştir.\n• Yeşil forma giyen Meltem, yarışı dördüncü sırada bitirmiştir.\n• Yarışı birinci sırada bitiren sporcu mavi forma giymiştir.\n• Hande ile İlker kırmızı forma giymiştir ve Hande yarışı İlker'den önce bitirmiştir.\n\nKaan'ın yeşil forma giydiği biliniyorsa aşağıdakilerden hangisi kesinlikle yanlıştır?","o":["Hande, yarışı üçüncü sırada bitirmiştir.","İlker, yarışı beşinci sırada bitirmiştir.","Nihat, yarışı birinci sırada bitirmiştir.","Kaan, yarışı altıncı sırada bitirmiştir.","Gül, yarışı ikinci sırada bitirmiştir."],"a":4,"c":"Birinci mavi, dördüncü yeşil (Meltem) olduğundan Hande 2. ya da 3., İlker 5. ya da 6. sıradadır; birinci Gül ya da Nihat'tır. Kaan yeşilse Gül ile Nihat mavidir. Gül ikinci olursa birinci de mavi olacağından iki mavi art arda gelir; bu yüzden Gül ikinci olamaz. Diğerleri mümkündür (ör. Gül-Kaan-Hande-Meltem-İlker-Nihat, Nihat-Hande-Gül-Meltem-İlker-Kaan)."},{"d":"turkce","k":"Sözel mantık","q":"Bir koşu yarışına katılan Gül, Hande, İlker, Kaan, Meltem ve Nihat adlı altı sporcu, yarışı farklı sıralarda bitirmiştir. Sporculardan ikisi kırmızı, ikisi mavi, ikisi de yeşil forma giymiştir. Yarışla ilgili bilinenler şunlardır:\n• Aynı renk forma giyen iki sporcu, yarışı art arda sıralarda bitirmemiştir.\n• Kaan, yarışı Gül'den sonra bitirmiştir.\n• Yeşil forma giyen Meltem, yarışı dördüncü sırada bitirmiştir.\n• Yarışı birinci sırada bitiren sporcu mavi forma giymiştir.\n• Hande ile İlker kırmızı forma giymiştir ve Hande yarışı İlker'den önce bitirmiştir.\n\nGül'ün yarışı üçüncü sırada bitirdiği biliniyorsa Kaan yarışı kaçıncı sırada bitirmiştir?","o":["2","3","4","5","6"],"a":4,"c":"Birinci mavi, dördüncü yeşil (Meltem) olduğundan Hande 2. ya da 3., İlker 5. ya da 6. sıradadır; birinci Gül ya da Nihat'tır. Gül üçüncüyse birinci Nihat (mavi), ikinci Hande olur; Gül, Meltem'in yanında olduğu için mavi, Kaan ise yeşildir. Kaan beşinci olsaydı yeşil Meltem'le art arda gelirdi; bu yüzden sıralama Nihat-Hande-Gül-Meltem-İlker-Kaan'dır ve Kaan altıncıdır."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Kanunun emredici hükümlerine, ahlaka veya kamu düzenine aykırı olarak yapılan bir sözleşmenin baştan itibaren geçersiz sayılması hangi yaptırım türüdür?","o":["Kesin hükümsüzlük","Tazminat","Cebrî icra","Ceza","Disiplin cezası"],"a":0,"c":"Türk Borçlar Kanunu'na göre emredici hükümlere, ahlaka veya kamu düzenine aykırı sözleşmeler kesin olarak hükümsüzdür; bu yaptırım işlemi hiç doğmamış gibi sonuçsuz bırakır."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Mahkeme kararına rağmen borcunu ödemeyen kişinin mallarının devlet gücüyle haczedilip satılarak alacaklıya ödeme yapılması hangi yaptırım türüdür?","o":["Tazminat","Cebrî icra","İptal","Kesin hükümsüzlük","Ceza"],"a":1,"c":"Cebrî icra, borcunu kendi isteğiyle yerine getirmeyen kişiyi devletin zor kullanarak borcunu yerine getirmeye zorlamasıdır."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Mülkiyet hakkı gibi herkese karşı ileri sürülebilen ve herkesin saygı göstermekle yükümlü olduğu haklara ne ad verilir?","o":["Nispi hak","Siyasi hak","Mutlak hak","Yenilik doğuran hak","Kamu hakkı"],"a":2,"c":"Mutlak haklar herkese karşı ileri sürülebilir. Nispi haklar ise yalnızca belirli kişilere, örneğin sözleşmenin karşı tarafına karşı ileri sürülebilir."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Normlar hiyerarşisinde en üst sırada yer alan hukuk kuralı aşağıdakilerden hangisidir?","o":["Kanun","Cumhurbaşkanlığı kararnamesi","Yönetmelik","Anayasa","Genelge"],"a":3,"c":"Anayasa normlar hiyerarşisinin en üstündedir; kanunlar, Cumhurbaşkanlığı kararnameleri ve yönetmelikler Anayasa'ya aykırı olamaz."},{"d":"vatandaslik","k":"1982 Anayasası – Genel esaslar","q":"1982 Anayasası'na göre aşağıdakilerden hangisi değiştirilemeyecek ve değiştirilmesi teklif edilemeyecek hükümler arasında yer almaz?","o":["Türkiye Devletinin şeklinin Cumhuriyet olduğu","Devletin dilinin Türkçe olduğu","Başkentin Ankara olduğu","Millî marşın İstiklal Marşı olduğu","Egemenliğin kayıtsız şartsız milletin olduğu"],"a":4,"c":"Anayasa'nın 4. maddesi ilk üç maddeyi (devletin şekli, Cumhuriyetin nitelikleri, ülke ve millet bütünlüğü, dil, bayrak, millî marş, başkent) değiştirilemez kılar. Egemenliğe ilişkin hüküm 6. maddededir ve bu koruma kapsamında değildir."},{"d":"vatandaslik","k":"1982 Anayasası – Anayasa değişikliği","q":"1982 Anayasası'na göre bir Anayasa değişikliği teklifinin TBMM'de kabul edilebilmesi için gizli oylamada en az kaç milletvekilinin oyu gerekir?","o":["151","200","301","360","400"],"a":3,"c":"Anayasa değişikliği teklifi üye tamsayısının en az üçte biri (200) ile verilir ve beşte üç (360) çoğunlukla kabul edilir. 360-399 oyla kabul edilen değişiklik halkoyuna sunulur
