."},{"d":"vatandaslik","k":"1982 Anayasası – Temel hak ve ödevler","q":"1982 Anayasası'na göre aşağıdakilerden hangisi sosyal ve ekonomik haklar arasında yer alır?","o":["Konut dokunulmazlığı","Eğitim ve öğrenim hakkı","Seçme ve seçilme hakkı","Dilekçe hakkı","Haberleşme hürriyeti"],"a":1,"c":"Eğitim ve öğrenim hakkı sosyal ve ekonomik haklar arasındadır. Konut dokunulmazlığı ve haberleşme hürriyeti kişinin hakları, seçme-seçilme ve dilekçe hakkı ise siyasi haklardır."},{"d":"vatandaslik","k":"1982 Anayasası – Temel hak ve ödevler","q":"1982 Anayasası'na göre aşağıdakilerden hangisi bir ödev olarak düzenlenmiştir?","o":["Mülkiyet hakkı","Sendika kurma hakkı","Vergi ödevi","Toplantı ve gösteri yürüyüşü hakkı","Yerleşme ve seyahat hürriyeti"],"a":2,"c":"Anayasa'ya göre herkes kamu giderlerini karşılamak üzere mali gücüne göre vergi ödemekle yükümlüdür. Vatan hizmeti de siyasi haklar ve ödevler bölümünde düzenlenen bir ödevdir."},{"d":"vatandaslik","k":"1982 Anayasası – Yasama","q":"Milletvekillerinin Meclis çalışmalarındaki oy ve sözlerinden, Mecliste ileri sürdükleri düşüncelerden dolayı sorumlu tutulamamalarına ne ad verilir?","o":["Yasama dokunulmazlığı","Hâkimlik teminatı","Meclis soruşturması","Yasama sorumsuzluğu","Gensoru"],"a":3,"c":"Yasama sorumsuzluğu milletvekilinin Meclisteki oy ve sözleri için mutlak bir korumadır. Yasama dokunulmazlığı ise milletvekilinin seçimden önce veya sonra suç işlediği iddiasıyla tutulamaması ve yargılanamamasıdır."},{"d":"vatandaslik","k":"1982 Anayasası – Yasama","q":"1982 Anayasası'nın güncel hâline göre aşağıdakilerden hangisi TBMM'nin görev ve yetkilerinden biri değildir?","o":["Bütçe kanun teklifini görüşmek ve kabul etmek","Para basılmasına ve savaş ilanına karar vermek","Milletlerarası antlaşmaları onaylamayı uygun bulmak","Genel ve özel af ilanına karar vermek","Yönetmelik çıkarmak"],"a":4,"c":"Yönetmelik çıkarma yetkisi Cumhurbaşkanı, bakanlıklar ve kamu tüzel kişilerine aittir. Diğerleri Anayasa'nın 87. maddesinde TBMM'nin görevleri olarak sayılmıştır."},{"d":"vatandaslik","k":"1982 Anayasası – Bütçe","q":"1982 Anayasası'nın güncel hâline göre merkezî yönetim bütçe kanun teklifini TBMM'ye sunmaya yetkili olan aşağıdakilerden hangisidir?","o":["Cumhurbaşkanı","Hazine ve Maliye Bakanı","TBMM Plan ve Bütçe Komisyonu","Sayıştay Başkanı","TBMM Başkanı"],"a":0,"c":"Cumhurbaşkanı, merkezî yönetim bütçe kanun teklifini mali yıl başından en az yetmiş beş gün önce TBMM'ye sunar."},{"d":"vatandaslik","k":"1982 Anayasası – Yürütme","q":"1982 Anayasası'na göre aşağıdakilerden hangisi Cumhurbaşkanının yetkilerinden biri değildir?","o":["Kanunları yayımlamak","Sayıştay Başkanı ve üyelerini seçmek","Gerektiğinde TBMM'yi toplantıya çağırmak","Üst kademe kamu yöneticilerini atamak","Millî Güvenlik Kurulunu toplantıya çağırmak"],"a":1,"c":"Sayıştay Başkanı ve üyeleri TBMM tarafından seçilir. Diğerleri Anayasa'nın 104. maddesinde Cumhurbaşkanına tanınan yetkilerdir."},{"d":"vatandaslik","k":"1982 Anayasası – Anayasal kurumlar","q":"1982 Anayasası'na göre Kamu Denetçiliği Kurumu aşağıdakilerden hangisine bağlıdır?","o":["Cumhurbaşkanlığı","Adalet Bakanlığı","TBMM Başkanlığı","Danıştay","İçişleri Bakanlığı"],"a":2,"c":"Kamu Denetçiliği Kurumu, idarenin işleyişiyle ilgili şikâyetleri incelemek üzere TBMM Başkanlığına bağlı olarak kurulmuştur. Kamu Başdenetçisi TBMM tarafından dört yıl için seçilir."},{"d":"vatandaslik","k":"1982 Anayasası – Anayasal kurumlar","q":"Yüksek Seçim Kurulu ile ilgili;\nI. Yedi asıl ve dört yedek üyeden oluşur.\nII. Üyeleri Yargıtay ve Danıştay genel kurullarınca kendi üyeleri arasından seçilir.\nIII. Kararları aleyhine başka bir mercie başvurulamaz.\nifadelerinden hangileri doğrudur?","o":["Yalnız I","I ve II","I ve III","II ve III","I, II ve III"],"a":4,"c":"YSK yedi asıl ve dört yedek üyeden oluşur; altı üye Yargıtay, beş üye Danıştay genel kurullarınca seçilir. Anayasa'ya göre YSK kararları aleyhine başka bir mercie başvurulamaz."},{"d":"vatandaslik","k":"1982 Anayasası – Anayasal kurumlar","q":"1982 Anayasası'na göre Radyo ve Televizyon Üst Kurulu (RTÜK) üyelerini seçen merci aşağıdakilerden hangisidir?","o":["Cumhurbaşkanı","Anayasa Mahkemesi","Yükseköğretim Kurulu","TBMM","Danıştay"],"a":3,"c":"RTÜK dokuz üyeden oluşur ve üyeleri, siyasi parti gruplarının üye sayısı oranında TBMM tarafından seçilir."},{"d":"vatandaslik","k":"Yargı","q":"\"Hâkimler azlolunamaz; kendileri istemedikçe Anayasa'da gösterilen yaştan önce emekliye ayrılamaz.\"\nAnayasa'daki bu hüküm aşağıdaki ilkelerden hangisiyle ilgilidir?","o":["Kanuni hâkim güvencesi","Yargılamanın aleniyeti","Hak arama hürriyeti","Suç ve cezaların kanuniliği","Hâkimlik teminatı"],"a":4,"c":"Hâkimlik teminatı, hâkimlerin görevlerinden uzaklaştırılmamasını ve aylık ile ödeneklerinden yoksun bırakılmamasını güvence altına alır. Kanuni hâkim güvencesi ise kişinin tabi olduğu mahkemeden başka mercie çıkarılamamasıdır."},{"d":"vatandaslik","k":"Yargı örgütü","q":"İdari yargının en üst mahkemesi olup idare ve vergi mahkemelerince verilen ve kanunun başka bir idari yargı merciine bırakmadığı kararların son inceleme mercii aşağıdakilerden hangisidir?","o":["Danıştay","Yargıtay","Anayasa Mahkemesi","Sayıştay","Uyuşmazlık Mahkemesi"],"a":0,"c":"Danıştay idari yargının en üst mahkemesidir. Yargıtay adli yargıda son inceleme merciidir."},{"d":"vatandaslik","k":"Türk Medeni Kanunu – Aile","q":"Türk Medeni Kanunu'na göre hâkim, olağanüstü durumlarda ve pek önemli bir sebeple en az kaç yaşını doldurmuş olan kişinin evlenmesine izin verebilir?","o":["14","15","16","17","18"],"a":2,"c":"Kural olarak erkek veya kadın 17 yaşını doldurmadıkça evlenemez. Hâkim olağanüstü durumlarda ve pek önemli bir sebeple 16 yaşını doldurmuş kişinin evlenmesine izin verebilir."},{"d":"vatandaslik","k":"Türk Medeni Kanunu – Aile","q":"Türk Medeni Kanunu'na göre eşler arasında başka bir mal rejimi seçilmediği sürece geçerli olan yasal mal rejimi aşağıdakilerden hangisidir?","o":["Mal ayrılığı","Paylaşmalı mal ayrılığı","Edinilmiş mallara katılma","Mal ortaklığı","Mal birliği"],"a":2,"c":"4721 sayılı Türk Medeni Kanunu'nda yasal mal rejimi edinilmiş mallara katılmadır. Eşler mal sözleşmesiyle mal ayrılığı, paylaşmalı mal ayrılığı veya mal ortaklığını seçebilir."},{"d":"vatandaslik","k":"Türk Medeni Kanunu – Miras","q":"Türk Medeni Kanunu'na göre aşağıdakilerden hangisi yasal mirasçılar arasında yer almaz?","o":["Altsoy","Sağ kalan eş","Ana ve baba","Kayınvalide","Devlet"],"a":3,"c":"Yasal mirasçılar kan hısımları (altsoy, ana-baba ve büyük ana-baba zümreleri), sağ kalan eş ve mirasçı yoksa Devlettir. Kayın hısımları mirasçı olamaz."},{"d":"vatandaslik","k":"Borçlar hukuku","q":"Aşağıdakilerden hangisi borcu sona erdiren sebeplerden biridir?","o":["Sözleşme","Haksız fiil","Sebepsiz zenginleşme","Vekâletsiz iş görme","İfa"],"a":4,"c":"İfa, borcun gereği gibi yerine getirilmesiyle borcu sona erdirir. Sözleşme, haksız fiil ve sebepsiz zenginleşme borcun doğum kaynaklarıdır; vekâletsiz iş görme de borç doğuran bir ilişkidir."},{"d":"vatandaslik","k":"Ceza hukuku","q":"\"Kanunun açıkça suç saymadığı bir fiil için kimseye ceza verilemez.\"\nBu ifade aşağıdaki ilkelerden hangisini yansıtır?","o":["Suç ve cezaların kanuniliği","Ceza sorumluluğunun şahsiliği","Hukuki güvenlik","Masumiyet karinesi","Eşitlik"],"a":0,"c":"Suç ve cezaların kanuniliği ilkesine göre suç ve ceza ancak kanunla belirlenebilir; kanunda suç olarak tanımlanmamış bir fiil cezalandırılamaz."},{"d":"vatandaslik","k":"Ceza hukuku","q":"5237 sayılı Türk Ceza Kanunu'na göre fiili işlediği sırada kaç yaşını doldurmamış olan çocukların ceza sorumluluğu yoktur?","o":["10","12","13","15","18"],"a":1,"c":"Fiili işlediği sırada 12 yaşını doldurmamış çocukların ceza sorumluluğu yoktur; bunlar hakkında yalnızca güvenlik tedbirleri uygulanabilir."},{"d":"vatandaslik","k":"657 sayılı DMK","q":"657 sayılı Devlet Memurları Kanunu'na göre aşağıdakilerden hangisi memurun haklarından biri değildir?","o":["Sendikaya üye olma","Çekilme","Ticaret ve kazanç getirici faaliyette bulunma","Şikâyet ve dava açma","Kanunda belirtilen hâller dışında görevine son verilmeme (güvenlik)"],"a":2,"c":"Memurların ticaret ve diğer kazanç getirici faaliyetlerde bulunmaları 657 sayılı Kanun'da yasaklanmıştır. Diğerleri kanunda memurlara tanınan haklardır."},{"d":"vatandaslik","k":"657 sayılı DMK","q":"Memurların kamu hizmetlerini aksatacak şekilde toplu olarak görevlerine gelmemeleri veya görevlerini yavaşlatmaları 657 sayılı Kanun'daki hangi yasak kapsamındadır?","o":["Hediye alma yasağı","Ticaret yasağı","Basına bilgi veya demeç verme yasağı","Toplu hareket yasağı","Gizli bilgileri açıklama yasağı"],"a":3,"c":"657 sayılı Kanun'un 26. maddesindeki toplu hareket yasağı, memurların kamu hizmetlerini aksatacak biçimde toplu olarak görevlerine gelmemelerini veya görevlerini yavaşlatmalarını yasaklar."},{"d":"vatandaslik","k":"657 sayılı DMK","q":"657 sayılı Devlet Memurları Kanunu'na göre eşi doğum yapan erkek memura isteği üzerine kaç gün mazeret izni verilir?","o":["3","5","7","10","15"],"a":3,"c":"657 sayılı Kanun'a göre eşi doğum yapan memura isteği üzerine 10 gün mazeret izni verilir. Evlenme veya yakınlarının ölümü hâlinde ise 7 gün izin verilir."},{"d":"vatandaslik","k":"657 sayılı DMK","q":"657 sayılı Devlet Memurları Kanunu'na göre aşağıdaki disiplin cezalarından hangisi yüksek disiplin kurulu kararı alınarak verilir?","o":["Devlet memurluğundan çıkarma","Uyarma","Kınama","Aylıktan kesme","Kademe ilerlemesinin durdurulması"],"a":0,"c":"Devlet memurluğundan çıkarma cezası yüksek disiplin kurulu kararıyla atamaya yetkili amirlerce verilir. Uyarma, kınama ve aylıktan kesme disiplin amirlerince; kademe ilerlemesinin durdurulması disiplin kurulu kararıyla verilir."},{"d":"vatandaslik","k":"İdare hukuku","q":"İlçe yönetiminde merkezî idareyi temsil eden ve ilçenin genel idaresinden sorumlu olan görevli aşağıdakilerden hangisidir?","o":["Belediye başkanı","Kaymakam","Muhtar","İlçe seçim kurulu başkanı","İl genel meclisi üyesi"],"a":1,"c":"Kaymakam, ilçede merkezî idarenin temsilcisi ve genel idare amiridir. Belediye başkanı ve muhtar ise yerel halkın seçtiği mahalli idare organlarıdır."},{"d":"vatandaslik","k":"İdare hukuku","q":"5393 sayılı Belediye Kanunu'na göre aşağıdakilerden hangisi belediyenin organlarından biridir?","o":["İl genel meclisi","Köy ihtiyar heyeti","Belediye encümeni","İl idare kurulu","Mahalle muhtarı"],"a":2,"c":"Belediyenin organları belediye meclisi, belediye encümeni ve belediye başkanıdır. İl genel meclisi il özel idaresinin, ihtiyar heyeti köyün organıdır."},{"d":"vatandaslik","k":"İdare hukuku","q":"I. Köy derneği\nII. Köy ihtiyar heyeti\nIII. Muhtar\nIV. Encümen\nKöy Kanunu'na göre yukarıdakilerden hangileri köyün organlarındandır?","o":["Yalnız III","I ve III","II ve IV","I, II ve III","I, II, III ve IV"],"a":3,"c":"Köy Kanunu'na göre köyün organları köy derneği, köy ihtiyar heyeti ve muhtardır. Encümen belediye ve il özel idaresine özgü bir organdır."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Aşağıdakilerden hangisi hukukun yazılı kaynaklarından biri değildir?","o":["Örf ve âdet hukuku","Kanun","Cumhurbaşkanlığı kararnamesi","Yönetmelik","Anayasa"],"a":0,"c":"Örf ve âdet hukuku, toplumda uzun süre uygulanarak bağlayıcılık kazanmış yazısız bir kaynaktır."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Aşağıdakilerden hangisi özel hukukun dallarından biridir?","o":["Ticaret hukuku","Vergi hukuku","İdare hukuku","Ceza hukuku","Anayasa hukuku"],"a":0,"c":"Ticaret hukuku eşit kişiler arasındaki ilişkileri düzenlediği için özel hukuk dalıdır; diğerleri devletin taraf olduğu kamu hukuku dallarıdır."},{"d":"vatandaslik","k":"Hukukun temel kavramları","q":"Hukuk kurallarını ahlak, din ve görgü kurallarından ayıran temel özellik aşağıdakilerden hangisidir?","o":["Toplum hayatını düzenlemesi","Toplumda genel kabul görmesi","Kişilerin vicdanına hitap etmesi","Zamanla değişebilmesi","Uyulmaması hâlinde devlet zoruyla uygulanan maddi bir yaptırıma bağlanması"],"a":4,"c":"Diğer sosyal düzen kurallarının yaptırımı manevidir; hukuk kurallarının yaptırımı ise devlet gücüyle uygulanır."},{"d":"vatandaslik","k":"1982 Anayasası – Yasama","q":"1982 Anayasası'nın güncel hâline göre;\nI. Türkiye Büyük Millet Meclisi 600 milletvekilinden oluşur.\nII. Milletvekili seçilme yaşı 18'dir.\nIII. TBMM ve Cumhurbaşkanlığı seçimleri dört yılda bir yapılır.\nifadelerinden hangileri doğrudur?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":2,"c":"2017 değişikliğiyle milletvekili sayısı 600'e çıkarılmış, seçilme yaşı 18'e indirilmiştir. TBMM ve Cumhurbaşkanlığı seçimleri beş yılda bir aynı gün yapılır."},{"d":"vatandaslik","k":"1982 Anayasası – Yürütme","q":"1982 Anayasası'na göre aşağıdakilerden hangisi Cumhurbaşkanı seçilebilmek için aranan şartlardan biri değildir?","o":["TBMM üyesi olmak","Yükseköğrenim yapmış olmak","Milletvekili seçilme yeterliliğine sahip olmak","Türk vatandaşı olmak","Kırk yaşını doldurmuş olmak"],"a":0,"c":"Cumhurbaşkanı; kırk yaşını doldurmuş, yükseköğrenim yapmış, milletvekili seçilme yeterliliğine sahip Türk vatandaşları arasından halkça seçilir. TBMM üyesi olmak şart değildir."},{"d":"vatandaslik","k":"1982 Anayasası – Yürütme","q":"1982 Anayasası'na göre Cumhurbaşkanının görev süresi ve bir kişinin en fazla kaç defa Cumhurbaşkanı seçilebileceği aşağıdakilerin hangisinde doğru verilmiştir?","o":["4 yıl – 2 defa","5 yıl – 1 defa","7 yıl – 1 defa","5 yıl – 2 defa","5 yıl – 3 defa"],"a":3,"c":"Cumhurbaşkanının görev süresi beş yıldır ve bir kimse en fazla iki defa Cumhurbaşkanı seçilebilir."},{"d":"vatandaslik","k":"1982 Anayasası – Yasama","q":"1982 Anayasası'nın güncel hâline göre kanun teklif etme yetkisi aşağıdakilerden hangisine aittir?","o":["Cumhurbaşkanı","Cumhurbaşkanı yardımcıları","Bakanlar","Anayasa Mahkemesi","Milletvekilleri"],"a":4,"c":"2017 değişikliğinden sonra kanun teklif etme yetkisi yalnızca milletvekillerine aittir."},{"d":"vatandaslik","k":"1982 Anayasası – Yasama","q":"1982 Anayasası'nın güncel hâline göre aşağıdakilerden hangisi TBMM'nin bilgi edinme ve denetim yollarından biri değildir?","o":["Gensoru","Genel görüşme","Meclis soruşturması","Yazılı soru","Meclis araştırması"],"a":0,"c":"2017 değişikliğiyle gensoru ve sözlü soru kaldırılmıştır. Güncel denetim yolları meclis araştırması, genel görüşme, meclis soruşturması ve yazılı sorudur."},{"d":"vatandaslik","k":"1982 Anayasası – Yürütme","q":"1982 Anayasası'na göre aşağıdaki konulardan hangisi Cumhurbaşkanlığı kararnamesiyle düzenlenemez?","o":["Bakanlıkların kurulması ve görevleri","Seçme ve seçilme hakkı","Üst kademe kamu yöneticilerinin atanma usulleri","Devlet Denetleme Kurulunun işleyişi","Millî Güvenlik Kurulu Genel Sekreterliğinin teşkilatı"],"a":1,"c":"Temel haklar, kişi hakları ve ödevleri ile siyasi haklar ve ödevler Cumhurbaşkanlığı kararnamesiyle düzenlenemez; seçme ve seçilme hakkı siyasi haklardandır."},{"d":"vatandaslik","k":"1982 Anayasası – Yürütme","q":"1982 Anayasası'na göre Cumhurbaşkanlığı kararnamesi ile kanunlarda farklı hükümler bulunması hâlinde aşağıdakilerden hangisi geçerlidir?","o":["Cumhurbaşkanlığı kararnamesi hükümleri uygulanır.","Sonra yürürlüğe giren düzenleme uygulanır.","Kanun hükümleri uygulanır.","Anayasa Mahkemesi hangisinin uygulanacağına karar verir.","İki düzenleme de yürürlükten kalkar."],"a":2,"c":"Anayasa'nın 104. maddesine göre Cumhurbaşkanlığı kararnamesi ile kanunlarda farklı hükümler bulunması hâlinde kanun hükümleri uygulanır."},{"d":"vatandaslik","k":"1982 Anayasası – Yargı","q":"1982 Anayasası'na göre Anayasa Mahkemesi ile ilgili;\nI. On beş üyeden oluşur.\nII. Üyelerinin tamamı Cumhurbaşkanınca seçilir.\nIII. Üyeler on iki yıllığına seçilir.\nifadelerinden hangileri doğrudur?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":3,"c":"Anayasa Mahkemesi 15 üyeden oluşur; üyelerin 3'ünü TBMM, 12'sini Cumhurbaşkanı seçer. Üyeler 12 yıl için seçilir ve iki defa seçilemez."},{"d":"vatandaslik","k":"1982 Anayasası – Yargı","q":"1982 Anayasası'na göre Hâkimler ve Savcılar Kurulunun başkanı aşağıdakilerden hangisidir?","o":["Yargıtay Birinci Başkanı","Anayasa Mahkemesi Başkanı","Cumhurbaşkanı","Adalet Bakanı","Danıştay Başkanı"],"a":3,"c":"Hâkimler ve Savcılar Kurulu 13 üyeden oluşur; Kurulun başkanı Adalet Bakanıdır, Adalet Bakan Yardımcısı tabii üyedir."},{"d":"vatandaslik","k":"1982 Anayasası – Denetim kurumları","q":"Merkezî yönetim bütçesi kapsamındaki kamu idarelerinin gelir, gider ve mallarını TBMM adına denetlemekle görevli kurum aşağıdakilerden hangisidir?","o":["Devlet Denetleme Kurulu","Kamu Denetçiliği Kurumu","Uyuşmazlık Mahkemesi","Danıştay","Sayıştay"],"a":4,"c":"Anayasa'nın 160. maddesine göre bu denetimi TBMM adına Sayıştay yapar."},{"d":"vatandaslik","k":"1982 Anayasası – Temel hak ve özgürlükler","q":"1982 Anayasası'na göre aşağıdakilerden hangisi siyasi haklar ve ödevler arasında yer alır?","o":["Dilekçe hakkı","Eğitim ve öğrenim hakkı","Konut dokunulmazlığı","Mülkiyet hakkı","Sendika kurma hakkı"],"a":0,"c":"Dilekçe hakkı Anayasa'da siyasi haklar ve ödevler bölümünde düzenlenmiştir. Mülkiyet ve konut dokunulmazlığı kişinin hakları, eğitim ve sendika hakları sosyal ve ekonomik haklardandır."},{"d":"vatandaslik","k":"1982 Anayasası – Temel hak ve özgürlükler","q":"1982 Anayasası'nın 15. maddesine göre aşağıdakilerden hangisine savaş, seferberlik veya olağanüstü hâllerde dahi dokunulamaz?","o":["Toplantı ve gösteri yürüyüşü hakkı","Suç ve cezaların geçmişe yürümemesi","Yerleşme ve seyahat özgürlüğü","Basın özgürlüğü","Dernek kurma özgürlüğü"],"a":1,"c":"Olağanüstü dönemlerde bile yaşama hakkı, maddi ve manevi varlığın bütünlüğü, din ve vicdan özgürlüğü, suç ve cezaların geçmişe yürümemesi ile masumiyet karinesine dokunulamaz."},{"d":"vatandaslik","k":"1982 Anayasası – Yürütme","q":"1982 Anayasası'nın güncel hâline göre aşağıdakilerden hangisi Millî Güvenlik Kurulunun üyeleri arasında yer almaz?","o":["Dışişleri Bakanı","Genelkurmay Başkanı","Hazine ve /* ---------- ses + titreşim ---------- */
let ac;
function ses(t) {
  if (!S.ayar.ses) return;
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const n = {ok:[660,990], bad:[200,150], tik:[520], win:[523,659,784,1046], lvl:[392,523,659,784,1046,1318]}[t];
    n.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * .09;
      o.type = t === "bad" ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(t === "bad" ? .06 : .16, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + .22);
    });
  } catch (e) {}
}
const titret = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- konfeti ---------- */
function konfeti(n = 140) {
  if (azHareket) return;
  const cv = $("#confetti"), cx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.scale(devicePixelRatio, devicePixelRatio);
  const renk = ["#fbbf24","#ff6ba6","#22d3ee","#7c5cff","#22c55e","#fff"];
  const p = Array.from({length:n}, () => ({x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*16-4,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*7, h:4+Math.random()*5, c:rnd(renk)}));
  let f = 0;
  (function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    p.forEach(q => { q.vy += .42; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
      cx.save(); cx.translate(q.x, q.y); cx.rotate(q.r); cx.fillStyle = q.c; cx.fillRect(-q.w/2, -q.h/2, q.w, q.h * Math.cos(f/6 + q.r)); cx.restore(); });
    if (++f < 170) requestAnimationFrame(tick); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
function toast(e, t) {
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = `<span class="e">${e}</span><span>${esc(t)}</span>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3300);
}
function xpUcur(el, txt) {
  const r = el.getBoundingClientRect(), d = document.createElement("div");
  d.className = "xpfloat"; d.textContent = txt; d.style.left = (r.left + r.width/2) + "px"; d.style.top = (r.top) + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
}
function sayac(el, hedef, sure = 900) {
  if (!el) return; const t0 = performance.now();
  (function t(n) { const k = Math.min(1, (n - t0) / sure); el.textContent = Math.round(hedef * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(t); })(t0);
}

/* ---------- ekran geçişi ---------- */
let tutScroll = null;
function goster(html, sonra) {
  $("#sheet").classList.remove("open");
  const eski = app.firstElementChild;
  const yap = () => { app.innerHTML = `<div class="screen">${html}</div>`; scrollTo({top:tutScroll ?? 0}); tutScroll = null; sonra && sonra(); };
  if (eski && !azHareket) { eski.classList.add("leaving"); setTimeout(yap, 180); } else yap();
}
function overlay(html, sure) {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "overlay"; o.setAttribute("role","dialog"); o.innerHTML = html;
    document.body.appendChild(o);
    const kapat = () => { if (!o.isConnected) return; o.classList.add("out"); setTimeout(() => { o.remove(); res(); }, 240); document.removeEventListener("keydown", kd); };
    const kd = e => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); kapat(); } };
    o.querySelectorAll("[data-kapat]").forEach(b => b.onclick = kapat);
    o.querySelector("[data-kapat]")?.focus();
    setTimeout(() => document.addEventListener("keydown", kd), 50);
    if (sure) setTimeout(kapat, sure);
  });
}

/* ================= TEST ================= */
let T = null;
const sabitSira = o => o.every(x => /^[\s\d.,/%√²³()π+\-−×:]+$/.test(x)) || o.some(x => /^(Yalnız|I\b|II\b|III\b|IV\b)/.test(x.trim()));

function soruSec(n, yol) {
  const H = yolHavuz(yol); if (!H.length) return [];
  const gruplar = {};
  H.forEach(q => { const k = DERS[q.d] ? q.d : "ek"; (gruplar[k] ||= []).push(q); });
  // az görülen önce, eşitler rastgele; dersler sırayla harmanlanır
  for (const k in gruplar) gruplar[k] = karistir(gruplar[k]).sort((a, b) => (S.gorulen[a.id] || 0) - (S.gorulen[b.id] || 0));
  const sira = karistir(Object.keys(gruplar)), out = [];
  while (out.length < n && sira.some(k => gruplar[k].length)) for (const k of sira) { if (out.length < n && gruplar[k].length) out.push(gruplar[k].shift()); }
  return karistir(out);
}
function hazirla(q) {
  const idx = q.o.map((_, i) => i), perm = sabitSira(q.o) ? idx : karistir(idx);
  return {...q, perm, dogruK: perm.indexOf(q.a)};
}

async function testBaslat(opt) {
  let sorular;
  if (opt.tip === "yanlis") {
    const m = new Map(tumu().map(q => [q.id, q]));
    sorular = karistir(Object.keys(S.yanlis).map(id => m.get(id)).filter(Boolean)).slice(0, S.ayar.soruSayisi);
  } else sorular = soruSec(S.ayar.soruSayisi, opt.yol || "karisik");
  if (!sorular.length) { toast("⚠️", "Seçili derslerde soru yok"); return; }
  T = {...opt, sorular:sorular.map(hazirla), i:0, dogru:0, combo:0, maxCombo:0, xp:0, cevap:[], t0:Date.now(), molaVerildi:false};
  if (!azHareket) {
    for (const n of ["3","2","1"]) await overlay(`<div class="ov-card"><div class="count">${n}</div></div>`, 650);
  }
  soruGoster();
}

function soruGoster() {
  const q = T.sorular[T.i], n = T.sorular.length, dk = DERS[q.d] ? q.d : "ek", D = DERS[dk];
  goster(`

    <div class="opts" role="group" aria-label="Seçenekler">
      ${q.perm.map((oi, k) => `<button class="opt" style="--i:${k}" data-k="${k}"><span class="l">${"ABCDE"[k]}</span><span>${fmt(q.o[oi])}</span></button>`).join("")}
    </div>

function cevapla(k) {
  if (!T || T.cevaplandi === T.i) return;

  const q = T.sorular[T.i], ok = k === q.dogruK, btns = [...app.querySelectorAll(".opt")];
  btns.forEach((b, j) => { b.disabled = true; if (j === q.dogruK) b.classList.add("ok"); else if (j === k) b.classList.add("bad"); else b.classList.add("dim"); });
  S.gorulen[q.id] = (S.gorulen[q.id] || 0) + 1; S.cozulen++;
  T.cevap.push({q, k, ok});
  let kazanc = 0;
  if (ok) {
    T.dogru++; T.combo++; T.maxCombo = Math.max(T.maxCombo, T.combo); S.dogru++;
    kazanc = 10 + Math.min(T.combo - 1, 5) * 2; T.xp += kazanc; S.xp += kazanc;

    if (T.combo >= 3 && !azHareket) konfeti(40);
  } else {
    T.combo = 0; S.yanlis[q.id] = 1; ses("bad"); titret(120);

  }

}

/* ================= SONUÇ ================= */
async function sonuc() {
  const n = T.sorular.length, d = T.dogru, p = Math.round(d / n * 100);
  const yildiz = p >= 90 ? 3 : p >= 70 ? 2 : p >= 50 ? 1 : 0;
  const lvOnce = seviye(S.xp).lv;
  let bonus = 0;
  if (T.tip === "test") {
    bonus = 20 + yildiz * 10;
    const TT = yolTest(T.yol), eski = TT[T.no];
    TT[T.no] = {yildiz:Math.max(yildiz, eski?.yildiz || 0), en:Math.max(d, eski?.en || 0)};
    rozetVer("ilk");
    if ([...Array(S.ayar.testSayisi).keys()].every(i => TT[i])) rozetVer("harita");
  }
  if (d === n && n >= 5) rozetVer("kusursuz");
  S.xp += bonus; T.xp += bonus;
  seriGuncelle(); save();
  const lvSonra = seviye(S.xp).lv, sure = Math.round((Date.now() - T.t0) / 1000);
  const mesaj = esc(sz(p >= 90 ? "Muhteşemsin {h}! Seninle gurur duyuyorum 🏆💖" : p >= 70 ? "Çok iyi {h}! Biraz daha ve zirvedesin 🚀💕" : p >= 50 ? "Güzel gidiyor {h}, yanlışları birlikte tekrar edelim 💪❤️" : "Her uzman bir zamanlar acemiydi {h}, ben sana inanıyorum 🌱💗"));
  const sonraki = T.tip === "test" && T.no + 1 < S.ayar.testSayisi ? T.no + 1 : null;
  const R = T;

  goster(`
  <div class="result">
    <div class="speaker" style="justify-content:center">${koala(p >= 50 ? "happy" : "sad")}<div class="bubble">${mesaj}</div></div>
    <h2 style="font-size:24px;font-weight:900;margin-top:14px">${R.tip === "test" ? `${esc(yolAd(R.yol))} · Test ${R.no + 1} bitti!` : "Yanlışlar tekrarı bitti!"}</h2>
    ${R.tip === "test" ? `<div class="bigstars">${[1,2,3].map(k => `<i class="${k <= yildiz ? "" : "off"}" style="animation-delay:${.3 + k * .25}s">⭐</i>`).join("")}</div>` : ""}
    <div class="ring" id="ring" style="--p:0"><div><b>${d}/${n}</b><span>%${p} başarı</span></div></div>
    <div class="rstats">
      <div class="stat"><b>+<span id="rx">0</span></b><span>XP</span></div>
      <div class="stat"><b>🔥${R.maxCombo}</b><span>En iyi seri</span></div>
      <div class="stat"><b>${Math.floor(sure / 60)}:${String(sure % 60).padStart(2, "0")}</b><span>Süre</span></div>
    </div>
    <div class="racts">
      ${sonraki !== null ? `<button class="btn gold wide" id="r-next">Sonraki Test (${sonraki + 1}) →</button>` : ""}
      ${R.cevap.some(c => !c.ok) ? `<button class="btn wide bad" id="r-yanlis">📒 Yanlışları Tekrar Et</button>` : ""}
      <button class="btn ghost wide" id="r-tekrar">🔄 Yeni Sorularla Tekrar</button>
      <button class="btn ghost wide" id="r-ev">🏠 Haritaya Dön</button>
    </div>
    <div class="review"><h2 class="sec">Cevapların</h2>
      ${R.cevap.map((c, i) => `<details class="rv"><summary>${c.ok ? "✅" : "❌"} <span>${i + 1}. ${esc(c.q.q.replace(/\s+/g, " ").slice(0, 80))}…</span></summary>
        <div class="body">${fmt(c.q.q)}\n\n<b>Doğru:</b> ${fmt(c.q.o[c.q.a])}${c.ok ? "" : `\n<b>Senin:</b> ${fmt(c.q.o[c.q.perm[c.k]])}`}${c.q.c ? `\n\n<b>Çözüm:</b> ${fmt(c.q.c)}` : ""}</div></details>`).join("")}
    </div>
  </div>`, () => {
    setTimeout(() => { $("#ring").style.setProperty("--p", p); }, 200);
    sayac($("#rx"), R.xp, 1200);
    if (p >= 70) { konfeti(); ses("win"); }
    $("#r-next") && ($("#r-next").onclick = () => testBaslat({tip:"test", yol:R.yol, no:sonraki}));
    $("#r-yanlis") && ($("#r-yanlis").onclick = () => testBaslat({tip:"yanlis"}));
    $("#r-tekrar").onclick = () => testBaslat(R.tip === "test" ? {tip:"test", yol:R.yol, no:R.no} : {tip:"yanlis"});
    $("#r-ev").onclick = anaSayfa;
    if (lvSonra > lvOnce) setTimeout(() => {
      ses("lvl"); konfeti(200);
      overlay(`<div class="ov-card">${koala("happy")}<h2>Seviye ${lvSonra}! 🎉</h2><p>Yeni unvanın: <b>${seviye(S.xp).unvan}</b></p><div class="tip">Pamuk da ben de seninle gurur duyuyoruz 💖</div><button class="btn gold wide" data-kapat>Süper!</button></div>`);
    }, 1400);
  });
  T = null;
}

/* ================= AYARLAR ================= */
function ayarlar() {
  const A = S.ayar;
  goster(`
  <div class="quiz">
    <header class="top"><button class="btn ghost" id="geri">← Geri</button><h2 style="font-weight:900">Ayarlar</h2><span style="width:80px"></span></header>
    <section class="panel glass stagger">
      <h3>Test düzeni</h3>
      <div class="row"><span>Test sayısı</span><b id="tsv">${A.testSayisi}</b></div>
      <input type="range" min="3" max="40" value="${A.testSayisi}" id="ts" aria-label="Test sayısı">
      <div class="row"><span>Test başına soru</span><b id="ssv">${A.soruSayisi}</b></div>
      <input type="range" min="5" max="40" value="${A.soruSayisi}" id="ss" aria-label="Test başına soru">
      <p class="note">Sorular her başlatmada havuzdan rastgele seçilir; az gördüğün sorular önceliklidir.</p>
    </section>
    <section class="panel glass">
      <h3>Karışık yolda hangi dersler olsun?</h3>
      <div class="checks">${Object.entries(DERS).map(([k, D]) => `<label class="ck" style="--c:${D.c}"><input type="checkbox" value="${k}" ${A.dersler.includes(k) ? "checked" : ""}><span>${D.ic} ${D.ad}</span></label>`).join("")}</div>
    </section>
    <section class="panel glass">
      <h3>Diğer</h3>
      <label style="display:block;font-weight:700;margin-bottom:6px" for="isim">Sana nasıl seslenelim? 💕</label>
      <input class="isim" id="isim" maxlength="24" placeholder="İsim ya da lakap (boşsa aşkım, sevgilim…)" value="${esc(A.isim || "")}">
      <label class="row"><span>Ses efektleri</span><input type="checkbox" id="sesk" ${A.ses ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--gold)"></label>
    </section>
    <section class="panel glass">
      <h3>Sıfırlama</h3>
      <p class="note" style="margin-top:0">Tek bir yolu sıfırlamak için ana sayfada haritanın altındaki “yolunu sıfırla” düğmesini kullan.</p>
      <div style="display:grid;gap:12px">
        <button class="btn ghost wide" id="yanlissifir">📒 Yanlışlar defterini temizle (${Object.keys(S.yanlis).length})</button>
        <button class="btn bad wide" id="sifirla">↺ Tüm ilerlemeyi sıfırla</button>
      </div>
      <p class="note">Tüm ilerleme: XP, seviye, yıldızlar, rozetler, seri ve yanlışlar silinir. Ayarların ve eklediğin sorular kalır.</p>
    </section>
  </div>`, () => {
    $("#geri").onclick = anaSayfa;
    $("#ts").oninput = e => { A.testSayisi = +e.target.value; $("#tsv").textContent = A.testSayisi; save(); };
    $("#ss").oninput = e => { A.soruSayisi = +e.target.value; $("#ssv").textContent = A.soruSayisi; save(); };
    app.querySelectorAll(".ck input").forEach(c => c.onchange = () => {
      const s = [...app.querySelectorAll(".ck input:checked")].map(x => x.value);
      if (!s.length) { c.checked = true; toast("⚠️", "En az bir ders seçili olmalı"); return; }
      A.dersler = s; save();
    });
    $("#isim").oninput = e => { A.isim = e.target.value.trim(); save(); };
    $("#sesk").onchange = e => { A.ses = e.target.checked; save(); ses("tik"); };
    const ikiDokun = (el, soru, yap) => el.onclick = () => {
      if (!el.dataset.o) { el.dataset.o = 1; el.textContent = soru; return; }
      yap();
    };
    ikiDokun($("#yanlissifir"), "Emin misin? Tekrar dokun", () => { S.yanlis = {}; save(); toast("📒", "Defter temizlendi"); ayarlar(); });
    ikiDokun($("#sifirla"), "Emin misin? Her şey silinecek, tekrar dokun", () => {
      const ek = S.ek, ayar = S.ayar; S = VARS(); S.ek = ek; S.ayar = ayar; save(); toast("🧽", "Sıfırlandı, yeni bir başlangıç 💕"); anaSayfa();
    });
  });
}

/* ================= SORU EKLE ================= */
const ORNEK = [{d:"tarih",k:"Kurtuluş Savaşı",q:"Misakımillî hangi meclis tarafından kabul edilmiştir?",o:["Son Osmanlı Mebusan Meclisi","TBMM","Erzurum Kongresi","Sivas Kongresi","Heyet-i Temsiliye"],a:0,c:"28 Ocak 1920'de Son Osmanlı Mebusan Meclisinde kabul edildi."}];
function soruEkle() {
  goster(`
  <div class="quiz">
    <header class="top"><button class="btn ghost" id="geri">← Geri</button><h2 style="font-weight:900">Soru Ekle</h2><span style="width:80px"></span></header>
    <section class="panel glass">
      <h3>JSON dosyası ya da metin</h3>
      <p class="note">Her soru: <b>d</b> ders (${Object.keys(DERS).join(", ")}), <b>k</b> konu, <b>q</b> soru, <b>o</b> şıklar (2–5), <b>a</b> doğru şıkkın sırası (0'dan başlar), <b>c</b> çözüm. Altı çizili ifade için <b>[[kelime]]</b> yaz.</p>
      <pre class="ex">${esc(JSON.stringify(ORNEK, null, 1))}</pre>
      <input type="file" accept=".json,application/json" id="dosya" style="margin:8px 0 12px">
      <textarea id="metin" placeholder="[ { &quot;d&quot;: &quot;turkce&quot;, ... } ]" aria-label="Soru JSON metni"></textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <button class="btn gold" id="yukle">Ekle</button><button class="btn ghost" id="indir">Örnek indir</button>
      </div>
      <div class="msg" id="msg"></div>
    </section>
    <section class="panel glass">
      <h3>Eklediğin sorular: ${S.ek.length}</h3>
      ${S.ek.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" id="disa">Dışa aktar</button><button class="btn bad" id="sil">Hepsini sil</button></div>` : '<p class="note">Henüz yok.</p>'}
    </section>
  </div>`, () => {
    $("#geri").onclick = anaSayfa;
    const msg = (t, ok) => { const m = $("#msg"); m.className = "msg " + (ok ? "ok" : "bad"); m.textContent = t; };
    const indir = (ad, veri) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(veri, null, 1)], {type:"application/json"})); a.download = ad; a.click(); };
    $("#dosya").onchange = async e => { const f = e.target.files[0]; if (f) $("#metin").value = await f.text(); };
    $("#indir").onclick = () => indir("ornek-sorular.json", ORNEK);
    $("#disa") && ($("#disa").onclick = () => indir("sorularim.json", S.ek));
    $("#sil") && ($("#sil").onclick = e => { if (e.target.dataset.o) { S.ek = []; save(); soruEkle(); } else { e.target.dataset.o = 1; e.target.textContent = "Emin misin?"; } });
    $("#yukle").onclick = () => {
      let arr; try { arr = JSON.parse($("#metin").value); } catch (e) { return msg("JSON okunamadı: " + e.message, false); }
      if (!Array.isArray(arr)) arr = [arr];
      const var_ = new Set(tumu().map(q => q.id)), iyi = [], hata = [];
      arr.forEach((q, i) => {
        const ok = q && typeof q.q === "string" && q.q.trim() && Array.isArray(q.o) && q.o.length >= 2 && q.o.length <= 5 && q.o.every(x => typeof x === "string")
          && Number.isInteger(q.a) && q.a >= 0 && q.a < q.o.length;
        if (!ok) return hata.push(i + 1);
        const s = {d:DERS[q.d] ? q.d : "ek", k:String(q.k || ""), q:q.q, o:q.o, a:q.a, c:String(q.c || "")};
        s.id = hash(s.q + s.o.join("|"));
        if (!var_.has(s.id)) { var_.add(s.id); iyi.push(s); }
      });
      S.ek.push(...iyi); save();
      msg(`${iyi.length} soru eklendi.` + (hata.length ? ` Hatalı kayıtlar: ${hata.slice(0, 10).join(", ")}` : ""), iyi.length > 0);
      if (iyi.length) { ses("win"); konfeti(60); }
    };
  });
}

/* ---------- klavye ---------- */
document.addEventListener("keydown", e => {
  if (!T || document.querySelector(".overlay") || e.target.matches("input,textarea")) return;
  const k = "abcde".indexOf(e.key.toLowerCase()), n = "12345".indexOf(e.key);
  const sec = k >= 0 ? k : n;
  if (sec >= 0 && T.cevaplandi !== T.i && sec < T.sorular[T.i].o.length) cevapla(sec);
  else if (e.key === "Enter" && T.cevaplandi === T.i && document.activeElement?.id !== "devam") { e.preventDefault(); ilerle(); }
});

/* ---------- arka plan süsleri ---------- */
(() => {
  const bg = $(".bg");
  for (let i = 0; i < 40; i++) { const s = document.createElement("i"); s.className = "star"; s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${-Math.random() * 3}s`; bg.appendChild(s); }
  ["💕","📚","✨","🐨","💗","🌸","⭐","💖"].forEach((e, i) => { const f = document.createElement("i"); f.className = "floater"; f.textContent = e;
    f.style.cssText = `left:${5 + i * 12}%;animation-duration:${26 + i * 4}s;animation-delay:${-i * 5}s;font-style:normal`; bg.appendChild(f); });
})();

anaSayfa();
</script>
</body>
</html>
