<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<title>KPSS Koala</title>
<style>
:root{
  --bg1:#170f3d; --bg2:#2d1b69; --ink:#1f1a3d; --muted:#6b6790;
  --pri:#7c5cff; --pri-d:#5b3fd9; --pri-l:#c4b5fd;
  --ok:#22c55e; --ok-d:#15803d; --bad:#ef4444; --bad-d:#b91c1c;
  --gold:#fbbf24; --pink:#ff6ba6; --cyan:#22d3ee;
  --glass:rgba(255,255,255,.08); --glass-b:rgba(255,255,255,.14);
  --r:22px;
  --font:"Segoe UI Variable Display","Segoe UI","SF Pro Rounded",ui-rounded,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.2,1.5,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100dvh;color:#fff;font-family:var(--font);overflow-x:hidden;
  background:radial-gradient(120% 80% at 50% -10%,#3b2a8f 0%,transparent 60%),linear-gradient(165deg,var(--bg1),var(--bg2) 60%,#1a1050)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;line-height:1.15}
h2.sec{font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:26px 4px 12px}

/* ---------- arka plan ---------- */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.35;animation:drift 22s ease-in-out infinite alternate}
.blob.a{background:radial-gradient(circle,#ff6ba6 0%,transparent 60%);top:-25vmax;left:-20vmax}
.blob.b{background:radial-gradient(circle,#22d3ee 0%,transparent 60%);bottom:-30vmax;right:-25vmax;animation-delay:-8s}
.blob.c{background:radial-gradient(circle,#7c5cff 0%,transparent 60%);top:30%;left:40%;animation-duration:30s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1.2)}}
.floater{position:absolute;font-size:22px;opacity:.18;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}

#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.screen{animation:screenIn .45s var(--spring) both}
.screen.leaving{animation:screenOut .2s ease-in both}
@keyframes screenIn{from{opacity:0;transform:translateY(24px) scale(.98)}}
@keyframes screenOut{to{opacity:0;transform:translateY(-12px) scale(.98)}}
.stagger>*{animation:popIn .5s var(--spring) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.94)}}

.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:800;font-size:16px;
  background:var(--pri);box-shadow:0 5px 0 var(--pri-d);transition:transform .1s,box-shadow .1s,filter .2s;min-height:50px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn.gold{background:var(--gold);color:#3b2600;box-shadow:0 5px 0 #b7791f}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.node:focus-visible,.tile:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* ---------- üst bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.02em}
.brand span{background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:4px}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:800;font-size:14px;white-space:nowrap}
.chip.fire.on{background:linear-gradient(135deg,#ff8a00,#ff3d6e);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,90,60,.7)}}

/* ---------- maskot ---------- */
.owl{width:110px;height:auto;overflow:visible;flex:none}
.owl .body{transform-origin:60px 120px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.owl .lid{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.owl .pupil{transition:transform .3s}
.owl .heart{transform-box:fill-box;transform-origin:center;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.owl .ear{transform-box:fill-box;transform-origin:center bottom;animation:ear 3.8s ease-in-out infinite}
.owl .ear.r{animation-delay:-1.9s}
@keyframes ear{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}94%{transform:rotate(7deg)}}
.owl .wing{transform-box:fill-box;transform-origin:top center}
.owl .joy,.owl .brow{opacity:0;transition:opacity .2s}
.owl.happy .body{animation:hop .6s var(--spring) 2}
.owl.happy .eyes{opacity:0}.owl.happy .joy{opacity:1}
.owl.happy .wing.l{animation:flapL .3s ease-in-out 4}.owl.happy .wing.r{animation:flapR .3s ease-in-out 4}
@keyframes hop{40%{transform:translateY(-16px) scale(1.04,.96)}}
@keyframes flapL{50%{transform:rotate(35deg)}}@keyframes flapR{50%{transform:rotate(-35deg)}}
.owl.sad .body{animation:droop 1.2s ease-in-out both}
.owl.sad .brow{opacity:1}.owl.sad .pupil{transform:translateY(4px)}
@keyframes droop{30%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:translateY(3px)}}
.owl.think .pupil{transform:translate(4px,-4px)}
.speaker{display:flex;align-items:flex-end;gap:12px}
.bubble{position:relative;background:#fff;color:var(--ink);padding:12px 15px;border-radius:18px 18px 18px 4px;font-weight:700;font-size:15px;line-height:1.4;
  animation:bubble .55s var(--spring) both .15s;box-shadow:0 6px 0 rgba(0,0,0,.18)}
@keyframes bubble{from{opacity:0;transform:scale(.4) translate(-30px,20px)}}

/* ---------- ana sayfa ---------- */
.hero{padding:18px}
.lvl{margin-top:16px}
.lvl-row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:7px}
.lvl-row small{opacity:.7;font-weight:700}
.bar{height:14px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--pink));width:0;transition:width 1s var(--spring);position:relative;overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shimmer 2.2s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{text-align:center;padding:12px 6px;border-radius:16px;background:rgba(0,0,0,.18)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat>span{font-size:12px;opacity:.75;font-weight:700}
.cta{margin-top:16px;font-size:18px;min-height:56px;animation:popIn .5s var(--spring) both,ctaPulse 2.4s ease-in-out 1s infinite}
@keyframes ctaPulse{50%{transform:scale(1.03);box-shadow:0 5px 0 #b7791f,0 0 26px rgba(251,191,36,.55)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{padding:14px 8px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-b);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s var(--spring),background .2s;position:relative}
.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.tile .ic{font-size:26px}
.tile .badge-n{position:absolute;top:6px;right:8px;background:var(--bad);border-radius:99px;font-size:11px;padding:2px 7px}

/* harita */
.map{position:relative;margin:0 auto;max-width:440px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map{--c:#7c5cff}
.map::before{content:"";position:absolute;inset:0 -15%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 16%,transparent),transparent);pointer-events:none}
.map .path path{fill:none;stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:26px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));box-shadow:0 7px 0 color-mix(in srgb,var(--c) 50%,#000),0 12px 22px rgba(0,0,0,.35);transition:transform .2s var(--spring);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.node:hover{transform:translate(-50%,-50%) scale(1.08)}
.node:active{transform:translate(-50%,-46%)}
.node.done{background:linear-gradient(160deg,#fcd34d,#f59e0b);box-shadow:0 7px 0 #b45309,0 12px 22px rgba(0,0,0,.35);color:#4a2c00}
.node.locked{background:#3a3363;box-shadow:0 7px 0 #262046;color:rgba(255,255,255,.35);cursor:not-allowed}
.node.cur{animation:nodeBounce 1.6s var(--spring) infinite}
.node.cur::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes nodeBounce{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(-50%,-62%)}40%{transform:translate(-50%,-50%)}}
.node .stars{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:-1px;white-space:nowrap}
.node .stars .off{filter:grayscale(1);opacity:.3}
.node .lbl{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:12px;font-weight:900;padding:4px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node .lbl::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.bdg{text-align:center;padding:12px 6px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);font-size:12px;font-weight:700;line-height:1.25}
.bdg .e{font-size:30px;display:block;margin-bottom:4px}
.bdg.off{opacity:.35}.bdg.off .e{filter:grayscale(1)}
.bdg.on .e{animation:bdgWiggle 3s ease-in-out infinite}
@keyframes bdgWiggle{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-12deg) scale(1.15)}95%{transform:rotate(12deg) scale(1.15)}}
.yollar{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.yollar::-webkit-scrollbar{display:none}
.yol{flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:16px;font-weight:800;font-size:14px;background:rgba(255,255,255,.07);
  border:2px solid color-mix(in srgb,var(--c) 55%,transparent);transition:transform .25s var(--spring),background .2s}
.yol small{opacity:.75;font-size:11px}
.yol:hover{transform:translateY(-2px)}
.yol.on{background:var(--c);color:#1b1035;border-color:var(--c);transform:scale(1.06);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 55%,transparent)}
.yol:focus-visible{outline:3px solid #fff;outline-offset:2px}
h2.yolbas{opacity:1;color:var(--c)}
.isim{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--glass-b);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-weight:700;margin-bottom:14px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;justify-content:center;font-size:12px;opacity:.75}
.pool span{padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.08)}

/* ---------- quiz ---------- */
.quiz{max-width:680px;margin:0 auto;padding-bottom:40px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:18px;font-weight:900;flex:none}
.qtop .bar{flex:1;height:18px}
.qtop .bar>i{background:linear-gradient(90deg,var(--ok),#a3e635)}
.combo{font-weight:900;min-width:58px;text-align:right;font-size:16px;transition:transform .3s var(--spring)}
.combo.hot{color:var(--gold);animation:comboPop .5s var(--spring)}
@keyframes comboPop{40%{transform:scale(1.6) rotate(-8deg)}}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;font-weight:800;font-size:13px}
.dchip{padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 28%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.qcard{background:#fff;color:var(--ink);border-radius:24px;padding:22px 20px;font-size:17px;line-height:1.6;box-shadow:0 8px 0 rgba(0,0,0,.18);
  animation:cardIn .55s var(--spring) both;white-space:pre-line;font-weight:500}
.qcard u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(3deg)}}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:16px;background:#fff;color:var(--ink);font-size:16px;font-weight:600;line-height:1.4;
  border:2px solid #e3defc;border-bottom-width:5px;transition:transform .12s,border-color .2s,background .2s,opacity .3s;animation:popIn .45s var(--spring) both;animation-delay:calc(.15s + var(--i)*55ms);min-height:56px}
.opt:hover:not(:disabled){border-color:var(--pri-l);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt .l{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#f0edff;color:var(--pri-d);font-weight:900}
.opt:disabled{cursor:default}
.opt.ok{background:#dcfce7;border-color:var(--ok);animation:okPulse .6s var(--spring)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{background:#fee2e2;border-color:var(--bad);animation:shake .45s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
@keyframes okPulse{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .45s var(--spring);padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet-in{max-width:680px;margin:0 auto;border-radius:24px;padding:16px;color:var(--ink);max-height:62vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.okk .sheet-in{background:#d9fbe5}
.sheet.badd .sheet-in{background:#ffe1e1}
.sheet .speaker .owl{width:64px}
.sheet h3{font-size:20px;font-weight:900}
.sheet .btn{color:#fff}
.sheet.okk h3{color:var(--ok-d)}.sheet.badd h3{color:var(--bad-d)}
.sheet .exp{margin:10px 0 14px;font-size:15px;line-height:1.55;white-space:pre-line}
.sheet .exp b{color:var(--ink)}
.sheet .src{font-size:12px;opacity:.7;word-break:break-all}
.xpfloat{position:fixed;z-index:30;font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #7a4b00;pointer-events:none;animation:xpUp 1.1s ease-out forwards}
@keyframes xpUp{from{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-20px) scale(1.2)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.kbd{font-size:12px;opacity:.5;text-align:center;margin-top:14px}
@media (hover:none){.kbd{display:none}}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(14,8,40,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .3s both}
.overlay.out{animation:fadeOut .25s both}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.ov-card{text-align:center;max-width:380px;width:100%;animation:ovIn .6s var(--spring) both}
@keyframes ovIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.ov-card .owl{width:150px;margin:0 auto 8px;display:block}
.ov-card h2{font-size:28px;font-weight:900;margin-bottom:10px}
.ov-card p{font-size:17px;line-height:1.5;opacity:.92;margin:0 0 8px}
.ov-card .tip{display:inline-block;margin:10px 0 22px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:14px;font-weight:700}
.count{font-size:120px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation:countPop .8s var(--spring) both}
@keyframes countPop{from{transform:scale(2.5);opacity:0}60%{opacity:1}to{transform:scale(1)}}
.breath{width:120px;height:120px;margin:6px auto 14px;border-radius:50%;background:radial-gradient(circle,var(--cyan),transparent 70%);animation:breath 8s ease-in-out infinite;display:grid;place-items:center;font-weight:800;font-size:13px}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}

/* ---------- sonuç ---------- */
.result{max-width:560px;margin:0 auto;text-align:center}
.ring{width:190px;height:190px;margin:10px auto;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0);transition:--p 1s;animation:popIn .6s var(--spring) both}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
.ring>div{width:150px;height:150px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;align-content:center}
.ring b{font-size:46px;font-weight:900}.ring span{font-size:13px;opacity:.7;font-weight:700}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:52px;margin:6px 0}
.bigstars i{font-style:normal;display:inline-block;animation:starIn .7s var(--spring) both}
.bigstars i.off{filter:grayscale(1) brightness(.6);opacity:.4}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.racts{display:grid;gap:12px;margin-top:8px}
.review{text-align:left;margin-top:26px}
.rv{padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);margin-bottom:8px}
.rv summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:8px}
.rv summary::-webkit-details-marker{display:none}
.rv .body{font-size:14px;line-height:1.55;margin-top:10px;opacity:.9;white-space:pre-line}

.toast{position:fixed;top:14px;left:50%;z-index:50;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:18px;
  background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#3b2600;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toast 3.2s var(--spring) forwards;white-space:nowrap}
.toast .e{font-size:28px}
@keyframes toast{0%{transform:translate(-50%,-140%)}12%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140%)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- formlar ---------- */
.panel{padding:18px;margin-bottom:14px}
.panel h3{font-size:17px;font-weight:900;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0;font-weight:700}
input[type=range]{width:100%;accent-color:var(--gold)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{position:relative}
.ck input{position:absolute;opacity:0}
.ck span{display:inline-flex;gap:6px;padding:9px 13px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid transparent;font-weight:800;font-size:14px;transition:.2s}
.ck input:checked+span{background:color-mix(in srgb,var(--c) 35%,transparent);border-color:var(--c)}
.ck input:focus-visible+span{outline:3px solid var(--cyan)}
textarea{width:100%;min-height:180px;border-radius:14px;border:0;padding:12px;font:13px/1.45 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.3);color:#fff}
pre.ex{background:rgba(0,0,0,.3);padding:12px;border-radius:14px;font-size:12px;overflow:auto;white-space:pre-wrap}
.note{font-size:14px;line-height:1.5;opacity:.85}
.msg{margin-top:10px;font-weight:800}
.msg.ok{color:#86efac}.msg.bad{color:#fca5a5}

@media (min-width:960px){
  #app{max-width:1100px;padding-top:28px}
  .home{display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr;column-gap:36px;align-items:start}
  .yollar{flex-wrap:wrap;margin:0;padding-inline:2px}
  .home .side{grid-column:1;grid-row:1}.home .bdgs{grid-column:1;grid-row:2}.home .main{grid-column:2;grid-row:1/span 2}
  .owl{width:130px}
  .qcard{font-size:18px;padding:28px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script id="veri" type="application/json">[{"d":"cografya","k":"Coğrafi konum","q":"Türkiye'de güneyden kuzeye doğru gidildikçe aşağıdakilerden hangisi azalır?","o":["Güneş ışınlarının yere düşme açısı","Öğle vakti cisimlerin gölge boyu","Kutup Yıldızı'nın ufuk düzlemiyle yaptığı açı","Yaz mevsiminde gündüz süresi","Kış mevsiminde gece süresi"],"a":0,"c":"Kuzeye gidildikçe enlem artar ve Güneş ışınlarının geliş açısı küçülür. Buna bağlı olarak gölge boyu, Kutup Yıldızı'nın yükseklik açısı ve mevsimlere göre gün uzunluğu farkı artar."},{"d":"cografya","k":"Coğrafi konum","q":"Aşağıdaki ülkelerden hangisinin Türkiye ile kara sınırı yoktur?","o":["Azerbaycan","Lübnan","Ermenistan","Bulgaristan","Irak"],"a":1,"c":"Türkiye'nin kara komşuları Yunanistan, Bulgaristan, Gürcistan, Ermenistan, Azerbaycan (Nahçıvan), İran, Irak ve Suriye'dir. Lübnan'ın Türkiye ile kara sınırı yoktur."},{"d":"cografya","k":"Yer şekilleri","q":"Aşağıdaki dağlardan hangisi Ege Bölgesi'nde kırılma sonucu yükselmiş horst özelliği gösterir?","o":["Erciyes Dağı","Kaçkar Dağları","Bozdağlar","Nemrut Dağı","Hasan Dağı"],"a":2,"c":"Ege'de fay hatları boyunca yükselen bloklar (horst) dağları, çöken bloklar (graben) ovaları oluşturmuştur; Bozdağlar bir horsttur. Erciyes, Nemrut ve Hasan volkanik, Kaçkarlar kıvrım dağıdır."},{"d":"cografya","k":"Yer şekilleri","q":"Aşağıdaki dağlardan hangisi volkanik kökenli değildir?","o":["Erciyes Dağı","Süphan Dağı","Karacadağ","Uludağ","Hasan Dağı"],"a":3,"c":"Erciyes, Süphan, Karacadağ ve Hasan Dağı volkanik dağlardır. Uludağ ise kırılmalarla yükselmiş, granitten oluşan bir kütle dağıdır."},{"d":"cografya","k":"Kıyı şekilleri","q":"Eskiden bir ada iken kıyı ile arasındaki sığ alanın akarsu ve dalga birikintileriyle dolarak karaya bağlanmasıyla oluşan (tombolo) yarımadaya Türkiye'deki örnek aşağıdakilerden hangisidir?","o":["Gelibolu Yarımadası","Biga Yarımadası","Kocaeli Yarımadası","Teke Yarımadası","Kapıdağ Yarımadası"],"a":4,"c":"Marmara Denizi'ndeki Kapıdağ, eskiden bir ada iken kıyıyla arasının dolmasıyla karaya bağlanmış bir tombolodur. Diğerleri ana karanın uzantısı olan yarımadalardır."},{"d":"cografya","k":"Kıyı tipleri","q":"Aşağıdaki kıyı tipi–yer eşleştirmelerinden hangisi yanlıştır?","o":["Enine kıyı – Doğu Karadeniz","Boyuna kıyı – Akdeniz","Enine kıyı – Ege","Ria kıyı – Haliç","Boyuna kıyı – Karadeniz"],"a":0,"c":"Doğu Karadeniz'de dağlar kıyıya paralel uzandığı için boyuna kıyı görülür. Enine kıyı, dağların kıyıya dik uzandığı Ege'de tipiktir."},{"d":"cografya","k":"İklim","q":"Dağ yamacı boyunca alçalan havanın ısınıp kuruması sonucu oluşan ve Doğu Karadeniz kıyılarında kış aylarında ani sıcaklık artışlarına yol açan rüzgâr aşağıdakilerden hangisidir?","o":["Poyraz","Föhn","Lodos","Meltem","Karayel"],"a":1,"c":"Föhn, dağı aşan havanın inişe geçtiği yamaçta adyabatik olarak ısınmasıyla oluşan sıcak ve kuru rüzgârdır. Doğu Karadeniz'de kışın sıcaklığın birden yükselmesine neden olur."},{"d":"cografya","k":"Bitki örtüsü","q":"Aşağıdaki ağaç türlerinden hangisi Akdeniz kıyı kuşağının alçak kesimlerinde en geniş yayılışa sahiptir?","o":["Ladin","Sarıçam","Kızılçam","Kayın","Doğu kara çamı"],"a":2,"c":"Kızılçam sıcağa ve yaz kuraklığına dayanıklıdır; Akdeniz ve Ege kıyılarının alçak kesimlerinde yaygındır. Ladin ve kayın Karadeniz'de, sarıçam ise Sarıkamış gibi soğuk alanlarda öne çıkar."},{"d":"cografya","k":"Toprak","q":"Çayır ve uzun boylu ot örtüsü altında oluşan, organik maddece zengin çernozyom (kara topraklar) Türkiye'de en çok hangi yörede görülür?","o":["Antalya-Alanya","Rize-Hopa","Muğla-Fethiye","Kars-Ardahan","İzmir-Torbalı"],"a":3,"c":"Çernozyomlar yaz yağışlarıyla gelişen çayırların bulunduğu Kars-Ardahan platosunda yaygındır. Bu topraklar humusça zengin ve verimlidir."},{"d":"cografya","k":"Toprak","q":"Aşağıdakilerden hangisi oluştuğu yerden taşınarak biriken (azonal) topraklara örnektir?","o":["Terra rossa","Podzol","Çernozyom","Kahverengi bozkır toprağı","Alüvyal toprak"],"a":4,"c":"Alüvyal topraklar akarsuların taşıyıp ova ve deltalarda biriktirdiği malzemeden oluşur, bu yüzden taşınmış topraktır. Diğerleri bulundukları yerde oluşmuş yerli topraklardır."},{"d":"cografya","k":"Akarsular","q":"Aşağıdaki akarsulardan hangisi Karadeniz'e dökülür?","o":["Sakarya","Seyhan","Gediz","Meriç","Asi"],"a":0,"c":"Sakarya Nehri İç Anadolu'dan doğup Karadeniz'e dökülür. Seyhan ve Asi Akdeniz'e, Gediz ve Meriç Ege Denizi'ne dökülür."},{"d":"cografya","k":"Barajlar","q":"Aşağıdaki baraj–akarsu eşleştirmelerinden hangisi yanlıştır?","o":["Keban – Fırat","Sarıyar – Seyhan","Hirfanlı – Kızılırmak","Ilısu – Dicle","Deriner – Çoruh"],"a":1,"c":"Sarıyar Barajı Sakarya Nehri üzerindedir. Diğer eşleştirmeler doğrudur."},{"d":"cografya","k":"Nüfus","q":"Cumhuriyet döneminde Türkiye'nin ilk genel nüfus sayımı hangi yıl yapılmıştır?","o":["1923","1927","1935","1945","1950"],"a":1,"c":"Cumhuriyet'in ilk genel nüfus sayımı 1927'de yapılmıştır. 2007'den itibaren nüfus bilgileri Adrese Dayalı Nüfus Kayıt Sistemi ile her yıl belirlenmektedir."},{"d":"cografya","k":"Nüfus","q":"Tarımsal nüfus yoğunluğu aşağıdakilerden hangisiyle hesaplanır?","o":["Toplam nüfus / Yüzölçümü","Toplam nüfus / Tarım alanı","Kır nüfusu / Yüzölçümü","Tarımla geçinen nüfus / Tarım alanı","Tarımla geçinen nüfus / Toplam nüfus"],"a":3,"c":"Tarımsal nüfus yoğunluğu, tarımla geçinen nüfusun tarım alanına bölünmesiyle bulunur. Toplam nüfusun yüzölçümüne oranı aritmetik, tarım alanına oranı fizyolojik yoğunluktur."},{"d":"cografya","k":"Yerleşme","q":"Köy yerleşmesine bağlı, az sayıda konuttan oluşan ve tarım alanlarına yakın kurulan; özellikle Doğu ve Güneydoğu Anadolu'da yaygın olan kır yerleşmesi aşağıdakilerden hangisidir?","o":["Yayla","Oba","Dalyan","Ağıl","Mezra"],"a":4,"c":"Mezra, köye bağlı birkaç evden oluşan ve tarım arazisine yakın kurulan küçük yerleşmedir. Oba göçebelerin çadır yerleşmesi, dalyan balıkçılık, yayla ise yaz otlatmacılığı yerleşmesidir."},{"d":"cografya","k":"Göç","q":"Türkiye'den yurt dışına resmî işçi göçünün başlamasını sağlayan ilk iş gücü anlaşması 1961 yılında hangi ülkeyle imzalanmıştır?","o":["Federal Almanya","Fransa","Hollanda","İngiltere","Avusturya"],"a":0,"c":"1961'de Federal Almanya ile imzalanan iş gücü anlaşmasıyla Türkiye'den Avrupa'ya düzenli işçi göçü başlamıştır. Diğer Avrupa ülkeleriyle anlaşmalar daha sonra imzalanmıştır."},{"d":"cografya","k":"Tarım","q":"Aşağıdaki ürünlerden hangisinin üretiminde Türkiye dünyada ilk sıradadır?","o":["Pirinç","Fındık","Soya fasulyesi","Mısır","Pamuk"],"a":1,"c":"Türkiye, Ordu, Giresun ve Samsun başta olmak üzere Karadeniz kıyılarında yetiştirdiği fındıkta dünya üretiminin yarıdan fazlasını sağlar."},{"d":"cografya","k":"Hayvancılık","q":"Erzurum-Kars yöresinde büyükbaş hayvancılığın yaygın olmasının temel doğal nedeni aşağıdakilerden hangisidir?","o":["Kışların ılık geçmesi","Makilerin geniş yer kaplaması","Yaz yağışlarıyla gür çayırların oluşması","Sulamalı tarım alanlarının fazlalığı","Kıyıya yakın olması"],"a":2,"c":"Yüksek ve soğuk olan bu yörede yaz yağışları gür çayır ve meraların oluşmasını sağlar. Bu otlaklar büyükbaş hayvancılığın temel dayanağıdır."},{"d":"cografya","k":"Madenler","q":"Artvin-Murgul, Kastamonu-Küre ve Elazığ-Maden'de çıkarılan maden aşağıdakilerden hangisidir?","o":["Bor","Krom","Boksit","Bakır","Linyit"],"a":3,"c":"Murgul, Küre ve Maden Türkiye'nin başlıca bakır yataklarıdır. Bor Eskişehir-Kütahya-Balıkesir, krom Elazığ-Guleman ve Bursa-Orhaneli, boksit Seydişehir çevresinde öne çıkar."},{"d":"cografya","k":"Enerji kaynakları","q":"Kahramanmaraş'taki Afşin-Elbistan termik santrallerinde yakıt olarak kullanılan kaynak aşağıdakilerden hangisidir?","o":["Taş kömürü","Doğal gaz","Petrol","Asfaltit","Linyit"],"a":4,"c":"Afşin-Elbistan havzası Türkiye'nin en büyük linyit rezervine sahiptir. Buradaki termik santraller bu linyiti yakıt olarak kullanır."},{"d":"cografya","k":"Enerji kaynakları","q":"Türkiye'de rüzgâr enerjisinden elektrik üretiminin en yoğun yapıldığı kesim aşağıdakilerden hangisidir?","o":["Ege ve Marmara kıyıları","Doğu Karadeniz kıyıları","Hakkâri yöresi","Dicle Havzası","Erzurum-Kars yöresi"],"a":0,"c":"Sürekli ve kuvvetli rüzgârlar alan Çanakkale, Balıkesir ve İzmir gibi Ege ve Marmara kıyı illeri rüzgâr santrallerinin en yoğun olduğu yerlerdir."},{"d":"cografya","k":"Enerji kaynakları","q":"Türkiye'nin ilk nükleer güç santrali olan Akkuyu Nükleer Santrali hangi ilde kurulmaktadır?","o":["Sinop","Mersin","Antalya","Muğla","Kırklareli"],"a":1,"c":"Akkuyu Nükleer Güç Santrali Mersin'in Gülnar ilçesinde kurulmaktadır. Sinop ikinci santral için düşünülen sahalardan biridir."},{"d":"cografya","k":"Sanayi","q":"Aşağıdaki illerin hangisinde petrol rafinerisi bulunmaz?","o":["Batman","Kocaeli","Rize","İzmir","Kırıkkale"],"a":2,"c":"Türkiye'deki rafineriler Kocaeli (İzmit), İzmir (Aliağa), Kırıkkale ve Batman'dadır. Rize'de rafineri yoktur; ildeki sanayi daha çok çay işlemeye dayanır."},{"d":"cografya","k":"Ulaşım","q":"Türkiye'de kara ve demir yollarının genellikle doğu-batı yönünde uzanmasının temel nedeni aşağıdakilerden hangisidir?","o":["Nüfusun kıyılarda toplanması","Akarsuların kuzey-güney yönünde akması","İklimin doğuya doğru sertleşmesi","Dağların doğu-batı doğrultusunda uzanması","Sanayinin batıda yoğunlaşması"],"a":3,"c":"Kuzey Anadolu ve Toros dağları doğu-batı doğrultusunda uzandığından ulaşım yolları da vadiler ve platolar boyunca bu yönde uzanır. Kuzey-güney yönlü bağlantılar ise geçitler sayesinde sağlanır."},{"d":"cografya","k":"Ticaret","q":"Bir ülkenin belirli bir dönemdeki ihracat değerinin ithalat değerine oranının yüzde olarak ifadesine ne ad verilir?","o":["Dış ticaret hacmi","Dış ticaret açığı","Cari işlemler dengesi","Gümrük birliği","İhracatın ithalatı karşılama oranı"],"a":4,"c":"İhracat/ithalat × 100 işlemi ihracatın ithalatı karşılama oranını verir. Dış ticaret hacmi ise ihracat ile ithalatın toplamıdır."},{"d":"cografya","k":"Turizm","q":"Aşağıdaki turizm varlığı–il eşleştirmelerinden hangisi yanlıştır?","o":["Safranbolu evleri – Bartın","Sümela Manastırı – Trabzon","Nemrut Dağı – Adıyaman","Göbeklitepe – Şanlıurfa","Efes Antik Kenti – İzmir"],"a":0,"c":"Safranbolu, UNESCO Dünya Mirası listesindeki geleneksel evleriyle Karabük iline bağlı bir ilçedir. Diğer eşleştirmeler doğrudur."},{"d":"cografya","k":"Bölgesel kalkınma projeleri","q":"Aşağıdaki illerden hangisi Doğu Karadeniz Projesi (DOKAP) kapsamındadır?","o":["Malatya","Gümüşhane","Erzurum","Mardin","Konya"],"a":1,"c":"DOKAP; Artvin, Bayburt, Giresun, Gümüşhane, Ordu, Rize ve Trabzon gibi Doğu Karadeniz illerini kapsar. Malatya ve Erzurum DAP, Mardin GAP, Konya KOP kapsamındadır."},{"d":"cografya","k":"Bölgesel kalkınma projeleri","q":"Akdeniz'e akan Göksu Havzası'ndaki suyun \"Mavi Tünel\" ile kapalı havzaya aktarılarak tarım alanlarının sulanması aşağıdaki projelerden hangisi kapsamındadır?","o":["GAP","DAP","KOP","DOKAP","Yeşil Yol Projesi"],"a":2,"c":"Konya Ovası Projesi (KOP), su sıkıntısı çeken Konya Ovası'na Göksu Havzası'ndan Mavi Tünel ile su aktarılmasını kapsar."},{"d":"cografya","k":"Doğal afetler","q":"Aşağıdaki illerin hangisinde çığ tehlikesi en fazladır?","o":["Antalya","İzmir","Edirne","Hakkâri","Konya"],"a":3,"c":"Çığ, eğimli yamaçlarda biriken kalın kar örtüsünün kaymasıyla oluşur. Kışları uzun ve kar yağışlı, engebesi fazla olan Hakkâri bu bakımdan en riskli illerdendir."},{"d":"cografya","k":"Doğal afetler","q":"Aşağıdakilerden hangisi toprak erozyonunu önlemeye yönelik bir uygulama değildir?","o":["Eğimli arazilerde taraçalama yapılması","Ağaçlandırma yapılması","Eğime dik sürüm yapılması","Rüzgâr perdeleri oluşturulması","Hasattan sonra anızın yakılması"],"a":4,"c":"Anız yakmak toprağı örtüsüz bırakır ve organik maddeyi yok eder; erozyonu artırır. Diğer uygulamalar toprağı yerinde tutmaya yöneliktir."},{"d":"cografya","k":"Korunan alanlar","q":"Türkiye'nin ilk millî parkı olarak 1958 yılında ilan edilen alan aşağıdakilerden hangisidir?","o":["Yozgat Çamlığı","Uludağ","Kuşcenneti","Göreme","Olimpos-Beydağları"],"a":0,"c":"Yozgat Çamlığı, 1958'de Türkiye'nin ilk millî parkı ilan edilmiştir. Uludağ ve Kuşcenneti gibi alanlar daha sonra millî park olmuştur."},{"d":"cografya","k":"Korunan alanlar","q":"Balıkesir'de yer alan ve göçmen kuşların konaklama alanı olan Kuşcenneti Millî Parkı aşağıdaki göllerden hangisinin kıyısındadır?","o":["Uluabat Gölü","Manyas (Kuş) Gölü","Sapanca Gölü","Eğirdir Gölü","Burdur Gölü"],"a":1,"c":"Kuşcenneti Millî Parkı, Bandırma yakınındaki Manyas (Kuş) Gölü'nün kuzeydoğu kıyısındadır. Pek çok su kuşu türünün üreme ve konaklama alanıdır."},{"d":"cografya","k":"Bölgeler","q":"Aşağıdakilerden hangisi Karadeniz Bölgesi'nde bulunmaz?","o":["Sümela Manastırı","Uzungöl","Köprülü Kanyon","Ayder Yaylası","Zigana Geçidi"],"a":2,"c":"Köprülü Kanyon Antalya'dadır (Akdeniz Bölgesi). Sümela ve Uzungöl Trabzon'da, Ayder Rize'de, Zigana Geçidi Trabzon-Gümüşhane arasındadır."},{"d":"cografya","k":"Bölgeler","q":"Aşağıdakilerden hangisi Doğu Anadolu Bölgesi'nde yer almaz?","o":["İshak Paşa Sarayı","Nemrut Kalderası","Muradiye Şelalesi","Harran Ovası","Ağrı Dağı"],"a":3,"c":"Harran Ovası Şanlıurfa'dadır ve Güneydoğu Anadolu Bölgesi'nde yer alır. İshak Paşa Sarayı ve Ağrı Dağı Ağrı'da, Nemrut Kalderası Bitlis'te, Muradiye Şelalesi Van'dadır."},{"d":"cografya","k":"Yer şekilleri","q":"Türkiye haritasında Mersin ile Hatay arasında, Seyhan ve Ceyhan nehirlerinin taşıdığı alüvyonlarla oluşmuş geniş bir delta ovası işaretlenmiştir.\nİşaretlenen bu ova aşağıdakilerden hangisidir?","o":["Bafra Ovası","Amik Ovası","Silifke Ovası","Harran Ovası","Çukurova"],"a":4,"c":"Seyhan ve Ceyhan nehirlerinin birlikte oluşturduğu delta ovası Çukurova'dır. Bafra Kızılırmak'ın, Silifke Göksu'nun deltasıdır; Amik ve Harran ise delta ovası değildir."},{"d":"cografya","k":"Coğrafi konum","q":"Aşağıdakilerden hangisi Türkiye'nin matematik konumunun bir sonucudur?","o":["Karadeniz kıyılarında yağışın yıl boyunca fazla olması","Güneye bakan yamaçların kuzeye bakan yamaçlara göre daha sıcak olması","Boğazlar sayesinde önemli ticaret yollarının üzerinde bulunması","Doğu Anadolu'da kışların uzun ve sert geçmesi","Üç tarafının denizlerle çevrili olması"],"a":1,"c":"Kuzey Yarım Küre'de bulunan Türkiye'de Güneş ışınları güneyden geldiği için güneye bakan yamaçlar daha fazla ısınır; bu, enlemle ilgili matematik konum sonucudur. Diğerleri yer şekilleri ve özel konumla ilgilidir."},{"d":"cografya","k":"Coğrafi konum","q":"Türkiye 26° ve 45° doğu meridyenleri arasında yer almaktadır.\nBuna göre Türkiye'nin en doğu ucu ile en batı ucu arasındaki yerel saat farkı kaç dakikadır?","o":["19","36","60","76","96"],"a":3,"c":"Meridyenler arasında 45 − 26 = 19 fark vardır; her meridyen 4 dakikalık fark yarattığından 19 × 4 = 76 dakikadır."},{"d":"cografya","k":"Coğrafi konum","q":"I. Kuzey Yarım Küre'de yer alması\nII. Asya, Avrupa ve Afrika kıtalarının birbirine yaklaştığı yerde bulunması\nIII. Dağların kıyıya paralel uzanması\nTürkiye'de kuzeye bakan dağ yamaçlarında kar örtüsünün daha uzun süre yerde kalması, yukarıdakilerden hangileriyle ilişkilidir?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":0,"c":"Kuzey Yarım Küre'de Güneş ışınları güneyden geldiği için kuzey yamaçlar daha az ısınır ve kar daha geç erir. Kıtalara yakınlık ve dağların uzanışı bu durumla ilgili değildir."},{"d":"cografya","k":"Coğrafi konum","q":"Aşağıdakilerden hangisi Türkiye'nin göreceli (özel) konumuyla ilişkili değildir?","o":["Jeopolitik öneminin yüksek olması","Enerji nakil hatlarının topraklarından geçmesi","Zengin bir kültürel mirasa sahip olması","Kısa mesafelerde farklı iklim özelliklerinin görülmesi","Gece ile gündüz sürelerinin yıl içinde değişmesi"],"a":4,"c":"Gece-gündüz sürelerinin yıl içinde değişmesi, Dünya'nın eksen eğikliği ve enlemle ilgili olup matematik konumun sonucudur."},{"d":"cografya","k":"Yer şekilleri","q":"Aşağıdaki göllerden hangisinin oluşumu diğerlerinden farklıdır?","o":["Tortum Gölü","Van Gölü","Sera Gölü","Yedigöller","Abant Gölü"],"a":1,"c":"Tortum, Abant, Sera ve Yedigöller heyelan set gölüdür. Van Gölü ise Nemrut Dağı'ndan çıkan lavların önünü kapatmasıyla oluşmuş volkanik set gölüdür."},{"d":"cografya","k":"Yer şekilleri","q":"Aşağıdakilerden hangisi karstik bir yer şekli değildir?","o":["Pamukkale travertenleri","Damlataş Mağarası","Karapınar obrukları","Ürgüp peribacaları","Elmalı polyesi"],"a":3,"c":"Peribacaları volkanik tüflerin sel suları ve akarsularla aşındırılmasıyla oluşur. Diğerleri kalkerli arazide suyun eritme ve biriktirme etkisiyle oluşan karstik şekillerdir."},{"d":"cografya","k":"Yer şekilleri","q":"Son buzul çağından kalan sirk gölleri ve buzul vadileri aşağıdaki dağların hangisinde yaygın olarak görülür?","o":["Yunt Dağı","Karacadağ","Madra Dağı","Kaz Dağı","Kaçkar Dağları"],"a":4,"c":"Buzul şekilleri, yüksekliği fazla olan Kaçkar, Ağrı, Erciyes, Uludağ gibi dağlarda görülür. Diğer dağlar alçak olduğu için buzullaşmaya uğramamıştır."},{"d":"cografya","k":"Yer şekilleri","q":"Aşağıdaki ovalardan hangisi delta ovası değildir?","o":["Muş Ovası","Çarşamba Ovası","Silifke Ovası","Çukurova","Bafra Ovası"],"a":0,"c":"Bafra (Kızılırmak), Çarşamba (Yeşilırmak), Silifke (Göksu) ve Çukurova (Seyhan-Ceyhan) akarsuların denize döküldüğü yerde oluşan delta ovalarıdır. Muş Ovası ise iç kesimde tektonik kökenli bir ovadır."},{"d":"cografya","k":"Yer şekilleri","q":"I. Büyük Menderes Nehri'nin oluşturduğu büklümler\nII. Kızılırmak Deltası\nIII. Salda Gölü\nIV. Ağrı Dağı\nYukarıdaki yer şekillerinden hangilerinin oluşumunda akarsular etkili olmuştur?","o":["I ve II","I ve IV","II ve III","II ve IV","III ve IV"],"a":0,"c":"Menderesler ve deltalar akarsu aşındırma ve biriktirmesiyle oluşur. Salda Gölü karstik, Ağrı Dağı ise volkanik kökenlidir."},{"d":"cografya","k":"Yer şekilleri","q":"Ege Bölgesi'nde Gediz, Küçük Menderes ve Büyük Menderes ovalarının oluşumunda temel etken aşağıdakilerden hangisidir?","o":["Kalkerli arazinin erimesi","Tektonik çöküntü alanlarının akarsu alüvyonlarıyla dolması","Buzulların aşındırması","Lavların geniş alanlara yayılması","Rüzgârın taşıdığı kumların birikmesi"],"a":1,"c":"Bu ovalar kırılmalarla oluşan graben adlı çöküntü alanlarıdır; akarsuların getirdiği alüvyonlarla dolarak verimli ovalara dönüşmüşlerdir."},{"d":"cografya","k":"İklim ve bitki örtüsü","q":"Kızılçam ormanlarının tahrip edildiği alanlarda ortaya çıkan, yaz kuraklığına dayanıklı, sık ve her mevsim yeşil kalan çalı topluluğu aşağıdakilerden hangisidir?","o":["Bozkır","Psödomaki","Dağ çayırı","Maki","Tundra"],"a":3,"c":"Akdeniz ikliminin doğal bitki örtüsü kızılçam ormanlarıdır; bu ormanlar tahrip edilince yerini maki adı verilen sık çalılıklar alır."},{"d":"cografya","k":"İklim ve bitki örtüsü","q":"Aşağıdaki illerin hangisinde yağışın mevsimlere dağılışı en dengelidir?","o":["Konya","Antalya","Edirne","Diyarbakır","Rize"],"a":4,"c":"Rize'de Karadeniz iklimi görülür; bu iklimde her mevsim yağış alınır ve yağışın mevsimlere dağılışı en dengelidir."},{"d":"cografya","k":"İklim ve bitki örtüsü","q":"Konya Ovası'nda yaz ile kış arasındaki sıcaklık farkının fazla olmasının temel nedeni aşağıdakilerden hangisidir?","o":["Denizel etkilerin çevredeki dağlarla engellenmesi","Ekvator'a yakın olması","Orman varlığının fazla olması","Yükseltisinin deniz seviyesine yakın olması","Yaz aylarında bol yağış alması"],"a":0,"c":"Kıyıya paralel uzanan dağlar denizin ılımanlaştırıcı etkisini engeller; bu nedenle iç kesimlerde karasallık artar ve yıllık sıcaklık farkı büyür."},{"d":"cografya","k":"İklim ve bitki örtüsü","q":"Aşağıdaki bölge-bitki örtüsü eşleştirmelerinden hangisi yanlıştır?","o":["İç Anadolu – Bozkır","Güneydoğu Anadolu – Tropikal yağmur ormanları","Doğu Karadeniz kıyıları – Geniş yapraklı ormanlar","Doğu Anadolu'nun yüksek kesimleri – Dağ çayırları","Akdeniz kıyıları – Maki"],"a":1,"c":"Türkiye'de tropikal yağmur ormanları bulunmaz; Güneydoğu Anadolu'da yaz kuraklığına bağlı olarak bozkır yaygındır."},{"d":"cografya","k":"Toprak","q":"Kalkerli kayaçların ayrışmasıyla oluşan ve içerdiği demir oksit nedeniyle kırmızı renkli olan terra rossa toprakları aşağıdaki illerin hangisinde daha yaygındır?","o":["Erzurum","Rize","Antalya","Edirne","Kastamonu"],"a":2,"c":"Terra rossa, Akdeniz ikliminin görüldüğü kalkerli alanlarda oluşur; en yaygın görüldüğü yerler Akdeniz kıyılarıdır."},{"d":"cografya","k":"Akarsular ve göller","q":"I. Aras\nII. Fırat\nIII. Dicle\nIV. Çoruh\nYukarıdaki akarsulardan hangileri Türkiye'den doğup Basra Körfezi'ne ulaşır?","o":["I ve II","I ve IV","II ve III","II ve IV","III ve IV"],"a":2,"c":"Fırat ve Dicle Irak'ta birleşip Şattülarap adıyla Basra Körfezi'ne dökülür. Aras Hazar Denizi'ne, Çoruh ise Gürcistan'dan geçerek Karadeniz'e ulaşır."},{"d":"cografya","k":"Akarsular ve göller","q":"Aşağıdaki akarsulardan hangisi denize ulaşmayıp kapalı bir havzaya dökülür?","o":["Kızılırmak","Gediz","Seyhan","Bendimahi Çayı","Yeşilırmak"],"a":3,"c":"Bendimahi Çayı Van Gölü'ne dökülür; Van Gölü havzası denizle bağlantısı olmayan kapalı bir havzadır."},{"d":"cografya","k":"Kıyı tipleri","q":"Karadeniz kıyılarının az girintili çıkıntılı olmasının temel nedeni aşağıdakilerden hangisidir?","o":["Yağış miktarının fazla olması","Gel-git genliğinin fazla olması","Akarsuların kısa olması","Kıyıda kumul alanlarının yaygın olması","Dağların kıyıya paralel uzanması"],"a":4,"c":"Karadeniz'de dağlar kıyıya paralel uzandığı için boyuna kıyı tipi oluşmuştur; bu kıyılar az girintili çıkıntılıdır."},{"d":"cografya","k":"Kıyı tipleri","q":"Akarsu vadilerinin deniz suları altında kalmasıyla oluşan ria tipi kıyıya Türkiye'deki en tipik örnek aşağıdakilerden hangisidir?","o":["Haliç (İstanbul)","Kapıdağ Yarımadası","Antalya falezleri","Ölüdeniz lagünü","Bafra deltası"],"a":0,"c":"İstanbul'daki Haliç, akarsu vadisinin deniz suları altında kalmasıyla oluşmuş bir ria örneğidir. Kapıdağ tombolo, Ölüdeniz lagün, Antalya falez kıyısıdır."},{"d":"cografya","k":"Akarsular ve göller","q":"Van ve Tuz göllerinin sularının sodalı ya da tuzlu olmasında aşağıdakilerden hangisi belirleyicidir?","o":["Göllerin derin olması","Göllerin bir gideğeninin (denize akıntısının) olmaması","Göllerin yükseltisinin fazla olması","Göllere çok sayıda akarsu dökülmesi","Göllerin çevresinde ormanların bulunması"],"a":1,"c":"Gideğeni olmayan göllerde su yalnızca buharlaşmayla kaybedilir; akarsuların getirdiği mineraller birikir ve su tuzlu ya da sodalı hâle gelir."},{"d":"cografya","k":"Nüfus","q":"Aşağıdaki illerin hangisinde aritmetik nüfus yoğunluğu en azdır?","o":["İstanbul","Kocaeli","Tunceli","İzmir","Bursa"],"a":2,"c":"Tunceli engebeli yüzeyi ve sınırlı ekonomik olanakları nedeniyle Türkiye'de nüfus yoğunluğu en düşük illerdendir."},{"d":"cografya","k":"Nüfus","q":"Tabanı geniş, tepesi dar olan bir nüfus piramidine sahip ülke için;\nI. Doğum oranı yüksektir.\nII. Genç nüfus oranı fazladır.\nIII. Ortanca yaş yüksektir.\nyargılarından hangileri söylenebilir?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":2,"c":"Geniş taban doğum oranının ve genç nüfusun fazla olduğunu gösterir. Böyle ülkelerde ortanca yaş düşüktür."},{"d":"cografya","k":"Yerleşme","q":"Doğu Karadeniz'de kırsal yerleşmelerin dağınık olmasının temel nedeni aşağıdakilerden hangisidir?","o":["Kurak iklim koşullarının görülmesi","Geniş düzlüklerin bulunması","Maden yataklarının fazla olması","Engebeli arazi ve her yerde su bulunabilmesi","Nüfusun büyük kısmının sanayide çalışması"],"a":3,"c":"Eğimli arazi toplu yerleşmeyi zorlaştırır; bol yağış nedeniyle her yerde su bulunabildiği için konutlar tarım alanlarının yakınına dağınık biçimde kurulur."},{"d":"cografya","k":"Göç","q":"I. Tarımda makineleşme\nII. Şehirlerde sanayinin gelişmesi\nIII. Kırsal nüfusun azalması\nTürkiye'de 1950'li yıllardan sonra kırdan kente göçü hızlandıran etkenler yukarıdakilerden hangileridir?","o":["Yalnız I","Yalnız III","I ve II","I ve III","II ve III"],"a":2,"c":"Makineleşme kırda iş gücü ihtiyacını azaltmış, sanayi kentlerde iş olanağı yaratmıştır. Kırsal nüfusun azalması göçün nedeni değil, sonucudur."},{"d":"cografya","k":"Göç","q":"Aşağıdakilerden hangisi mevsimlik göçe örnektir?","o":["1960'larda Almanya'ya yapılan işçi göçü","Nüfus mübadelesiyle Balkanlardan gelenler","Köyden büyük şehre kalıcı olarak taşınma","Nitelikli iş gücünün yurt dışına gitmesi","Fındık hasadında Ordu ve Giresun'a gelen tarım işçileri"],"a":4,"c":"Fındık hasadı gibi belli dönemlerde gidilip iş bitince dönülen hareketler mevsimlik göçtür."},{"d":"cografya","k":"Tarım","q":"Aşağıdakilerden hangisi çay bitkisinin yetişme koşullarından biri değildir?","o":["Belirgin bir yaz kuraklığı","Nemli hava","Asitli topraklar","Bol ve düzenli yağış","Kışların ılık geçmesi"],"a":0,"c":"Çay her mevsim yağış ve nem ister; yaz kuraklığı çay için olumsuzdur. Bu nedenle Doğu Karadeniz kıyılarında yetişir."},{"d":"cografya","k":"Tarım","q":"Aşağıdaki illerin hangisinde zeytin tarımı yapılamaz?","o":["Balıkesir","Erzurum","Muğla","Hatay","Bursa"],"a":1,"c":"Zeytin kış soğuklarına dayanıksızdır; ılıman kıyı illerinde yetişir. Kışları çok sert geçen Erzurum'da zeytin yetişmez."},{"d":"cografya","k":"Tarım","q":"Aşağıdaki ürün-il eşleştirmelerinden hangisi yanlıştır?","o":["Fındık – Ordu","Çay – Rize","Muz – Kars","Antep fıstığı – Gaziantep","Haşhaş – Afyonkarahisar"],"a":2,"c":"Muz yüksek sıcaklık ister ve Türkiye'de Anamur-Alanya kıyılarında yetişir. Kars, soğuk iklimi nedeniyle muz yetiştiriciliğine uygun değildir."},{"d":"cografya","k":"Hayvancılık","q":"Akdeniz Bölgesi'nde Toros Dağları'nın makilerle kaplı engebeli yamaçlarında yaygın olarak beslenen hayvan aşağıdakilerden hangisidir?","o":["Tiftik keçisi","Manda","Merinos koyunu","Kıl keçisi","Kültür ırkı sığır"],"a":3,"c":"Kıl keçisi engebeli arazilere ve maki örtüsüne uyum sağlar; bu nedenle Toroslarda yaygındır."},{"d":"cografya","k":"Tarım","q":"GAP kapsamındaki sulama çalışmalarından sonra Harran Ovası'nda üretimi en fazla artan sanayi bitkisi aşağıdakilerden hangisidir?","o":["Çay","Tütün","Şeker pancarı","Haşhaş","Pamuk"],"a":4,"c":"Pamuk yüksek sıcaklık ve sulama ister; Harran Ovası sulamaya açılınca Türkiye'nin en önemli pamuk üretim alanlarından biri olmuştur."},{"d":"cografya","k":"Madenler","q":"Dünya rezervlerinin büyük bölümü Türkiye'de bulunan ve Eskişehir-Kırka, Balıkesir-Bigadiç ile Kütahya-Emet'te çıkarılan maden aşağıdakilerden hangisidir?","o":["Bor","Boksit","Krom","Bakır","Linyit"],"a":0,"c":"Türkiye dünya bor rezervlerinin yaklaşık dörtte üçüne sahiptir; başlıca yataklar Kırka, Bigadiç, Emet ve Kestelek'tedir."},{"d":"cografya","k":"Enerji kaynakları","q":"Türkiye'de taşkömürü üretiminin yapıldığı başlıca havza aşağıdakilerden hangisidir?","o":["Afşin-Elbistan","Zonguldak","Tunçbilek","Soma","Batman"],"a":1,"c":"Taşkömürü Zonguldak ve çevresinde çıkarılır. Afşin-Elbistan, Soma ve Tunçbilek linyit, Batman ise petrol üretim alanıdır."},{"d":"cografya","k":"Enerji kaynakları","q":"Türkiye'de jeotermal enerjiden elektrik üretiminin en fazla yapıldığı iller aşağıdakilerin hangisinde birlikte verilmiştir?","o":["Konya ve Karaman","Rize ve Artvin","Aydın ve Denizli","Edirne ve Kırklareli","Hakkari ve Şırnak"],"a":2,"c":"Jeotermal kaynakların sıcaklığı Batı Anadolu'nun fay hatları boyunca yüksektir; jeotermal elektrik santrallerinin çoğu Aydın ve Denizli'dedir."},{"d":"cografya","k":"Sanayi","q":"Aşağıdaki illerin hangisinde demir-çelik fabrikası bulunmaz?","o":["Karabük","Zonguldak","Hatay","Nevşehir","İzmir"],"a":3,"c":"Karabük, Zonguldak (Ereğli), Hatay (İskenderun) ve İzmir (Aliağa) demir-çelik üretimi yapılan yerlerdir; Nevşehir'de demir-çelik tesisi yoktur."},{"d":"cografya","k":"Sanayi","q":"Şeker fabrikalarının şeker pancarı tarımının yapıldığı alanlara yakın kurulmasının temel nedeni aşağıdakilerden hangisidir?","o":["Enerji ihtiyacının az olması","Liman olanaklarından yararlanılması","Ürünün dışa satımının kolaylaşması","Nitelikli iş gücüne ihtiyaç duyulması","Hammaddenin uzun süre bekletilememesi ve taşımanın maliyetli olması"],"a":4,"c":"Şeker pancarı hasattan sonra uzun süre bekletilince şeker oranı düşer ve hacimli olduğundan taşınması pahalıdır; bu yüzden fabrikalar hammaddeye yakın kurulur."},{"d":"cografya","k":"Ulaşım","q":"Aşağıdakilerden hangisi İstanbul Boğazı'nın iki yakasını birbirine bağlayan ulaşım yapılarından biri değildir?","o":["1915 Çanakkale Köprüsü","Yavuz Sultan Selim Köprüsü","15 Temmuz Şehitler Köprüsü","Avrasya Tüneli","Marmaray"],"a":0,"c":"1915 Çanakkale Köprüsü İstanbul Boğazı'nda değil, Çanakkale Boğazı üzerinde Lapseki ile Gelibolu arasındadır."},{"d":"cografya","k":"Ulaşım","q":"Karadeniz Bölgesi'nde kıyı boyunca demir yolu ağının gelişmemesinin temel nedeni aşağıdakilerden hangisidir?","o":["Nüfusun az olması","Dağların kıyıya paralel uzanması ve arazinin engebeli olması","Kıyıda büyük limanların bulunmaması","Tarım ürünlerinin az olması","Kış aylarında denizin donması"],"a":1,"c":"Engebeli ve eğimli arazi, demir yolu yapımını teknik açıdan güçleştirir ve maliyetini çok artırır."},{"d":"cografya","k":"Turizm","q":"Aşağıdaki turizm varlıklarından hangisi Nevşehir ilinde bulunmaz?","o":["Göreme","Derinkuyu Yeraltı Şehri","Sümela Manastırı","Avanos","Ürgüp"],"a":2,"c":"Sümela Manastırı Trabzon'un Maçka ilçesindedir. Göreme, Derinkuyu, Ürgüp ve Avanos Kapadokya bölgesinde, Nevşehir'dedir."},{"d":"cografya","k":"Turizm","q":"Aşağıdakilerden hangisi bir kış turizmi merkezi değildir?","o":["Palandöken","Erciyes","Sarıkamış","Ölüdeniz","Kartalkaya"],"a":3,"c":"Ölüdeniz Muğla-Fethiye'de bir deniz-kum-güneş turizmi merkezidir. Diğerleri kayak merkezleridir."},{"d":"cografya","k":"Bölgesel kalkınma projeleri","q":"Aşağıdaki illerden hangisi Güneydoğu Anadolu Projesi (GAP) kapsamında yer almaz?","o":["Batman","Kilis","Şırnak","Adıyaman","Malatya"],"a":4,"c":"GAP; Adıyaman, Batman, Diyarbakır, Gaziantep, Kilis, Mardin, Siirt, Şanlıurfa ve Şırnak'ı kapsar. Malatya Doğu Anadolu Projesi (DAP) içindedir."},{"d":"cografya","k":"Doğal afetler","q":"Aşağıdaki illerin hangisinde deprem tehlikesi diğerlerine göre daha azdır?","o":["Konya","Bingöl","Düzce","Erzincan","Kahramanmaraş"],"a":0,"c":"Bingöl, Düzce, Erzincan ve Kahramanmaraş aktif fay hatları üzerindedir. İç Anadolu'nun orta kesimlerinde yer alan Konya'da deprem tehlikesi görece azdır."},{"d":"cografya","k":"Doğal afetler","q":"Eğimin fazla olması, killi toprakların yaygınlığı ve bol yağış nedeniyle heyelanın en sık yaşandığı bölge aşağıdakilerden hangisidir?","o":["Ege","Karadeniz","İç Anadolu","Güneydoğu Anadolu","Marmara"],"a":1,"c":"Karadeniz Bölgesi'nde eğimli yamaçlar, killi topraklar ve her mevsim düşen yağış heyelan riskini artırır."},{"d":"guncel","k":"Türk dünyası","q":"TÜRKSOY tarafından \"2026 Türk Dünyası Kültür Başkenti\" ilan edilen şehir aşağıdakilerden hangisidir?","o":["Andican","Aktau","Şuşa","Anav","Bursa"],"a":0,"c":"TÜRKSOY Daimi Konseyi, 2025 Türk Dünyası Kültür Başkenti Aktau'daki toplantısında Özbekistan'ın Andican şehrini 2026 Türk Dünyası Kültür Başkenti ilan etti (Aralık 2025).","src":"https://www.aa.com.tr/tr/kultur/ozbekistanin-andican-sehri-2026-turk-dunyasi-kultur-baskenti-ilan-edildi/3757173"},{"d":"guncel","k":"Türk dünyası","q":"Andican'ı 2026 Türk Dünyası Kültür Başkenti ilan eden TÜRKSOY Daimi Konseyi toplantısına ev sahipliği yapan ve 2025 Türk Dünyası Kültür Başkenti olan Aktau şehri hangi ülkededir?","o":["Özbekistan","Kazakistan","Türkmenistan","Kırgızistan","Azerbaycan"],"a":1,"c":"2025 Türk Dünyası Kültür Başkenti Aktau, Kazakistan'ın Hazar kıyısındaki şehridir; TÜRKSOY'un 42. Daimi Konsey toplantısı burada yapıldı (2025).","src":"https://www.aa.com.tr/tr/kultur/ozbekistanin-andican-sehri-2026-turk-dunyasi-kultur-baskenti-ilan-edildi/3757173"},{"d":"guncel","k":"UNESCO","q":"2025 yılında UNESCO Yaratıcı Şehirler Ağı'na \"edebiyat\" alanında katılan Türk şehri aşağıdakilerden hangisidir?","o":["Konya","Erzurum","Kahramanmaraş","Trabzon","Eskişehir"],"a":2,"c":"Kahramanmaraş 2025'te edebiyat temasıyla ağa katıldı; böylece Türkiye'nin UNESCO Yaratıcı Şehir sayısı 9'a ulaştı ve edebiyat alanındaki ilk Türk şehri oldu.","src":"https://www.unesco.org.tr/home/AnnouncementDetail/6587"},{"d":"guncel","k":"Enerji","q":"Mayıs 2025'te Karadeniz'de 75 milyar metreküplük yeni doğal gaz keşfinin yapıldığı kuyu aşağıdakilerden hangisidir?","o":["Türkali-1","Sakarya-1","Amasra-1","Göktepe-3","Tuna-1"],"a":3,"c":"Cumhurbaşkanı Erdoğan 17 Mayıs 2025'te Göktepe-3 kuyusunda 75 milyar m³ yeni rezerv bulunduğunu açıkladı; Karadeniz'deki toplam rezerv 785 milyar m³'e çıktı.","src":"https://tr.euronews.com/2025/05/17/erdogan-75-milyar-metrekup-dogalgaz-kesfettik-konutlarimizin-ihtiyacini-35-yil-karsilayaca"},{"d":"guncel","k":"Enerji","q":"Mayıs 2025'te açıklanan Göktepe-3 kuyusundaki 75 milyar metreküplük doğal gaz keşfini gerçekleştiren yedinci nesil sondaj gemisi aşağıdakilerden hangisidir?","o":["Fatih","Yavuz","Kanuni","Oruç Reis","Abdülhamid Han"],"a":4,"c":"Göktepe-3 sondajı 27 Mart 2025'te Abdülhamid Han sondaj gemisiyle başladı; keşif 17 Mayıs 2025'te duyuruldu. Oruç Reis bir sismik araştırma gemisidir.","src":"https://www.gazetebirlik.com/ekonomi/turkiyenin-gururu-abdulhamid-han-sondaj-gemisi-75-milyar-metrekup-dogal-gaz-kesfetti/912253"},{"d":"guncel","k":"Yasal düzenleme","q":"Türkiye'nin ilk iklim kanunu olan 7552 sayılı İklim Kanunu, Resmî Gazete'de yayımlanarak hangi tarihte yürürlüğe girmiştir?","o":["9 Temmuz 2025","19 Mart 2025","1 Ocak 2025","29 Ekim 2024","15 Temmuz 2026"],"a":0,"c":"TBMM'de 2 Temmuz 2025'te kabul edilen İklim Kanunu 9 Temmuz 2025'te Resmî Gazete'de yayımlanarak yürürlüğe girdi; 2053 net sıfır emisyon hedefini yasal çerçeveye oturttu.","src":"https://www.aa.com.tr/tr/gundem/iklim-kanunu-resmi-gazetede/3625549"},{"d":"guncel","k":"Yasal düzenleme","q":"Mart 2025'te TBMM'de kabul edilip 19 Mart 2025'te Resmî Gazete'de yayımlanan 7545 sayılı kanun aşağıdakilerden hangisidir?","o":["İklim Kanunu","Siber Güvenlik Kanunu","Kişisel Verilerin Korunması Kanunu","Maden Kanunu","Hayvanları Koruma Kanunu
