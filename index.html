a","İtalya","Azerbaycan"],"a":0,"c":"Togg, Münih'teki IAA Mobility fuarında tanıtımın ardından 29 Eylül 2025'te Almanya'da satışa başladı.","src":"https://www.donanimhaber.com/togg-t10f-ve-t10x-almanya-da-satisa-cikti-fiyatlar-nasil--196635"},{"d":"guncel","k":"Zirve","q":"17-19 Nisan 2026 tarihlerinde beşincisi düzenlenen Antalya Diplomasi Forumu'nun ana teması aşağıdakilerden hangisidir?","o":["Kriz Çağında Ortak Akıl","Yarını Tasarlarken Belirsizliklerle Baş Etmek","Barışın Yeniden İnşası","Dijital Diplomasinin Geleceği","Bölgesel Sahiplenme, Küresel Çözümler"],"a":1,"c":"ADF2026, \"Yarını Tasarlarken Belirsizliklerle Baş Etmek\" temasıyla 17-19 Nisan 2026'da Antalya NEST Kongre Merkezi'nde yapıldı.","src":"https://www.mfa.gov.tr/v-antalya-diplomasi-forumu--17-19-nisan-2026--antalya.en.mfa"},{"d":"guncel","k":"Dünya liderleri","q":"3 Ocak 2026'da ABD'nin düzenlediği askerî operasyonla eşiyle birlikte yakalanarak New York'a götürülen devlet başkanı hangi ülkenin lideridir?","o":["Küba","Kolombiya","Venezuela","Nikaragua","Bolivya"],"a":2,"c":"ABD, 3 Ocak 2026'daki operasyonla Venezuela Devlet Başkanı Nicolás Maduro ve eşi Cilia Flores'i yakaladı.","src":"https://tr.euronews.com/2026/01/03/trump-venezuela-saldirisini-dogruladi-maduro-ve-esi-yakalandi"},{"d":"guncel","k":"Dünya liderleri","q":"Sıkıyönetim ilan eden Yoon Suk-yeol'un görevden alınmasının ardından yapılan seçimi kazanarak 4 Haziran 2025'te Güney Kore Devlet Başkanı olan isim kimdir?","o":["Moon Jae-in","Han Duck-soo","Park Geun-hye","Lee Jae-myung","Ban Ki-moon"],"a":3,"c":"Demokrat Parti adayı Lee Jae-myung 4 Haziran 2025'te Güney Kore'nin 14. devlet başkanı olarak göreve başladı.","src":"https://www.hrw.org/news/2025/06/04/south-korea-elects-new-president"},{"d":"guncel","k":"Türkiye","q":"Türkiye, Mayıs 2026'da oy birliğiyle hangi kuruluşun 2027-2028 dönem başkanlığına seçilmiştir?","o":["Dünya Turizm Örgütü","Uluslararası Denizcilik Örgütü","Dünya Posta Birliği","Uluslararası Telekomünikasyon Birliği","Uluslararası Ulaştırma Forumu (ITF)"],"a":4,"c":"Ulaştırma ve Altyapı Bakanı Abdulkadir Uraloğlu, Türkiye'nin Mayıs 2026'da ITF'nin 2027-2028 dönem başkanlığına seçildiğini duyurdu.","src":"https://www.takvim.com.tr/guncel/2026/05/07/turkiye-uluslararasi-ulastirma-forumu-baskanligina-secildi"},{"d":"matematik","k":"Temel işlemler","q":"(3/5 − 1/4) · (2 + 6/7)\nişleminin sonucu kaçtır?","o":["1/2","3/4","1","7/5","2"],"a":2,"c":"3/5 − 1/4 = 12/20 − 5/20 = 7/20\n2 + 6/7 = 20/7\n(7/20) · (20/7) = 1"},{"d":"matematik","k":"Temel işlemler","q":"1,25 · 0,8 + 2,7 : 0,03\nişleminin sonucu kaçtır?","o":["10","19","81","91","100"],"a":3,"c":"1,25 · 0,8 = 1\n2,7 : 0,03 = 270 : 3 = 90\n1 + 90 = 91"},{"d":"matematik","k":"Temel işlemler","q":"1 + 1 / (1 + 1 / (1 + 1/2))\nişleminin sonucu kaçtır?","o":["3/2","8/5","5/3","7/4","2"],"a":1,"c":"İçten dışa: 1 + 1/2 = 3/2\n1 + 1/(3/2) = 1 + 2/3 = 5/3\n1 + 1/(5/3) = 1 + 3/5 = 8/5"},{"d":"matematik","k":"Temel işlemler","q":"(0,2)² · 50 + 0,36 : 0,6\nişleminin sonucu kaçtır?","o":["1,4","1,8","2,2","2,4","2,6"],"a":4,"c":"(0,2)² = 0,04 → 0,04 · 50 = 2\n0,36 : 0,6 = 0,6\n2 + 0,6 = 2,6"},{"d":"matematik","k":"Temel işlemler","q":"a = 0,6\nb = 5/8\nc = 7/12\nolduğuna göre, a, b ve c'nin doğru sıralanışı aşağıdakilerden hangisidir?","o":["c \u003c a \u003c b","a \u003c c \u003c b","a \u003c b \u003c c","b \u003c c \u003c a","c \u003c b \u003c a"],"a":0,"c":"Payda 120 yapılır: a = 72/120, b = 75/120, c = 70/120\nc \u003c a \u003c b"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"2ˣ⁺³ + 2ˣ⁺¹ = 80\nolduğuna göre, 4ˣ kaçtır?","o":["16","32","64","128","256"],"a":2,"c":"2ˣ · (2³ + 2) = 2ˣ · 10 = 80 → 2ˣ = 8 → x = 3\n4ˣ = 4³ = 64"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"√18 · √8 + √50 / √2\nişleminin sonucu kaçtır?","o":["7","12","15","17","20"],"a":3,"c":"√18 · √8 = √144 = 12\n√50 / √2 = √25 = 5\n12 + 5 = 17"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"(3⁶ · 9⁻²) / 27⁻¹\nişleminin sonucu kaçtır?","o":["243","324","486","729","972"],"a":0,"c":"9⁻² = 3⁻⁴, 27⁻¹ = 3⁻³\n3⁶ · 3⁻⁴ / 3⁻³ = 3⁶⁻⁴⁺³ = 3⁵ = 243"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"√0,16 + √0,09 + √1,44\nişleminin sonucu kaçtır?","o":["1,9","2,2","2,5","2,8","3,1"],"a":0,"c":"√0,16 = 0,4; √0,09 = 0,3; √1,44 = 1,2\n0,4 + 0,3 + 1,2 = 1,9"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"Dört basamaklı 2a7b sayısı 15 ile tam bölünebilmektedir.\nBuna göre, bu koşulu sağlayan kaç farklı 2a7b sayısı vardır?","o":["5","6","7","8","9"],"a":2,"c":"5 ile bölünme: b = 0 veya b = 5.\n3 ile bölünme: 2 + a + 7 + b = 9 + a + b → a + b, 3'ün katı olmalı.\nb = 0 → a ∈ {0, 3, 6, 9} (4 sayı)\nb = 5 → a ∈ {1, 4, 7} (3 sayı)\nToplam 7"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"a ve b asal sayılar olmak üzere\n3a + 5b = 41\nolduğuna göre, a · b çarpımı kaçtır?","o":["10","14","15","21","26"],"a":1,"c":"5b ≤ 41 → b ∈ {2, 3, 5, 7}\nb = 7 → 3a = 6 → a = 2 (asal); diğer b değerlerinde a tam sayı çıkmaz.\na · b = 2 · 7 = 14"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"Uzunlukları 72 m, 108 m ve 180 m olan üç top kumaş, hiç artmayacak biçimde eşit uzunlukta parçalara ayrılacaktır.\nParçalar olabildiğince uzun tutulursa toplam kaç parça elde edilir?","o":["4","6","8","9","10"],"a":4,"c":"EBOB(72, 108, 180) = 36 m\n72/36 + 108/36 + 180/36 = 2 + 3 + 5 = 10 parça"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"4, 5 ve 6 ile bölündüğünde her seferinde 3 kalanını veren iki basamaklı en büyük doğal sayı kaçtır?","o":["63","73","83","93","99"],"a":0,"c":"Sayı = EKOK(4, 5, 6) · k + 3 = 60k + 3\nk = 1 → 63; k = 2 → 123 (üç basamaklı)\nEn büyük iki basamaklı: 63"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"A doğal sayısının 9 ile bölümünden kalan 7'dir.\nBuna göre, 4A + 5 sayısının 9 ile bölümünden kalan kaçtır?","o":["2","3","5","6","8"],"a":3,"c":"A ≡ 7 (mod 9) → 4A + 5 ≡ 28 + 5 = 33\n33 = 3 · 9 + 6 → kalan 6"},{"d":"matematik","k":"Sayı problemleri","q":"Bir otoparkta yalnızca otomobil ve motosiklet bulunmaktadır. Toplam araç sayısı 38, toplam tekerlek sayısı 128'dir.\nBuna göre, otoparkta kaç motosiklet vardır?","o":["10","12","14","16","18"],"a":1,"c":"Otomobil o, motosiklet m: o + m = 38, 4o + 2m = 128\nİkinci denklemden birincinin 2 katı çıkarılır: 2o = 52 → o = 26\nm = 38 − 26 = 12"},{"d":"matematik","k":"Kesir problemleri","q":"Bir öğrenci bir kitabın ilk gün 2/7'sini, ikinci gün kalan kısmın 3/5'ini okumuştur. Geriye 60 sayfa kalmıştır.\nBuna göre, kitap kaç sayfadır?","o":["175","189","196","210","245"],"a":3,"c":"İlk günden sonra kalan: 5/7\nİkinci gün kalanın 2/5'i kalır: 5/7 · 2/5 = 2/7\n2/7 = 60 → kitap = 60 · 7/2 = 210"},{"d":"matematik","k":"Yaş problemleri","q":"İki kardeşin bugünkü yaşları toplamı 30'dur. 5 yıl önce büyük kardeşin yaşı, küçük kardeşin yaşının 3 katıydı.\nBuna göre, büyük kardeş bugün kaç yaşındadır?","o":["12","14","16","18","20"],"a":4,"c":"b + k = 30 ve b − 5 = 3(k − 5) → b = 3k − 10\n3k − 10 + k = 30 → k = 10, b = 20"},{"d":"matematik","k":"Yaş problemleri","q":"Bir babanın yaşı, üç çocuğunun yaşları toplamından 26 fazladır.\nBuna göre, kaç yıl sonra babanın yaşı çocuklarının yaşları toplamına eşit olur?","o":["13","14","16","18","26"],"a":0,"c":"Her yıl baba 1, çocukların toplamı 3 yaş artar; fark her yıl 2 kapanır.\n26 / 2 = 13 yıl"},{"d":"matematik","k":"Yüzde problemleri","q":"Bir firmadaki çalışanların %60'ı erkektir. Erkek çalışanların %20'si, kadın çalışanların %45'i yabancı dil bilmektedir.\nBuna göre, yabancı dil bilenlerin yüzde kaçı kadındır?","o":["50","55","60","65","70"],"a":2,"c":"Çalışan sayısı 100 olsun: 60 erkek, 40 kadın.\nDil bilen erkek: 60 · 0,20 = 12; kadın: 40 · 0,45 = 18\nToplam 30; kadın oranı 18/30 = %60"},{"d":"matematik","k":"Yüzde problemleri","q":"Bir çalışanın maaşına %15 zam yapılmış ve yeni maaşı 27 600 TL olmuştur.\nBuna göre, çalışanın zamdan önceki maaşı kaç TL'dir?","o":["22000","24000","24600","25200","26000"],"a":1,"c":"Eski maaş x olsun: 1,15x = 27 600\nx = 27 600 / 1,15 = 24 000 TL"},{"d":"matematik","k":"Kâr-zarar","q":"Bir mağaza, bir ürünün etiket fiyatını maliyetinin %50 fazlası olarak belirlemiştir. Ürünü etiket fiyatı üzerinden %20 indirimle 360 TL'ye satmıştır.\nBuna göre, mağaza bu satıştan kaç TL kâr etmiştir?","o":["30","45","50","60","75"],"a":3,"c":"Maliyet x: etiket 1,5x, satış 1,5x · 0,8 = 1,2x = 360 → x = 300\nKâr = 360 − 300 = 60 TL"},{"d":"matematik","k":"Karışım problemleri","q":"Şeker oranı %30 olan 50 kg şerbete önce 25 kg su, ardından 5 kg şeker ekleniyor.\nBuna göre, son karışımın şeker oranı yüzde kaçtır?","o":["25","27","30","32","35"],"a":0,"c":"Başlangıçta şeker: 50 · 0,30 = 15 kg\nSu eklenince toplam 75 kg; şeker eklenince şeker 20 kg, toplam 80 kg\n20/80 = %25"},{"d":"matematik","k":"Hız problemleri","q":"Bir yürüyüşçü bir yolu saatte 4 km hızla yürürse, saatte 5 km hızla yürüdüğü duruma göre 30 dakika geç varmaktadır.\nBuna göre, yol kaç km'dir?","o":["8","10","12","15","20"],"a":1,"c":"x/4 − x/5 = 1/2 (saat)\nx/20 = 1/2 → x = 10 km"},{"d":"matematik","k":"Hız problemleri","q":"Çevresi 600 m olan dairesel bir pistte iki koşucu aynı noktadan aynı anda, zıt yönlere doğru saniyede 4 m ve 6 m hızla koşmaya başlıyor.\nBuna göre, koşucular kaçıncı saniyede ikinci kez karşılaşır?","o":["60","90","100","120","150"],"a":3,"c":"Zıt yönde yaklaşma hızı 4 + 6 = 10 m/sn\nHer karşılaşmada toplam 600 m alınır → 600/10 = 60 sn\nİkinci karşılaşma: 2 · 60 = 120. saniye"},{"d":"matematik","k":"İşçi-havuz problemleri","q":"Bir işi Ayşe tek başına 10 günde, Fatma tek başına 15 günde bitirebilmektedir. İşe yalnız Ayşe başlamış, 4 gün çalıştıktan sonra ayrılmıştır.\nBuna göre, kalan işi Fatma tek başına kaç günde bitirir?","o":["5","6","7","8","9"],"a":4,"c":"Ayşe 4 günde işin 4/10 = 2/5'ini yapar; kalan 3/5.\nFatma: (3/5) · 15 = 9 gün"},{"d":"matematik","k":"İşçi-havuz problemleri","q":"Boş bir havuzu A musluğu tek başına 8 saatte, B musluğu tek başına 12 saatte doldurmaktadır. Havuzdaki bir gider ise dolu havuzu 24 saatte boşaltmaktadır.\nÜçü birlikte açılırsa boş havuz kaç saatte dolar?","o":["4","5","6","8","10"],"a":2,"c":"1/8 + 1/12 − 1/24 = 3/24 + 2/24 − 1/24 = 4/24 = 1/6\nHavuz 6 saatte dolar."},{"d":"matematik","k":"Oran-orantı","q":"Ölçeği 1 : 250 000 olan bir haritada iki kent arasındaki uzaklık 6 cm'dir.\nBuna göre, bu iki kent arasındaki gerçek uzaklık kaç km'dir?","o":["1,5","15","25","150","1500"],"a":1,"c":"6 · 250 000 = 1 500 000 cm\n1 km = 100 000 cm → 1 500 000 / 100 000 = 15 km"},{"d":"matematik","k":"Oran-orantı","q":"Üç ortak bir işe 2, 3 ve 7 sayılarıyla orantılı sermaye koymuş, yıl sonunda kârı sermayeleriyle orantılı paylaşmıştır. En çok pay alan ortak, en az pay alandan 40 bin TL fazla almıştır.\nBuna göre, toplam kâr kaç bin TL'dir?","o":["72","80","84","90","96"],"a":4,"c":"Paylar 2k, 3k, 7k → 7k − 2k = 5k = 40 → k = 8\nToplam: 12k = 96 bin TL"},{"d":"matematik","k":"Denklemler","q":"|2x − 5| = 7\neşitliğini sağlayan x değerlerinin toplamı kaçtır?","o":["1","3","5","6","7"],"a":2,"c":"2x − 5 = 7 → x = 6\n2x − 5 = −7 → x = −1\nToplam: 6 + (−1) = 5"},{"d":"matematik","k":"Denklemler","q":"|x − 3| \u003c 4\neşitsizliğini sağlayan tam sayıların toplamı kaçtır?","o":["12","15","18","21","28"],"a":3,"c":"−4 \u003c x − 3 \u003c 4 → −1 \u003c x \u003c 7\nTam sayılar: 0, 1, 2, 3, 4, 5, 6 → toplam 21"},{"d":"matematik","k":"Denklemler","q":"−5 ≤ 2x + 3 \u003c 11\neşitsizliğini sağlayan kaç farklı x tam sayısı vardır?","o":["7","8","9","10","11"],"a":1,"c":"3 çıkarılır: −8 ≤ 2x \u003c 8 → −4 ≤ x \u003c 4\nTam sayılar: −4, −3, …, 3 → 8 tane"},{"d":"matematik","k":"Denklemler","q":"a + 2b = 16\n3a − b = 13\nolduğuna göre, a + b toplamı kaçtır?","o":["11","12","13","14","15"],"a":0,"c":"İkinci denklemden b = 3a − 13.\na + 2(3a − 13) = 16 → 7a = 42 → a = 6, b = 5\na + b = 11"},{"d":"matematik","k":"Kümeler","q":"A ve B kümeleri için\ns(A) = 12, s(B) = 9, s(A ∩ B) = 4\nolduğuna göre, A ∪ B kümesinde olup A ∩ B kümesinde olmayan eleman sayısı kaçtır?","o":["11","13","15","17","21"],"a":1,"c":"s(A ∪ B) = 12 + 9 − 4 = 17\nİstenen: 17 − 4 = 13"},{"d":"matematik","k":"Kümeler","q":"50 kişilik bir grupta çay içenlerin sayısı 28, kahve içenlerin sayısı 20'dir. Hem çay hem kahve içenlerin sayısı x, ikisini de içmeyenlerin sayısı 2x'tir.\nBuna göre, yalnız çay içen kaç kişi vardır?","o":["20","22","24","26","28"],"a":3,"c":"28 + 20 − x + 2x = 50 → x = 2\nYalnız çay: 28 − 2 = 26"},{"d":"matematik","k":"Fonksiyonlar","q":"f(x) = 2x − 3 ve g(x) = x² + 1 fonksiyonları veriliyor.\nBuna göre, f(g(2)) + g(f(3)) toplamı kaçtır?","o":["9","11","13","15","17"],"a":4,"c":"g(2) = 5 → f(5) = 7\nf(3) = 3 → g(3) = 10\n7 + 10 = 17"},{"d":"matematik","k":"Fonksiyonlar","q":"f(x) = (3x + 1) / (x − 2) fonksiyonu veriliyor.\nf(a) = 4 olduğuna göre, a kaçtır?","o":["7","8","9","10","13"],"a":2,"c":"(3a + 1) / (a − 2) = 4 → 3a + 1 = 4a − 8 → a = 9"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Gerçel sayılar kümesi üzerinde ⊕ işlemi\na ⊕ b = 2a + 3b − a · b\nbiçiminde tanımlanıyor.\n4 ⊕ x = 2 olduğuna göre, x kaçtır?","o":["4","6","8","10","12"],"a":1,"c":"4 ⊕ x = 8 + 3x − 4x = 8 − x\n8 − x = 2 → x = 6"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Bugün günlerden çarşambadır.\nBuna göre, bugünden 250 gün sonra hangi gündür?","o":["Pazartesi","Salı","Perşembe","Cuma","Pazar"],"a":0,"c":"250 = 7 · 35 + 5 → 250 ≡ 5 (mod 7)\nÇarşamba + 5 gün = Pazartesi"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"7⁴⁵ sayısının birler basamağındaki rakam kaçtır?","o":["2","3","7","8","9"],"a":2,"c":"7'nin kuvvetlerinin birler basamağı 7, 9, 3, 1 diye 4'lü döngüyle tekrar eder.\n45 = 4 · 11 + 1 → döngünün 1. elemanı: 7"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Bir n pozitif tam sayısı için [n], n'den küçük ve n ile aralarında asal olan pozitif tam sayıların sayısını göstermektedir.\nÖrneğin [6] = 2'dir (1 ve 5).\nBuna göre, [12] + [15] toplamı kaçtır?","o":["6","8","9","10","12"],"a":4,"c":"12 ile aralarında asal: 1, 5, 7, 11 → [12] = 4\n15 ile aralarında asal: 1, 2, 4, 7, 8, 11, 13, 14 → [15] = 8\n4 + 8 = 12"},{"d":"matematik","k":"Permütasyon-kombinasyon","q":"Biri tarih, biri coğrafya, biri edebiyat ve ikisi matematik olmak üzere birbirinden farklı 5 kitap bir rafa yan yana dizilecektir.\nMatematik kitapları yan yana olmak koşuluyla kaç farklı dizilim yapılabilir?","o":["12","24","36","40","48"],"a":4,"c":"İki matematik kitabı tek blok sayılır: 4 nesne → 4! = 24\nBlok kendi içinde 2! = 2 biçimde sıralanır → 24 · 2 = 48"},{"d":"matematik","k":"Permütasyon-kombinasyon","q":"Düzlemde 7 nokta vardır. Bu noktalardan yalnızca 4 tanesi aynı doğru üzerindedir; başka hiçbir üçü doğrusal değildir.\nKöşeleri bu noktalar olan kaç farklı üçgen çizilebilir?","o":["25","28","31","34","35"],"a":2,"c":"C(7, 3) = 35 üçlü seçimden doğrusal olanlar çıkarılır: C(4, 3) = 4\n35 − 4 = 31"},{"d":"matematik","k":"Olasılık","q":"1'den 40'a kadar numaralandırılmış 40 karttan rastgele biri çekiliyor.\nÇekilen kartın numarasının 3 ile veya 5 ile tam bölünebilen bir sayı olma olasılığı kaçtır?","o":["19/40","1/2","21/40","11/20","3/5"],"a":0,"c":"3'ün katları: 13; 5'in katları: 8; 15'in katları: 2\n13 + 8 − 2 = 19 → olasılık 19/40"},{"d":"matematik","k":"Sayısal mantık","q":"3, 4, 8, 17, 33, …\nsayı dizisinde ardışık terimler arasındaki farklar belirli bir kurala göre artmaktadır.\nBuna göre, dizinin altıncı terimi kaçtır?","o":["49","52","55","58","61"],"a":3,"c":"Farklar: 1, 4, 9, 16 → ardışık tam kareler; sonraki fark 25.\n33 + 25 = 58"},{"d":"matematik","k":"Sayısal mantık","q":"Bir okulun dört şubesine ait bilgiler aşağıda verilmiştir:\n9-A: 30 öğrenci, başarı oranı %60\n9-B: 25 öğrenci, başarı oranı %80\n9-C: 35 öğrenci, başarı oranı %40\n9-D: 10 öğrenci, başarı oranı %80\nBuna göre, dört şubenin tamamında başarılı öğrencilerin oranı yüzde kaçtır?","o":["50","52","55","58","60"],"a":4,"c":"Başarılı: 18 + 20 + 14 + 8 = 60\nToplam öğrenci: 30 + 25 + 35 + 10 = 100\n60/100 = %60"},{"d":"matematik","k":"Temel işlemler","q":"(2/3 + 1/6) : (5/4 − 1/2)\nişleminin sonucu kaçtır?","o":["5/9","8/9","1","10/9","4/3"],"a":3,"c":"2/3 + 1/6 = 5/6; 5/4 − 1/2 = 3/4.\n(5/6) : (3/4) = (5/6)·(4/3) = 20/18 = 10/9"},{"d":"matematik","k":"Temel işlemler","q":"(0,48 : 0,12) + (1,5 · 0,4)\nişleminin sonucu kaçtır?","o":["4,6","4,8","5,2","6,4","8,6"],"a":0,"c":"0,48 : 0,12 = 48 : 12 = 4\n1,5 · 0,4 = 0,6\n4 + 0,6 = 4,6"},{"d":"matematik","k":"Temel işlemler","q":"(1 − 1/4) · (1 − 1/5) · (1 − 1/6) · … · (1 − 1/12)\nçarpımının sonucu kaçtır?","o":["1/12","1/8","1/6","1/5","1/4"],"a":4,"c":"Çarpım 3/4 · 4/5 · 5/6 · … · 11/12 biçimindedir.\nPay ve paydalar sadeleşir; geriye 3/12 = 1/4 kalır."},{"d":"matematik","k":"Temel işlemler","q":"3,6 / 0,09 − 2,5 / 0,05\nişleminin sonucu kaçtır?","o":["−14","−10","−1","1","10"],"a":1,"c":"3,6 / 0,09 = 360 / 9 = 40\n2,5 / 0,05 = 250 / 5 = 50\n40 − 50 = −10"},{"d":"matematik","k":"Temel işlemler","q":"a = 3/4, b = 5/7, c = 7/9\nolduğuna göre, a, b ve c'nin doğru sıralanışı aşağıdakilerden hangisidir?","o":["a \u003c b \u003c c","b \u003c a \u003c c","b \u003c c \u003c a","c \u003c a \u003c b","a \u003c c \u003c b"],"a":1,"c":"Kesirlerin 1'e uzaklıkları karşılaştırılır:\n1 − a = 1/4, 1 − b = 2/7, 1 − c = 2/9.\n2/9 \u003c 1/4 \u003c 2/7 olduğundan c en büyük, b en küçüktür: b \u003c a \u003c c"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"(2⁵ · 4³) / 8³\nişleminin sonucu kaçtır?","o":["2","4","8","16","32"],"a":1,"c":"4³ = 2⁶, 8³ = 2⁹.\n2⁵ · 2⁶ / 2⁹ = 2¹¹⁻⁹ = 2² = 4"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"3ˣ⁺² − 3ˣ = 72\nolduğuna göre, 3ˣ⁺¹ kaçtır?","o":["9","18","27","36","81"],"a":2,"c":"3ˣ⁺² − 3ˣ = 3ˣ(9 − 1) = 8·3ˣ = 72 → 3ˣ = 9\n3ˣ⁺¹ = 3 · 9 = 27"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"√48 + √75 − √27\nişleminin sonucu kaçtır?","o":["3√3","4√3","6√3","8√3","9√3"],"a":2,"c":"√48 = 4√3, √75 = 5√3, √27 = 3√3\n4√3 + 5√3 − 3√3 = 6√3"},{"d":"matematik","k":"Üslü-köklü sayılar","q":"(0,5)⁻² + (1/3)⁻¹ − 2⁰\nişleminin sonucu kaçtır?","o":["3","4","6","7","8"],"a":2,"c":"(0,5)⁻² = (1/2)⁻² = 4\n(1/3)⁻¹ = 3, 2⁰ = 1\n4 + 3 − 1 = 6"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"Dört basamaklı 5a2b sayısı 45 ile tam bölünebilmektedir.\nBuna göre, a'nın alabileceği değerlerin toplamı kaçtır?","o":["8","10","11","12","14"],"a":0,"c":"45 = 5 · 9: b = 0 ya da b = 5 olmalı, rakamlar toplamı 9'un katı olmalı.\nb = 0: 7 + a → a = 2\nb = 5: 12 + a → a = 6\nToplam: 2 + 6 = 8"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"Bir terminalden üç farklı hattın otobüsleri sırasıyla 12, 18 ve 30 dakikada bir kalkmaktadır.\nÜç hattın otobüsleri saat 08.00'de birlikte kalktığına göre, ilk kez saat kaçta yeniden birlikte kalkarlar?","o":["09.30","10.00","10.30","11.00","12.00"],"a":3,"c":"EKOK(12, 18, 30) = 180 dakika = 3 saat.\n08.00 + 3 saat = 11.00"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"Kenar uzunlukları 84 cm ve 126 cm olan dikdörtgen biçimindeki bir zemin, birbirine eş kare biçimindeki fayanslarla boşluk kalmayacak ve fayans kesilmeyecek şekilde döşenecektir.\nBuna göre, en az kaç fayans kullanılır?","o":["4","6","9","12","18"],"a":1,"c":"En az fayans için kare kenarı en büyük olmalı: EBOB(84, 126) = 42.\n(84/42) · (126/42) = 2 · 3 = 6"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"AB ve BA iki basamaklı doğal sayılardır.\nAB + BA = 121 ve A − B = 3\nolduğuna göre, AB sayısı kaçtır?","o":["47","56","65","74","83"],"a":3,"c":"AB + BA = 11(A + B) = 121 → A + B = 11\nA − B = 3 ile toplanırsa 2A = 14 → A = 7, B = 4\nAB = 74"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"6 ile bölündüğünde 4, 8 ile bölündüğünde 6 kalanını veren üç basamaklı en küçük doğal sayı kaçtır?","o":["106","110","118","122","142"],"a":2,"c":"Her iki durumda da kalan, bölenden 2 eksik: sayı + 2, hem 6'nın hem 8'in katıdır.\nEKOK(6, 8) = 24 → sayı = 24k − 2\nk = 5 için 118 (k = 4 için 94, iki basamaklı)"},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"a ve b doğal sayılar olmak üzere a·b + a toplamı tek sayıdır.\nBuna göre,\nI. a tek sayıdır.\nII. b tek sayıdır.\nIII. a + b tek sayıdır.\nifadelerinden hangileri kesinlikle doğrudur?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":3,"c":"a·b + a = a(b + 1) tek ise iki çarpan da tektir.\na tek, b + 1 tek → b çift.\nI doğru, II yanlış, a + b = tek + çift = tek → III doğru."},{"d":"matematik","k":"Bölünebilme ve EBOB-EKOK","q":"360 sayısının kaç tane pozitif tam böleni vardır?","o":["24","30","32","36","48"],"a":0,"c":"360 = 2³ · 3² · 5\nPozitif bölen sayısı = (3 + 1)(2 + 1)(1 + 1) = 4 · 3 · 2 = 24"},{"d":"matematik","k":"Sayı problemleri","q":"Bir salondaki öğrenciler sıralara 3'er kişi oturursa 4 öğrenci ayakta kalıyor; 4'er kişi oturursa 2 sıra tamamen boş kalıyor.\nBuna göre, salonda kaç öğrenci vardır?","o":["36","40","42","44","48"],"a":1,"c":"Sıra sayısı s olsun: 3s + 4 = 4(s − 2)\n3s + 4 = 4s − 8 → s = 12\nÖğrenci sayısı = 3 · 12 + 4 = 40"},{"d":"matematik","k":"Kesir problemleri","q":"Bir su deposunun 1/3'ü doludur. Depoya 30 litre su eklendiğinde deponun 5/6'sı dolmaktadır.\nBuna göre, deponun tamamı kaç litre su alır?","o":["45","54","60","72","90"],"a":2,"c":"5/6 − 1/3 = 5/6 − 2/6 = 1/2\nDeponun yarısı 30 litre → tamamı 60 litre"},{"d":"matematik","k":"Kesir problemleri","q":"Ali, parasının 1/4'ü ile bir kitap, kalan parasının 2/5'i ile de bir çanta almıştır.\nAli'nin geriye 270 TL'si kaldığına göre, başlangıçta kaç TL'si vardı?","o":["360","450","500","540","600"],"a":4,"c":"Kitaptan sonra 3/4 kalır; çantadan sonra bunun 3/5'i kalır.\n3/4 · 3/5 = 9/20\nParanın 9/20'si 270 TL → tamamı 270 · 20 / 9 = 600 TL"},{"d":"matematik","k":"Yaş problemleri","q":"Bir anne 34 yaşında, iki çocuğu ise 6 ve 8 yaşındadır.\nKaç yıl sonra annenin yaşı, çocuklarının yaşları toplamına eşit olur?","o":["16","18","20","22","24"],"a":2,"c":"x yıl sonra: 34 + x = (6 + x) + (8 + x)\n34 + x = 14 + 2x → x = 20"},{"d":"matematik","k":"Yaş problemleri","q":"Bir babanın yaşı, oğlunun yaşının 4 katıdır. 6 yıl sonra babanın yaşı, oğlunun yaşının 5/2 katı olacaktır.\nBuna göre, babanın bugünkü yaşı kaçtır?","o":["20","24","28","30","32"],"a":1,"c":"Oğul x, baba 4x olsun: 4x + 6 = (5/2)(x + 6)\n8x + 12 = 5x + 30 → 3x = 18 → x = 6\nBaba = 4 · 6 = 24"},{"d":"matematik","k":"Yüzde problemleri","q":"Bir ürünün fiyatı önce %20 artırılmış, ardından yeni fiyat üzerinden %25 indirim yapılmıştır.\nBuna göre, ürünün son fiyatı ilk fiyatına göre nasıl değişmiştir?","o":["%5 azalmıştır.","%10 azalmıştır.","Değişmemiştir.","%5 artmıştır.","%10 artmıştır."],"a":1,"c":"İlk fiyat 100 olsun: %20 artışla 120.\n120'nin %25'i 30 → son fiyat 90.\n100'den 90'a: %10 azalmıştır."},{"d":"matematik","k":"Yüzde problemleri","q":"Bir sınıftaki kız öğrencilerin %45'i, erkek öğrencilerin ise %20'si gözlük kullanmaktadır. Sınıfın tamamında gözlük kullananların oranı %30'dur.\nBuna göre, kız öğrenciler sınıfın yüzde kaçıdır?","o":["30","35","40","45","50"],"a":2,"c":"Kızların oranı k olsun: 0,45k + 0,20(1 − k) = 0,30\n0,25k = 0,10 → k = 0,4\nKızlar sınıfın %40'ıdır."},{"d":"matematik","k":"Kâr-zarar","q":"Bir satıcı, bir ürünü %40 kârla 2100 TL'ye satmaktadır.\nSatıcı bu ürünü %20 zararla satsaydı ürünü kaç TL'ye satmış olurdu?","o":["1050","1200","1260","1350","1500"],"a":1,"c":"Maliyet M: 1,4M = 2100 → M = 1500 TL\n%20 zararla: 1500 · 0,8 = 1200 TL"},{"d":"matematik","k":"Kâr-zarar","q":"Bir kırtasiyeci, tanesi 12 TL'den 150 kalem almıştır. Kalemlerden 30 tanesi kusurlu çıktığı için atılmış, kalanların her biri 18 TL'den satılmıştır.\nBuna göre, kırtasiyecinin bu satıştaki kârı yüzde kaçtır?","o":["10","12","15","18","20"],"a":4,"c":"Maliyet: 150 · 12 = 1800 TL\nGelir: 120 · 18 = 2160 TL\nKâr: 360 TL → 360 / 1800 = 0,20 → %20"},{"d":"matematik","k":"Karışım problemleri","q":"Tuz oranı %20 olan 30 kg tuzlu suya, tuz oranı %50 olan tuzlu sudan kaç kg eklenirse karışımın tuz oranı %30 olur?","o":["6","9","10","12","15"],"a":4,"c":"Eklenen miktar x: 0,20 · 30 + 0,50x = 0,30(30 + x)\n6 + 0,5x = 9 + 0,3x → 0,2x = 3 → x = 15"},{"d":"matematik","k":"Hız problemleri","q":"Aralarında 540 km bulunan iki şehirden, saatteki hızları 70 km ve 80 km olan iki araç aynı anda birbirine doğru hareket ediyor.\nBu araçlar hareketlerinden kaç saat sonra karşılaşırlar?","o":["2,4","2,7","3","3,2","3,6"],"a":4,"c":"Karşılıklı harekette hızlar toplanır: 70 + 80 = 150 km/sa.\nSüre = 540 / 150 = 3,6 saat"},{"d":"matematik","k":"Hız problemleri","q":"Bir sürücü A şehrinden B şehrine saatte 60 km hızla gidip, aynı yoldan saatte 90 km hızla geri dönmüştür. Gidiş ve dönüş toplam 5 saat sürmüştür.\nBuna göre, A ile B arası kaç km'dir?","o":["150","180","200","240","270"],"a":1,"c":"Yol x: x/60 + x/90 = 5\n(3x + 2x) / 180 = 5 → 5x = 900 → x = 180"},{"d":"matematik","k":"İşçi-havuz problemleri","q":"Bir işi Ali tek başına 12 günde, Veli tek başına 18 günde bitirebilmektedir. İkisi birlikte 4 gün çalıştıktan sonra Ali işi bırakıyor.\nBuna göre, Veli kalan işi kaç günde bitirir?","o":["5","6","7","8","10"],"a":3,"c":"Birlikte 1 günde: 1/12 + 1/18 = 5/36\n4 günde: 20/36 = 5/9 → kalan 4/9\nVeli: (4/9) · 18 = 8 gün"},{"d":"matematik","k":"İşçi-havuz problemleri","q":"Boş bir havuzu bir musluk tek başına 6 saatte doldurmakta, havuzun dibindeki bir gider ise dolu havuzu tek başına 9 saatte boşaltmaktadır.\nMusluk ve gider birlikte açılırsa boş havuz kaç saatte dolar?","o":["9","12","15","16","18"],"a":4,"c":"1 saatte: 1/6 − 1/9 = 3/18 − 2/18 = 1/18\nHavuz 18 saatte dolar."},{"d":"matematik","k":"Oran-orantı","q":"a/3 = b/4 = c/5 ve a + b + c = 60\nolduğuna göre, c − a kaçtır?","o":["10","12","15","20","25"],"a":0,"c":"a = 3k, b = 4k, c = 5k → 12k = 60 → k = 5\nc − a = 2k = 10"},{"d":"matematik","k":"Oran-orantı","q":"Aynı güçteki 6 makine bir işi 20 saatte bitirmektedir.\nBu işin 8 saatte bitirilebilmesi için aynı güçte kaç makine daha eklenmelidir?","o":["5","7","8","9","15"],"a":3,"c":"Makine sayısı ile süre ters orantılıdır: 6 · 20 = n · 8 → n = 15\nEklenecek makine: 15 − 6 = 9"},{"d":"matematik","k":"Denklemler","q":"(x − 1)/3 + (x + 2)/4 = 6\neşitliğini sağlayan x değeri kaçtır?","o":["6","8","9","10","12"],"a":3,"c":"Paydalar eşitlenir (12): 4(x − 1) + 3(x + 2) = 72\n7x + 2 = 72 → x = 10"},{"d":"matematik","k":"Denklemler","q":"x, y ve z gerçel sayıları için\nx + y = 9\ny + z = 13\nx + z = 12\nolduğuna göre, z kaçtır?","o":["4","5","6","7","8"],"a":4,"c":"Üç eşitlik taraf tarafa toplanır: 2(x + y + z) = 34 → x + y + z = 17\nz = 17 − (x + y) = 17 − 9 = 8"},{"d":"matematik","k":"Denklemler","q":"2x − y = 7\nx + 3y = 14\nolduğuna göre, x · y çarpımı kaçtır?","o":["15","18","20","21","24"],"a":0,"c":"Birinci denklem 3 ile çarpılıp ikinciyle toplanır: 6x − 3y + x + 3y = 21 + 14 → 7x = 35 → x = 5\ny = 2 · 5 − 7 = 3 → x · y = 15"},{"d":"matematik","k":"Denklemler","q":"x ve y gerçel sayılar olmak üzere\n−2 \u003c x \u003c 5\n1 \u003c y \u003c 4\nolduğuna göre, 2x − y ifadesinin alabileceği en büyük tam sayı değeri kaçtır?","o":["4","5","6","7","8"],"a":4,"c":"−4 \u003c 2x \u003c 10 ve −4 \u003c −y \u003c −1\nTaraf tarafa toplanır: −8 \u003c 2x − y \u003c 9\nEn büyük tam sayı değeri 8'dir."},{"d":"matematik","k":"Denklemler","q":"x, y ve z sıfırdan farklı gerçel sayılar olmak üzere\nx² · y \u003c 0\nx · y > 0\ny · z \u003c 0\nolduğuna göre; x, y ve z'nin işaretleri sırasıyla aşağıdakilerden hangisidir?","o":["−, −, +","−, +, −","+, −, −","−, −, −","+, +, −"],"a":0,"c":"x² > 0 olduğundan x²·y \u003c 0 → y \u003c 0\nx·y > 0 ve y \u003c 0 → x \u003c 0\ny·z \u003c 0 ve y \u003c 0 → z > 0\nİşaretler: −, −, +"},{"d":"matematik","k":"Kümeler","q":"40 kişilik bir sınıfta İngilizce bilen 24, Almanca bilen 18 öğrenci vardır. Bu iki dilden hiçbirini bilmeyen 6 öğrenci bulunmaktadır.\nBuna göre, yalnızca İngilizce bilen kaç öğrenci vardır?","o":["10","12","14","16","18"],"a":3,"c":"En az bir dil bilen: 40 − 6 = 34\nİkisini bilen: 24 + 18 − 34 = 8\nYalnız İngilizce: 24 − 8 = 16"},{"d":"matematik","k":"Kümeler","q":"A = {1, 2, 3, 4, 5} kümesinin alt kümelerinden kaç tanesinde 2 elemanı bulunur ancak 5 elemanı bulunmaz?","o":["4","8","16","24","32"],"a":1,"c":"2 kesin seçilir, 5 kesin dışarıda kalır.\nKalan 1, 3, 4 elemanları serbesttir: 2³ = 8"},{"d":"matematik","k":"Fonksiyonlar","q":"f(2x − 1) = 3x + 4\nolduğuna göre, f(5) kaçtır?","o":["7","9","10","11","13"],"a":4,"c":"2x − 1 = 5 → x = 3\nf(5) = 3 · 3 + 4 = 13"},{"d":"matematik","k":"Fonksiyonlar","q":"a bir gerçel sayı olmak üzere f(x) = ax + 3 fonksiyonu veriliyor.\nf(2) = 11 olduğuna göre, f(f(1)) kaçtır?","o":["25","28","31","34","35"],"a":2,"c":"f(2) = 2a + 3 = 11 → a = 4, f(x) = 4x + 3\nf(1) = 7 → f(7) = 4 · 7 + 3 = 31"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Gerçel sayılar kümesi üzerinde ∇ işlemi\na ∇ b = a · b − a + b\nbiçiminde tanımlanıyor.\nBuna göre, (3 ∇ 2) ∇ 4 işleminin sonucu kaçtır?","o":["19","20","21","23","25"],"a":0,"c":"3 ∇ 2 = 3 · 2 − 3 + 2 = 5\n5 ∇ 4 = 5 · 4 − 5 + 4 = 19"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Rakamları soldan sağa doğru kesin olarak artan doğal sayılara \"yükselen sayı\" denir.\nÖrneğin 258 bir yükselen sayıdır; 255 ve 352 yükselen sayı değildir.\nBuna göre, üç basamaklı kaç tane yükselen sayı vardır?","o":["36","56","72","80","84"],"a":4,"c":"Rakamlar kesin artan olduğundan 0 kullanılamaz (ilk basamağa gelemez, ortada da daha küçük bir rakamdan sonra gelemez).\n1–9 arasından 3 farklı rakam seçilir; artan sıralama tek türlüdür: C(9, 3) = 84"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"İki basamaklı bir AB doğal sayısı için AB − BA farkına bu sayının \"ayna farkı\" denir.\nÖrnek: 72 sayısının ayna farkı 72 − 27 = 45'tir.\nBuna göre, ayna farkı 54 olan kaç tane iki basamaklı doğal sayı vardır?","o":["4","5","6","7","8"],"a":0,"c":"AB − BA = 9(A − B) = 54 → A − B = 6\n(A, B): (6, 0), (7, 1), (8, 2), (9, 3) → 4 sayı\n(60 sayısında BA = 06 = 6 alınır.)"},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Bir doğal sayının rakamları çarpılarak yeni bir sayı elde ediliyor; bu işlem tek basamaklı bir sayı elde edilinceye kadar tekrarlanıyor. Yapılan işlem sayısına o sayının \"çarpım derinliği\" denir.\nÖrnek: 39 → 27 → 14 → 4 olduğundan 39'un çarpım derinliği 3'tür.\nBuna göre, 679 sayısının çarpım derinliği kaçtır?","o":["2","3","4","5","6"],"a":3,"c":"679 → 6·7·9 = 378\n378 → 3·7·8 = 168\n168 → 1·6·8 = 48\n48 → 4·8 = 32\n32 → 3·2 = 6\n5 işlem yapıldı."},{"d":"matematik","k":"Yeni tanımlı işlem","q":"Dört basamaklı abcd sayısı için (a + d) − (b + c) değerine bu sayının \"denge değeri\" denir.\nÖrnek: 1243 sayısının denge değeri (1 + 3) − (2 + 4) = −2'dir.\n1, 2, 3 ve 4 rakamlarının her biri birer kez kullanılarak yazılan dört basamaklı sayılardan kaç tanesinin denge değeri 0'dır?","o":["2","4","6","8","12"],"a":3,"c":"Rakamlar toplamı 10 → a + d = b + c = 5.\nToplamı 5 olan çiftler: {1, 4} ve {2, 3}.\nDış basamaklara hangi çiftin geleceği 2 yolla, her çiftin kendi içinde sıralanışı 2 · 2 yolla seçilir: 2 · 2 · 2 = 8"},{"d":"matematik","k":"Permütasyon-kombinasyon","q":"KİTAP sözcüğünün harflerinin her biri birer kez kullanılarak yazılabilecek 5 harfli anlamlı ya da anlamsız sözcüklerden kaç tanesi K harfiyle başlar ve P harfiyle bitmez?","o":["18","24","36","48","72"],"a":0,"c":"İlk harf K (1 yol).\nSon harf P olmamalı: İ, T, A'dan biri (3 yol).\nOrtadaki 3 yer kalan 3 harfle 3! = 6 yolla dolar.\n1 · 3 · 6 = 18"},{"d":"matematik","k":"Olasılık","q":"Bir torbada 4 kırmızı ve 6 mavi bilye vardır. Torbadan rastgele aynı anda iki bilye çekiliyor.\nÇekilen iki bilyenin de aynı renkte olma olasılığı kaçtır?","o":["7/15","1/2","8/15","3/5","2/3"],"a":0,"c":"Tüm durumlar: C(10, 2) = 45\nİkisi kırmızı: C(4, 2) = 6; ikisi mavi: C(6, 2) = 15\nOlasılık = 21/45 = 7/15"},{"d":"matematik","k":"Olasılık","q":"İki zar birlikte atılıyor.\nÜst yüze gelen sayıların toplamının 8 olma olasılığı kaçtır?","o":["1/9","5/36","1/6","7/36","2/9"],"a":1,"c":"Tüm durumlar: 6 · 6 = 36\nToplamı 8 olanlar: (2,6), (3,5), (4,4), (5,3), (6,2) → 5\nOlasılık = 5/36"},{"d":"matematik","k":"Permütasyon-kombinasyon","q":"Ahmet'in de aralarında bulunduğu 6 kişilik bir gruptan 3 kişilik bir komisyon oluşturulacaktır.\nAhmet'in mutlaka bulunduğu kaç farklı komisyon oluşturulabilir?","o":["10","15","20","30","60"],"a":0,"c":"Ahmet seçilir; kalan 5 kişiden 2 kişi seçilir: C(5, 2) = 10"},{"d":"matematik","k":"Sayısal mantık","q":"Bir kırtasiyenin dört aylık satış verileri aşağıda verilmiştir:\nDefter satışı (adet): Ocak 120, Şubat 150, Mart 90, Nisan 140\nKalem satışı (adet): Ocak 200, Şubat 180, Mart 150, Nisan 220\nDefterin satış fiyatı 25 TL, kalemin satış fiyatı 10 TL'dir.\nBuna göre, defter ve kalem satışından elde edilen toplam gelir en fazla hangi aydadır?","o":["Ocak","Şubat","Mart","Nisan","Şubat ve Nisan'da eşittir."],"a":3,"c":"Ocak: 3000 + 2000 = 5000\nŞubat: 3750 + 1800 = 5550\nMart: 2250 + 1500 = 3750\nNisan: 3500 + 2200 = 5700 → en fazla Nisan"},{"d":"matematik","k":"Sayısal mantık","q":"Bir kırtasiyenin dört aylık satış verileri aşağıda verilmiştir:\nDefter satışı (adet): Ocak 120, Şubat 150, Mart 90, Nisan 140\nKalem satışı (adet): Ocak 200, Şubat 180, Mart 150, Nisan 220\nDefterin satış fiyatı 25 TL, kalemin satış fiyatı 10 TL'dir.\nBuna göre, dört ayda defter satışından elde edilen gelir, defter ve kalem satışından elde edilen toplam gelirin yüzde kaçıdır?","o":["50","55","57,5","60","62,5"],"a":4,"c":"Defter: (120 + 150 + 90 + 140) · 25 = 500 · 25 = 12 500 TL\nKalem: (200 + 180 + 150 + 220) · 10 = 750 · 10 = 7500 TL\n12 500 / 20 000 = 0,625 → %62,5"},{"d":"matematik","k":"Sayısal mantık","q":"Bir firmanın üç şubesinin yıllık cirosu (milyon TL) aşağıda verilmiştir:\nA şubesi: 2025'te 40, 2026'da 50\nB şubesi: 2025'te 60, 2026'da 70\nC şubesi: 2025'te 80, 2026'da 78\nBuna göre, firmanın üç şubesinin toplam cirosu 2025'ten 2026'ya yüzde kaç artmıştır?","o":["6","8","10","12","15"],"a":2,"c":"2025 toplamı: 40 + 60 + 80 = 180\n2026 toplamı: 50 + 70 + 78 = 198\nArtış: 18 / 180 = 0,10 → %10"},{"d":"matematik","k":"Sayısal mantık","q":"2, 5, 11, 23, 47, …\nsayı dizisinde her terim belirli bir kurala göre bir önceki terimden elde edilmektedir.\nBuna göre, dizinin altıncı terimi kaçtır?","o":["93","95","96","98","99"],"a":1,"c":"Kural: bir önceki terimin 2 katının 1 fazlası (2·2 + 1 = 5, 2·5 + 1 = 11, …).\n2 · 47 + 1 = 95"},{"d":"matematik","k":"Geometri","q":"Bir dik üçgende dik kenarların uzunlukları 9 cm ve 12 cm'dir.\nBu üçgende hipotenüse ait yüksekliğin uzunluğu kaç cm'dir?","o":["7,2","7,5","8","8,4","9"],"a":0,"c":"Pisagor: hipotenüs = √(81 + 144) = √225 = 15\nAlan iki yolla yazılır: 9 · 12 = 15 · h → h = 108 / 15 = 7,2"},{"d":"matematik","k":"Geometri","q":"Bir üçgenin iç açılarının ölçüleri 3, 5 ve 7 sayılarıyla orantılıdır.\nBuna göre, bu üçgenin en büyük iç açısı kaç derecedir?","o":["72","80","84","90","96"],"a":2,"c":"3k + 5k + 7k = 180 → 15k = 180 → k = 12\nEn büyük açı: 7 · 12 = 84°"},{"d":"matematik","k":"Geometri","q":"Bir dikdörtgenin kısa kenarı, uzun kenarının 3/5'i kadardır. Bu dikdörtgenin çevresi 64 cm'dir.\nBuna göre, dikdörtgenin alanı kaç cm²'dir?","o":["180","192","210","224","240"],"a":4,"c":"Kısa kenar 3k, uzun kenar 5k: 2(3k + 5k) = 64 → k = 4\nKenarlar 12 ve 20 → alan 240 cm²"},{"d":"matematik","k":"Geometri","q":"Bir karenin kenar uzunluğu %20 artırılıyor.\nBuna göre, karenin alanı yüzde kaç artar?","o":["20","36","40","44","48"],"a":3,"c":"Kenar 10 olsun: alan 100.\nYeni kenar 12 → yeni alan 144.\nArtış: 44 → %44"},{"d":"matematik","k":"Geometri","q":"84 cm uzunluğundaki bir tel iki parçaya ayrılıyor. Parçalardan biri bükülerek bir kare, diğeri bükülerek bir eşkenar üçgen oluşturuluyor. Karenin bir kenar uzunluğu, eşkenar üçgenin bir kenar uzunluğuna eşittir.\nBuna göre, karenin alanı kaç cm²'dir?","o":["81","100","121","144","169"],"a":3,"c":"Ortak kenar a: 4a + 3a = 84 → a = 12\nKarenin alanı: 12² = 144 cm²"},{"d":"matematik","k":"Geometri","q":"Bir ABC üçgeninde D noktası BC kenarı üzerindedir. |BD| = 4 cm, |DC| = 6 cm ve ABD üçgeninin alanı 18 cm²'dir.\nBuna göre, ABC üçgeninin alanı kaç cm²'dir?","o":["36","40","45","54","60"],"a":2,"c":"ABD ve ADC üçgenlerinin A köşesinden çizilen yüksekliği ortaktır; alanlar tabanlarla orantılıdır.\nAlan(ADC) = 18 · 6/4 = 27\nAlan(ABC) = 18 + 27 = 45 cm²"},{"d":"tarih","k":"İslamiyet öncesi Türk tarihi","q":"Balamir önderliğinde Karadeniz'in kuzeyinden batıya ilerleyen, Kavimler Göçü'nü başlatan ve Attila döneminde en güçlü hâline ulaşan Türk devleti aşağıdakilerden hangisidir?","o":["Avrupa Hun Devleti","Asya Hun Devleti","Ak Hun (Eftalit) Devleti","Avar Kağanlığı","Hazar Kağanlığı"],"a":0,"c":"Balamir liderliğindeki Hunların 375'te batıya ilerlemesi Kavimler Göçü'nü başlatmış, Avrupa Hun Devleti Attila döneminde zirveye ulaşmıştır."},{"d":"tarih","k":"İslamiyet öncesi Türk tarihi","q":"Ticaret yollarına hâkim olan, yönetici kesimi Musevi (Yahudi) dinini benimseyen ve farklı inançlara hoşgörüyle yaklaşan Türk devleti aşağıdakilerden hangisidir?","o":["Avarlar","Hazarlar","Peçenekler","Tuna Bulgarları","Kırgızlar"],"a":1,"c":"Hazar hükümdarı ve yönetici kesimi Museviliği benimsemiştir; devlet farklı dinlere hoşgörüsüyle tanınır."},{"d":"tarih","k":"İslamiyet öncesi Türk tarihi","q":"Kavimler Göçü'nün sonuçlarıyla ilgili,\nI. Avrupa'da feodalite rejimi ortaya çıkmıştır.\nII. Roma İmparatorluğu Doğu ve Batı olarak ikiye ayrılmıştır.\nIII. Avrupa'nın bugünkü etnik yapısı büyük ölçüde şekillenmiştir.\nifadelerinden hangileri doğrudur?","o":["Yalnız I","Yalnız II","I ve II","I ve III","I, II ve III"],"a":4,"c":"Kavimler Göçü feodaliteyi doğurmuş, Roma'nın ikiye ayrılmasına (395) yol açmış ve Avrupa'nın etnik yapısını şekillendirmiştir."},{"d":"tarih","k":"İslamiyet öncesi Türk tarihi","q":"Aşağıdakilerden hangisi İslamiyet öncesi Türk kültürüne ait bir kavram değildir?","o":["Kurultay","Töre","İkta","Tamga","Yuğ"],"a":2,"c":"İkta, İslamiyet sonrası Türk-İslam devletlerinde (Büyük Selçuklu vb.) uygulanan toprak sistemidir; diğerleri İslamiyet öncesi Türk kültürüne aittir."},{"d":"tarih","k":"İslamiyet öncesi Türk tarihi","q":"I. Kök Türk Devleti'nin kurulması\nII. Mete Han'ın Asya Hun tahtına geçmesi\nIII. Uygur Devleti'nin kurulması\nYukarıdaki gelişmelerin kronolojik sıralaması aşağıdakilerden hangisidir?","o":["I - II - III","II - I - III","II - III - I","III - I - II","I - III - II"],"a":1,"c":"Mete Han MÖ 209'da tahta geçmiş, Kök Türk Devleti 552'de, Uygur Devleti 744'te kurulmuştur."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Hindistan'a on yedi sefer düzenleyen ve kaynaklarda \"sultan\" unvanını kullanan ilk Türk hükümdarı olarak bilinen kişi aşağıdakilerden hangisidir?","o":["Tuğrul Bey","Alp Arslan","Melikşah","Gazneli Mahmut","Satuk Buğra Han"],"a":3,"c":"Gazneli Mahmut Hindistan'a 17 sefer yapmış ve sultan unvanını kullanan ilk Türk hükümdarı olmuştur."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Bu savaşta Gaznelileri yenen Selçuklular bağımsızlıklarını kesinleştirmiş ve Büyük Selçuklu Devleti resmen kurulmuştur.\nSözü edilen savaş aşağıdakilerden hangisidir?","o":["Pasinler Savaşı","Malazgirt Meydan Muharebesi","Katvan Savaşı","Talas Savaşı","Dandanakan Savaşı"],"a":4,"c":"1040 Dandanakan Savaşı'nda Gazneliler yenilmiş, Büyük Selçuklu Devleti resmen kurulmuştur."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Büyük Selçuklu Devleti ile ilgili,\nI. Nizamülmülk döneminde Nizamiye Medreseleri açılmıştır.\nII. Tuğrul Bey, Bağdat'a girerek Abbasi halifesini Büveyhoğulları baskısından kurtarmıştır.\nIII. Ridaniye Savaşı ile Mısır'daki Memlûk Devleti'ne son vermiştir.\nifadelerinden hangileri doğrudur?","o":["Yalnız I","Yalnız III","I ve II","II ve III","I, II ve III"],"a":2,"c":"Nizamiye Medreseleri ve Tuğrul Bey'in Bağdat seferi (1055) Büyük Selçuklulara aittir; Memlûkleri Ridaniye'de yıkan Osmanlı Devleti'dir (1517)."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Türkiye Selçukluları döneminde Kayseri'de Gevher Nesibe adına yaptırılan, hastaların tedavi edildiği ve aynı zamanda tıp eğitimi verilen yapı türü aşağıdakilerden hangisidir?","o":["Darüşşifa","Kervansaray","Ribat","Kümbet","Bedesten"],"a":0,"c":"Selçuklularda hastaneye darüşşifa denir; Kayseri'deki Gevher Nesibe Darüşşifası'nda tıp eğitimi de verilmiştir."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Aşağıdakilerden hangisi I. Alaaddin Keykubat dönemine ait bir gelişme değildir?","o":["Alanya'nın alınarak burada tersane kurulması","Kösedağ Savaşı'nda Moğollara yenilinmesi","Kırım'daki Suğdak'a deniz aşırı sefer düzenlenmesi","Yassıçemen Savaşı'nda Harezmşahların yenilmesi","Kubadabad Sarayı'nın yaptırılması"],"a":1,"c":"Kösedağ Savaşı (1243) II. Gıyaseddin Keyhüsrev döneminde yapılmıştır; diğerleri I. Alaaddin Keykubat dönemine aittir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Divan-ı Hümayun'da askerî sınıfa mensup kişilerin davalarına bakan, kadı ve müderrislerin atanmasında söz sahibi olan görevli aşağıdakilerden hangisidir?","o":["Defterdar","Nişancı","Kazasker","Reisülküttap","Kaptan-ı derya"],"a":2,"c":"Kazasker, divanda askerî sınıfın davalarına bakar; kadı ve müderris atamalarında yetkilidir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Osmanlı dirlik sisteminde yıllık geliri 100.000 akçeden fazla olan ve padişaha, hanedan üyelerine, vezirlere ayrılan topraklara ne ad verilir?","o":["Zeamet","Tımar","Vakıf","Has","Mülk"],"a":3,"c":"Geliri 100.000 akçenin üzerindeki dirliklere has denir; zeamet 20.000-100.000, tımar 3.000-20.000 akçe arasındadır."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Osmanlı Devleti'nde bazı vergi kaynaklarının toplanma hakkının açık artırma yoluyla, peşin para karşılığında belirli bir süre için kişilere devredilmesi sistemi aşağıdakilerden hangisidir?","o":["Esham","Gedik","Avarız","Müsadere","İltizam"],"a":4,"c":"Vergi gelirlerinin peşin para karşılığında belirli süreliğine devredilmesine iltizam denir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Osmanlı Devleti'nde halkın ve üreticinin korunması amacıyla malların satış fiyatlarının devlet tarafından belirlenmesine ne ad verilir?","o":["Narh","Cizye","Öşür","Haraç","Çift bozan"],"a":0,"c":"Devletin mallara koyduğu resmî fiyata narh denir; diğerleri vergi türleridir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Devşirme yoluyla toplanan çocuklar arasından seçilen yetenekli gençlerin saray hizmetine ve devlet yönetimine hazırlandığı Osmanlı eğitim kurumu aşağıdakilerden hangisidir?","o":["Sıbyan mektebi","Enderun","Acemi Oğlanlar Ocağı","Sahn-ı Seman Medresesi","Mühendishane"],"a":1,"c":"Enderun, devşirmelerin en yeteneklilerini devlet yöneticisi olarak yetiştiren saray okuludur."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"I. Yeniçeriler\nII. Akıncılar\nIII. Kapıkulu süvarileri\nYukarıdakilerden hangileri Osmanlı Kapıkulu ordusunda yer alır?","o":["Yalnız I","Yalnız II","I ve II","I ve III","I, II ve III"],"a":3,"c":"Yeniçeriler ve Kapıkulu süvarileri merkez (Kapıkulu) ordusuna aittir; akıncılar eyalet askerleri arasında yer alır."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"I. Niğbolu Savaşı\nII. Varna Savaşı\nIII. I. Kosova Savaşı\nYukarıdaki savaşların kronolojik sıralaması aşağıdakilerden hangisidir?","o":["I - II - III","I - III - II","II - III - I","III - I - II","III - II - I"],"a":3,"c":"I. Kosova 1389, Niğbolu 1396, Varna 1444 yılında yapılmıştır."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Aşağıdakilerden hangisi Fatih Sultan Mehmet dönemine ait bir gelişme değildir?","o":["Otlukbeli Savaşı'nda Akkoyunluların yenilmesi","Sahn-ı Seman Medreselerinin kurulması","Rodos Adası'nın alınması","Kanunname-i Âl-i Osman'ın hazırlanması","Belgrad'ın kuşatılması"],"a":2,"c":"Rodos 1522'de Kanuni Sultan Süleyman döneminde alınmıştır; diğerleri Fatih dönemine aittir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Osmanlı Devleti'nin ilk kez büyük çaplı toprak kaybına uğradığı, Macaristan'ın büyük bölümünü yitirdiği ve II. Viyana Kuşatması sonrasındaki savaşlara son veren antlaşma aşağıdakilerden hangisidir?","o":["Zitvatorok Antlaşması","Pasarofça Antlaşması","Küçük Kaynarca Antlaşması","Karlofça Antlaşması","Belgrad Antlaşması"],"a":3,"c":"1699 Karlofça Antlaşması ile Osmanlı ilk kez büyük toprak kaybı yaşamış, Macaristan'ın büyük bölümü Avusturya'ya geçmiştir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Bu antlaşmayla Kırım'a bağımsızlık verilmiş, Rusya Osmanlı'daki Ortodoksların haklarını koruma bahanesiyle iç işlere karışma imkânı elde etmiş ve Osmanlı ilk kez savaş tazminatı ödemeyi kabul etmiştir.\nSözü edilen antlaşma aşağıdakilerden hangisidir?","o":["Yaş Antlaşması","Bükreş Antlaşması","Edirne Antlaşması","Ziştovi Antlaşması","Küçük Kaynarca Antlaşması"],"a":4,"c":"1774 Küçük Kaynarca Antlaşması ile Kırım bağımsız olmuş, Rusya Ortodokslar üzerinde koruyuculuk iddiası kazanmış ve ilk kez savaş tazminatı ödenmiştir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Aşağıdakilerden hangisi Tanzimat Fermanı ile getirilen düzenlemelerden biri değildir?","o":["Meclis-i Mebusan'ın açılması","Herkesin kanun önünde eşit sayılması","Can, mal ve namus güvenliğinin sağlanması","Kimsenin yargılanmadan cezalandırılmaması","Vergilerin herkesin gelirine göre alınması"],"a":0,"c":"Meclis-i Mebusan 1877'de I. Meşrutiyet döneminde açılmıştır; diğerleri 1839 Tanzimat Fermanı'nın hükümleridir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"II. Meşrutiyet'in ilanından kısa süre sonra İstanbul'da çıkan, Selanik'ten gelen Hareket Ordusu tarafından bastırılan ve ardından II. Abdülhamit'in tahttan indirilmesiyle sonuçlanan olay aşağıdakilerden hangisidir?","o":["Kabakçı Mustafa İsyanı","31 Mart Olayı","Patrona Halil İsyanı","Babıali Baskını","Edirne Vakası"],"a":1,"c":"1909'daki 31 Mart Olayı'nı Hareket Ordusu bastırmış, II. Abdülhamit tahttan indirilmiştir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"II. Balkan Savaşı sonunda Bulgaristan ile imzalanan ve Edirne'nin Osmanlı Devleti'nde kalmasını sağlayan antlaşma aşağıdakilerden hangisidir?","o":["Londra Antlaşması","Bükreş Antlaşması","İstanbul Antlaşması","Atina Antlaşması","Uşi Antlaşması"],"a":2,"c":"1913 İstanbul Antlaşması ile Bulgaristan, II. Balkan Savaşı'nda geri alınan Edirne'nin Osmanlı'da kalmasını kabul etmiştir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Bu cephede kazanılan başarı sonucunda Rusya'ya yardım ulaştırılamamış, bu durum Rusya'da Bolşevik İhtilali'nin çıkmasını kolaylaştırmış ve I. Dünya Savaşı'nın uzamasına yol açmıştır.\nSözü edilen cephe aşağıdakilerden hangisidir?","o":["Kafkas Cephesi","Kanal Cephesi","Irak Cephesi","Çanakkale Cephesi","Galiçya Cephesi"],"a":3,"c":"Çanakkale'de İtilaf Devletlerinin geçişinin engellenmesi Rusya'ya yardımı önlemiş, Bolşevik İhtilali'ne zemin hazırlamış ve savaşı uzatmıştır."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Aşağıdakilerden hangisi II. Mahmut döneminde yapılan yeniliklerden biri değildir?","o":["İlk resmî gazete Takvim-i Vekayi'nin çıkarılması","İlk nüfus sayımının yapılması","Mekteb-i Harbiye'nin açılması","Asakir-i Mansure-i Muhammediye ordusunun kurulması","Mühendishane-i Bahrî-i Hümayun'un açılması"],"a":4,"c":"Mühendishane-i Bahrî-i Hümayun 1773'te III. Mustafa döneminde açılmıştır; diğerleri II. Mahmut dönemine aittir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Devleti kurtarmak için Batı'nın yalnızca bilim ve teknolojisinin değil, yaşam biçimi ve kurumlarının da benimsenmesi gerektiğini savunan fikir akımı aşağıdakilerden hangisidir?","o":["Batıcılık","Osmanlıcılık","İslamcılık","Türkçülük","Adem-i merkeziyetçilik"],"a":0,"c":"Batıcılık, Avrupa'nın bilim ve teknolojisiyle birlikte kültür ve kurumlarının da alınmasını savunur."},{"d":"tarih","k":"Millî Mücadele","q":"Toplanış biçimi bakımından bölgesel, aldığı kararlar bakımından ulusal nitelik taşıyan ve \"Manda ve himaye kabul olunamaz.\" kararının ilk kez alındığı toplantı aşağıdakilerden hangisidir?","o":["Sivas Kongresi","Erzurum Kongresi","Balıkesir Kongre ce Yunan kuvvetlerine sığınmıştır."},{"d":"tarih","k":"Millî Mücadele","q":"I. Sakarya Meydan Muharebesi\nII. I. İnönü Muharebesi\nIII. Kütahya-Eskişehir Muharebeleri\nYukarıdaki savaşların kronolojik sıralaması aşağıdakilerden hangisidir?","o":["I - II - III","I - III - II","II - I - III","II - III - I","III - II - I"],"a":3,"c":"I. İnönü Ocak 1921, Kütahya-Eskişehir Temmuz 1921, Sakarya Ağustos-Eylül 1921'de yapılmıştır."},{"d":"tarih","k":"Millî Mücadele","q":"Bu yenilginin ardından ordu Sakarya'nın doğusuna çekilmiş, Mustafa Kemal'e Başkomutanlık Kanunu ile üç ay süreyle meclisin yetkileri verilmiş ve Tekalif-i Millîye Emirleri yayımlanmıştır.\nSözü edilen yenilgi aşağıdakilerden hangisidir?","o":["Kütahya-Eskişehir Muharebeleri","I. İnönü Muharebesi","II. İnönü Muharebesi","Sakarya Meydan Muharebesi","Büyük Taarruz"],"a":0,"c":"Kütahya-Eskişehir yenilgisi sonrası ordu Sakarya'nın doğusuna çekilmiş, Başkomutanlık Kanunu çıkarılmış ve Tekalif-i Millîye Emirleri yayımlanmıştır."},{"d":"tarih","k":"Millî Mücadele","q":"TBMM'yi tanıyan ilk İtilaf devletiyle imzalanan, Güney Cephesi'ndeki savaşı sona erdiren ve Hatay dışındaki güney sınırını büyük ölçüde belirleyen antlaşma aşağıdakilerden hangisidir?","o":["Kars Antlaşması","Ankara Antlaşması","Moskova Antlaşması","Gümrü Antlaşması","Mudanya Ateşkes Antlaşması"],"a":1,"c":"1921 Ankara Antlaşması ile Fransa TBMM'yi tanıyan ilk İtilaf devleti olmuş, Güney Cephesi kapanmıştır."},{"d":"tarih","k":"Millî Mücadele","q":"Doğu Cephesi ile ilgili aşağıdakilerden hangisi yanlıştır?","o":["Ermenilere karşı mücadele edilmiştir.","Cephe komutanı Kâzım Karabekir'dir.","Savaş, Mudanya Ateşkes Antlaşması ile sona ermiştir.","TBMM düzenli ordusunun ilk askerî başarısı bu cephede kazanılmıştır.","Kazanılan zaferle doğu sınırı büyük ölçüde güvence altına alınmıştır."],"a":2,"c":"Doğu Cephesi Ermenilerle 1920'de imzalanan Gümrü Antlaşması ile kapanmıştır; Mudanya Ateşkesi Batı Cephesi'ndeki savaşı sona erdirmiştir."},{"d":"tarih","k":" an laiklik ilkesi hangi yıl anayasaya girmiştir?","o":["1924","1928","1931","1934","1937"],"a":4,"c":"Laiklik, diğer Atatürk ilkeleriyle birlikte 1937'de anayasaya girmiştir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Şeyh Sait İsyanı üzerine 1925'te çıkarılan ve hükûmete olağanüstü yetkiler tanıyan kanun aşağıdakilerden hangisidir?","o":["Hıyanet-i Vataniye Kanunu","Takrir-i Sükûn Kanunu","Teşkilat-ı Esasiye Kanunu","Tevhid-i Tedrisat Kanunu","Teşvik-i Sanayi Kanunu"],"a":1,"c":"Takrir-i Sükûn Kanunu Şeyh Sait İsyanı üzerine 1925'te çıkarılmış, hükûmete geniş yetkiler vermiştir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Cumhuriyet döneminin ilk muhalefet partisi olan, Kâzım Karabekir başkanlığında 1924'te kurulan ve Şeyh Sait İsyanı'nın ardından kapatılan parti aşağıdakilerden hangisidir?","o":["Serbest Cumhuriyet Fırkası","Ahali Cumhuriyet Fırkası","Halk Fırkası","Terakkiperver Cumhuriyet Fırkası","Millî Kalkınma Partisi"],"a":3,"c":"Terakkiperver Cumhuriyet Fırkası 1924'te kurulmuş, 1925'te Şeyh Sait İsyanı'nın ardından kapatılmıştır."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Cumhuriyet'in ilanından önce, 1923'te toplanan ve Misak-ı İktisadi'nin kabul edilerek millî ekonominin esaslarının belirlendiği toplantı aşağıdakilerden hangisidir?","o":["Sivas Kongresi","Balıkesir Kongresi","Lozan Konferansı","Londra Konferansı","İzmir İktisat Kongresi"],"a":4,"c":"Şubat 1923'te toplanan İzmir İktisat Kongresi'nde Misak-ı İktisadi kabul edilmiştir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Toplumda hiçbir kişiye, aileye, sınıfa veya zümreye ayrıcalık tanınmamasını ve kanun önünde eşitliği esas alan Atatürk ilkesi aşağıdakilerden hangisidir?","o":["Halkçılık","Cumhuriyetçilik","Devletçilik","Milliyetçilik","İnkılapçılık"],"a":0,"c":"Halkçılık, sınıf ve zümre ayrıcalığını reddeder, herkesin kanun önünde eşit olmasını esas alır."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"1926'da çıkarılan ve Türk karasularında yük ile endiği Miryokefalon Savaşı ile Bizans'ın Anadolu'yu geri alma ümidi sona ermiştir."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Bu savaştan sonra Türkiye Selçuklu Devleti İlhanlıların denetimine girmiş, Anadolu'da siyasi birlik bozularak beylikler dönemi başlamıştır.\nSözü edilen savaş aşağıdakilerden hangisidir?","o":["Miryokefalon Savaşı","Kösedağ Savaşı","Yassıçemen Savaşı","Malazgirt Savaşı","Katvan Savaşı"],"a":1,"c":"1243 Kösedağ Savaşı'nda Moğollara yenilen Türkiye Selçukluları İlhanlı denetimine girmiş, Anadolu'da siyasi birlik dağılmıştır."},{"d":"tarih","k":"İlk Türk-İslam devletleri ve Türkiye Selçukluları","q":"Aşağıdakilerden hangisi Türkiye Selçuklularının ticareti geliştirmek amacıyla yaptığı uygulamalardan biri değildir?","o":["Ticaret yolları üzerinde kervansaraylar inşa etmek","Devşirme sistemiyle ticaret erbabı yetiştirmek","Zarara uğrayan tüccarların kaybını devlet hazinesinden karşılamak","Antalya, Sinop ve Alanya gibi liman kentlerini almak","Ticaret yollarının güvenliğini sağlamak"],"a":1,"c":"Kervansaraylar, devlet sigortası, liman fetihleri ve yol güvenliği Selçuklu ticaret politikasının parçasıdır. Devşirme bir Osmanlı uygulamasıdır ve ticaretle ilgili değildir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Aşağıdakilerden hangisi Orhan Bey dönemine ait bir gelişme değildir?","o":["İlk Osmanlı parasının (akçe) bastırılması","İznik'te ilk Osmanlı medresesinin açılması","Yaya ve müsellem adıyla ilk düzenli ordunun kurulması","Çimpe Kalesi'nin alınarak Rumeli'ye geçilmesi","Sırpsındığı Savaşı'nda Haçlı ordusunun yenilmesi"],"a":4,"c":"Sırpsındığı Savaşı (1364) I. Murat dönemindedir. Diğerleri Orhan Bey dönemine aittir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Divan-ı Hümayun'da padişahın tuğrasını belgelere çeken, tımar ve zeamet kayıtlarını tutan görevli aşağıdakilerden hangisidir?","o":["Kazasker","Nişancı","Defterdar","Reisülküttap","Kaptan-ı derya"],"a":1,"c":"Nişancı tuğra çeker, fermanları yazar ve tımar-zeamet kayıtlarını tutardı. Defterdar mali işlerden, kazasker hukuk ve eğitimden sorumluydu."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Aşağıdakilerden hangisi İstanbul'un fethinin (1453) sonuçlarından biri değildir?","o":["Halifeliğin Osmanlı Devleti'ne geçmesi","Bizans İmparatorluğu'nun yıkılması","Orta Çağ'ın kapanıp Yeni Çağ'ın başlaması","Osmanlı topraklarının Anadolu ile Rumeli arasında bütünlük kazanması","Fatih Sultan Mehmet'in Kayser-i Rum unvanını kullanması"],"a":0,"c":"Halifelik 1517'de Mısır Seferi (Ridaniye) sonrasında Osmanlı'ya geçmiştir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Bu savaşla Memlûk Devleti yıkılmış, halifelik Osmanlı Devleti'ne geçmiş ve kutsal emanetler İstanbul'a getirilmiştir.\nSözü edilen savaş aşağıdakilerden hangisidir?","o":["Çaldıran Savaşı","Turnadağ Savaşı","Mercidabık Savaşı","Ridaniye Savaşı","Otlukbeli Savaşı"],"a":3,"c":"Yavuz Sultan Selim, 1517 Ridaniye Savaşı ile Memlûkleri yıkmış ve halifeliği Osmanlı'ya geçirmiştir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"I. Mohaç Meydan Muharebesi\nII. Preveze Deniz Savaşı\nIII. Otlukbeli Savaşı\nYukarıdakilerden hangileri Kanuni Sultan Süleyman döneminde gerçekleşmiştir?","o":["Yalnız I","Yalnız III","I ve II","II ve III","I, II ve III"],"a":2,"c":"Mohaç (1526) ve Preveze (1538) Kanuni dönemindedir; Otlukbeli (1473) Fatih Sultan Mehmet dönemindedir."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":"Aşağıdakilerden hangisi Osmanlı tımar sisteminin sağladığı yararlardan biri değildir?","o":["Hazineye yük olmadan büyük bir atlı ordu beslenmesi","Yeniçeri Ocağı'na asker temin edilmesi","Toprağın boş bırakılmayarak üretimin sürekliliğinin sağlanması","Taşrada güvenlik ve asayişin korunması","Merkezî otoritenin taşrada etkili olması"],"a":1,"c":"Yeniçeri Ocağı'na asker devşirme sistemiyle sağlanırdı. Tımar sistemi tımarlı sipahi yetiştirir, üretimi ve taşra düzenini korurdu."},{"d":"tarih","k":"Osmanlı kuruluş ve yükselme","q":" ","Sened-i İttifak","Kanun-i Esasi","Muharrem Kararnamesi"],"a":2,"c":"II. Mahmut döneminde imzalanan Sened-i İttifak ile padişah ayanların varlığını tanımış ve kendi yetkilerini ilk kez sınırlamıştır."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Kırım Savaşı'nın ardından Avrupa devletlerinin azınlıklar bahanesiyle iç işlere karışmasını önlemek amacıyla ilan edilen ve gayrimüslimlere geniş haklar tanıyan belge aşağıdakilerden hangisidir?","o":["Tanzimat Fermanı","Sened-i İttifak","Kanun-i Esasi","Muharrem Kararnamesi","Islahat Fermanı"],"a":4,"c":"1856'da ilan edilen Islahat Fermanı, Paris Barış Konferansı öncesinde gayrimüslimlere geniş haklar tanımıştır."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"I. Meşrutiyet ile ilgili,\nI. Osmanlı Devleti'nin ilk anayasası olan Kanun-i Esasi ilan edilmiştir.\nII. Meclis-i Mebusan üyeleri seçimle belirlenmiştir.\nIII. Padişahın meclisi kapatma yetkisi kaldırılmıştır.\nifadelerinden hangileri doğrudur?","o":["Yalnız I","Yalnız III","I ve II","I ve III","I, II ve III"],"a":2,"c":"1876'da Kanun-i Esasi ilan edilmiş, Meclis-i Mebusan seçimle oluşmuştur; ancak padişah meclisi kapatma yetkisini korumuş ve 1878'de meclisi kapatmıştır."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Din, dil ve ırk farkı gözetmeksizin bütün Osmanlı tebaasını devlete bağlamayı amaçlayan, ancak Balkan Savaşları ile etkisini büyük ölçüde yitiren fikir akımı aşağıdakilerden hangisidir?","o":["İslamcılık","Osmanlıcılık","Türkçülük","Batıcılık","Adem-i merkeziyetçilik"],"a":1,"c":"Osmanlıcılık, tüm unsurları \"Osmanlı\" kimliğinde birleştirmeyi amaçlamış; Balkan Savaşları'nda gayrimüslim unsurların ayrılmasıyla etkisini yitirmiştir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"Bu savaşın sonunda imzalanan Uşi Antlaşması ile Osmanlı Devleti'nin Kuzey Afrika'daki son toprakları elden çıkmıştır.\nSözü edilen savaş aşağıdakilerden hangisidir?","o":["Trablusgarp Savaşı","I. Balkan Savaşı","Kırım Savaşı","93 Harbi","Çanakkale Savaşı"],"a":0,"c":"1911-1912 Trablusgarp Savaşı, İtalya ile imzalanan Uşi Antlaşması ile sona ermiş; Trablusgarp ve Bingazi kaybedilmiştir."},{"d":"tarih","k":"Osmanlı duraklama, gerileme ve dağılma","q":"I. Kafkas Cephesi\nII. Kanal Cephesi\nIII. Çanakkale Cephesi\nI. Dünya Savaşı'nda Osmanlı Devleti'nin taarruz (saldırı) amacıyla açtığı cepheler yukarıdakilerden hangileridir?","o":["Yalnız I","I ve II","I ve III","II ve III","I, II ve III"],"a":1,"c":"Kafkas ve Kanal cepheleri Osmanlı'nın saldırı amaçlı açtığı cephelerdir; Çanakkale bir savunma cephesidir."},{"d":"tarih","k":"Millî Mücadele","q":"Aşağıdakilerden hangisi Mondros Ateşkes Antlaşması'nın hükümlerinden biri değildir?","o":["Doğu Anadolu'da bir Ermeni devleti kurulacaktır.","Boğazlar İtilaf Devletlerinin gemilerine açılacaktır.","Osmanlı ordusu terhis edilecektir.","İtilaf Devletleri güvenliklerini tehdit eden bir durumda herhangi bir stratejik noktayı işgal edebilecektir.","Toros tünelleri İtilaf Devletlerince işgal edilecektir."],"a":0,"c":"Doğu Anadolu'da Ermeni devleti kurulması Sevr Antlaşması'nın hükmüdür. Diğerleri Mondros (30 Ekim 1918) hükümleridir."},{"d":"tarih","k":"Millî Mücadele","q":"\"Milletin istiklalini yine milletin azim ve kararı kurtaracaktır.\"\nBu ifadenin yer aldığı ve Kurtuluş Savaşı'nın gerekçesini, amacını ve yöntemini ilk kez ortaya koyan belge aşağıdakilerden hangisidir?","o":["Havza Genelgesi","Amasya Genelgesi","Erzurum Kongresi Beyannamesi","Sivas Kongresi Beyannamesi","Amasya Protokolü"],"a":1,"c":"22 Haziran 1919'da yayımlanan Amasya Genelgesi, Kurtuluş Savaşı'nın gerekçe, amaç ve yöntemini belirleyen ilk belgedir."},{"d":"tarih","k":"Millî Mücadele","q":"Sivas Kongresi ile ilgili aşağıdakilerden hangisi söylenemez?","o":["Manda ve himaye kesin olarak reddedilmiştir.","Bütün cemiyetler Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti adı altında birleştirilmiştir.","Heyet-i Temsiliye'nin bütün yurdu temsil ettiği kabul edilmiştir.","Mustafa Kemal'e başkomutanlık yetkisi verilmiştir.","Erzurum Kongresi kararları bütün yurdu kapsayacak şekilde kabul edilmiştir."],"a":3,"c":"Başkomutanlık yetkisi Mustafa Kemal'e 5 Ağustos 1921'de TBMM tarafından verilmiştir. Diğerleri Sivas Kongresi'nin (Eylül 1919) sonuçlarıdır."},{"d":"tarih","k":"Millî Mücadele","q":"\"Mondros Ateşkesi'nin imzalandığı sırada Türk ordusunun elinde bulunan, Türklerin çoğunlukta olduğu topraklar bölünemez bir bütündür.\"\nBu kararı da içeren Misakımillî'yi kabul eden kurum aşağıdakilerden hangisidir?","o":["Türkiye Büyük Millet Meclisi","Heyet-i Temsiliye","Meclis-i Âyan","Sivas Kongresi","Son Osmanlı Mebusan Meclisi"],"a":4,"c":"Misakımillî, 28 Ocak 1920'de Son Osmanlı Mebusan Meclisi'nde kabul edilmiştir."},{"d":"tarih","k":"Millî Mücadele","q":"Aşağıdakilerden hangisi TBMM'nin iç ayaklanmalara karşı aldığı önlemlerden biri değildir?","o":["Hıyanet-i Vataniye Kanunu'nun çıkarılması","İstiklal Mahkemelerinin kurulması","Ankara Müftüsü'nün başkanlığında karşı fetva yayımlanması","Ayaklanmaları bastırmak için düzenli birlikler ve Kuva-yı Milliye kuvvetlerinin görevlendirilmesi","Kuva-yı İnzibatiye'nin kurulması"],"a":4,"c":"Kuva-yı İnzibatiye (Hilafet Ordusu), Millî Mücadele'ye karşı İstanbul Hükûmeti tarafından kurulmuştur."},{"d":"tarih","k":"Millî Mücadele","q":"TBMM Hükûmeti'nin uluslararası alanda imzaladığı ilk antlaşma ve ilk siyasi başarısı aşağıdakilerden hangisidir?","o":["Moskova Antlaşması","Kars Antlaşması","Gümrü Antlaşması","Ankara Antlaşması","Mudanya Ateşkes Antlaşması"],"a":2,"c":"Doğu Cephesi'nde Kâzım Karabekir'in Ermenilere karşı kazandığı başarı üzerine 3 Aralık 1920'de imzalanan Gümrü Antlaşması, TBMM'nin ilk uluslararası antlaşmasıdır."},{"d":"tarih","k":"Millî Mücadele","q":"Maraş'a \"Kahramanmaraş\", Urfa'ya \"Şanlıurfa\", Antep'e \"Gaziantep\" adlarının verilmesi hangi cephedeki mücadelelerle ilgilidir?","o":["Doğu Cephesi","Güney Cephesi","Batı Cephesi","Kanal Cephesi","Çanakkale Cephesi"],"a":1,"c":"Bu şehirler Millî Mücadele'de Güney Cephesi'nde Fransız ve Ermeni kuvvetlerine karşı halkın direnişiyle öne çıkmıştır."},{"d":"tarih","k":"Millî Mücadele","q":"I. İtilaf Devletlerinin Londra Konferansı'nı toplaması\nII. Teşkilat-ı Esasiye Kanunu'nun kabul edilmesi\nIII. Mustafa Kemal'e Gazi unvanı verilmesi\nYukarıdakilerden hangileri I. İnönü Muharebesi'nin sonuçları arasında gösterilebilir?","o":["Yalnız I","Yalnız II","Yalnız III","I ve II","II ve III"],"a":3,"c":"I. İnönü (Ocak 1921) sonrasında Teşkilat-ı Esasiye kabul edilmiş, Londra Konferansı toplanmıştır. Gazi unvanı Sakarya Meydan Muharebesi'nden sonra verilmiştir."},{"d":"tarih","k":"Millî Mücadele","q":"\"Hattı müdafaa yoktur, sathı müdafaa vardır. O satıh bütün vatandır.\"\nMustafa Kemal'in bu emri verdiği ve sonunda kendisine Mareşal rütbesi ile Gazi unvanının verildiği muharebe aşağıdakilerden hangisidir?","o":["II. İnönü Muharebesi","Kütahya-Eskişehir Muharebeleri","Büyük Taarruz","Sakarya Meydan Muharebesi","I. İnönü Muharebesi"],"a":3,"c":"Sakarya Meydan Muharebesi (Ağustos-Eylül 1921) sonunda TBMM, Mustafa Kemal'e Mareşal rütbesi ve Gazi unvanını vermiştir."},{"d":"tarih","k":"Millî Mücadele","q":"Aşağıdakilerden hangisi Mudanya Ateşkes Antlaşması'nın hükümlerinden biridir?","o":["Doğu Trakya'nın kısa süre içinde boşaltılarak Türk yönetimine bırakılması","Musul'un İngiltere'ye bırakılması","Boğazlar Komisyonu'nun kurulması","Kapitülasyonların kaldırılması","Hatay için özel bir yönetim kurulması"],"a":0,"c":"11 Ekim 1922 Mudanya Ateşkesi ile Doğu Trakya savaş yapılmadan kurtarılmıştır. Boğazlar Komisyonu ve kapitülasyonlar Lozan'da, Hatay'ın özel yönetimi 1921 Ankara Antlaşması'nda düzenlenmiştir."},{"d":"tarih","k":"Millî Mücadele","q":"Lozan Barış Antlaşması'nda çözüme kavuşturulamayan ve İngiltere ile ikili görüşmelere bırakılan sorun aşağıdakilerden hangisidir?","o":["Kapitülasyonlar","Irak sınırı (Musul)","Nüfus mübadelesi","Savaş tazminatı","Boğazlar"],"a":1,"c":"Irak sınırı Lozan'da çözülemedi; Musul sorunu 1926 Ankara Antlaşması ile Musul'un Irak'a bırakılmasıyla sonuçlandı."},{"d":"tarih","k":"Millî Mücadele","q":"Sevr Antlaşması ile ilgili,\nI. Son Osmanlı Mebusan Meclisi tarafından onaylanmıştır.\nII. TBMM antlaşmayı tanımamış, imzalayanları vatan haini saymıştır.\nIII. Hukuken yürürlüğe girmemiştir.\nifadelerinden hangileri doğrudur?","o":["Yalnız II","Yalnız III","I ve II","I ve III","II ve III"],"a":4,"c":"10 Ağustos 1920'de imzalanan Sevr, Mebusan Meclisi kapatıldığı için onaylanmamış ve hukuken geçersiz kalmıştır; TBMM antlaşmayı tanımamıştır."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Lozan Konferansı'na İtilaf Devletlerinin hem TBMM Hükûmeti'ni hem de İstanbul Hükûmeti'ni davet etmesi üzerine yaşanan ikiliğin sona erdirilmesi amacıyla TBMM'nin aldığı karar aşağıdakilerden hangisidir?","o":["Saltanatın kaldırılması","Cumhuriyetin ilanı","Halifeliğin kaldırılması","Tevhid-i Tedrisat Kanunu'nun kabulü","Ankara'nın başkent olması"],"a":0,"c":"1 Kasım 1922'de saltanatın kaldırılmasıyla İstanbul Hükûmeti sona ermiş ve ikilik giderilmiştir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Aşağıdakilerden hangisi 29 Ekim 1923'te Cumhuriyetin ilanıyla birlikte gerçekleşen gelişmelerden biri değildir?","o":["Rejimin adının konulması","Devlet başkanlığı sorununun çözülmesi","Mustafa Kemal'in ilk cumhurbaşkanı seçilmesi","Halifeliğin kaldırılması","İsmet Paşa'nın başbakan olarak hükûmeti kurması"],"a":3,"c":"Halifelik 3 Mart 1924'te kaldırılmıştır. Cumhuriyetin ilanıyla rejimin adı konmuş, Mustafa Kemal cumhurbaşkanı, İsmet Paşa başbakan olmuştur."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"I. Tevhid-i Tedrisat Kanunu\nII. Şer'iye ve Evkaf Vekâleti'nin kaldırılması\nIII. Türk Medeni Kanunu\nYukarıdakilerden hangileri 3 Mart 1924'te kabul edilen düzenlemeler arasındadır?","o":["Yalnız I","Yalnız II","I ve II","I ve III","II ve III"],"a":2,"c":"3 Mart 1924'te halifelik kaldırılmış, Tevhid-i Tedrisat kabul edilmiş, Şer'iye ve Evkaf Vekâleti kaldırılmıştır. Medeni Kanun 1926'da kabul edilmiştir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Resmî nikâhın zorunlu hâle getirilmesi, kadına boşanma hakkı tanınması ve mirasta kadın-erkek eşitliğinin sağlanması aşağıdaki düzenlemelerden hangisiyle gerçekleşmiştir?","o":["Türk Medeni Kanunu","Teşkilat-ı Esasiye Kanunu","Tevhid-i Tedrisat Kanunu","Soyadı Kanunu","Belediye Kanunu"],"a":0,"c":"İsviçre Medeni Kanunu örnek alınarak 1926'da kabul edilen Türk Medeni Kanunu ile aile ve miras hukukunda kadın-erkek eşitliği sağlanmıştır."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Türk kadınına milletvekili seçme ve seçilme hakkı hangi yıl tanınmıştır?","o":["1926","1930","1933","1934","1935"],"a":3,"c":"Kadınlara 1930'da belediye, 1933'te muhtarlık, 5 Aralık 1934'te milletvekili seçme ve seçilme hakkı verilmiştir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Aşağıdakilerden hangisi laiklik ilkesiyle doğrudan ilgili değildir?","o":["Merkez Bankası'nın kurulması","Halifeliğin kaldırılması","Tekke ve zaviyelerin kapatılması","\"Devletin dini İslam'dır\" ifadesinin anayasadan çıkarılması","Türk Medeni Kanunu'nun kabul edilmesi"],"a":0,"c":"Merkez Bankası'nın kurulması ekonomik bağımsızlık ve millî ekonomiyle ilgilidir; diğerleri din ve devlet işlerinin ayrılmasına yöneliktir."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"1929 Dünya Ekonomik Bunalımı'nın etkisiyle benimsenen ve I. Beş Yıllık Sanayi Planı ile uygulamaya konulan Atatürk ilkesi aşağıdakilerden hangisidir?","o":["Halkçılık","Laiklik","Milliyetçilik","Devletçilik","İnkılapçılık"],"a":3,"c":"Özel sermayenin yetersizliği ve 1929 bunalımı üzerine devletçilik benimsenmiş, 1934'te I. Beş Yıllık Sanayi Planı uygulanmıştır."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Halka yeni harflerle okuma yazma öğretmek amacıyla Millet Mekteplerinin açılması aşağıdaki inkılaplardan hangisinin ardından gerçekleşmiştir?","o":["Harf İnkılabı","Tevhid-i Tedrisat","Şapka Kanunu","Uluslararası takvim ve saat sisteminin kabulü","Ölçüler Kanunu"],"a":0,"c":"1 Kasım 1928'de Latin harflerine dayanan yeni Türk alfabesi kabul edilmiş, ardından Millet Mektepleri açılmıştır."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Türk tarihini bilimsel yöntemlerle araştırmak amacıyla Atatürk'ün direktifiyle 1931 yılında kurulan kurum aşağıdakilerden hangisidir?","o":["Türk Dil Kurumu","Darülfünun","Halkevleri","Türk Tarih Kurumu","Köy Enstitüleri"],"a":3,"c":"Türk Tarih Kurumu 1931'de Türk Tarihi Tetkik Cemiyeti adıyla kurulmuştur; Türk Dil Kurumu 1932'de kurulmuştur."},{"d":"tarih","k":"Atatürk ilke ve inkılapları","q":"Atatürk'ün isteğiyle 1930 yılında Fethi Okyar tarafından kurulan ve kısa süre sonra kendini kapatan parti aşağıdakilerden hangisidir?","o":["Terakkiperver Cumhuriyet Fırkası","Halk Fırkası","Demokrat Parti","Serbest Cumhuriyet Fırkası","Millî Kalkınma Partisi"],"a":3,"c":"Çok partili hayata geçiş denemesi olarak kurulan Serbest Cumhuriyet Fırkası, 1930'da kurulmuş ve aynı yıl kendini feshetmiştir."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"Atatürk dönemi dış politikasına ait aşağıdaki gelişmelerden hangisi diğerlerinden daha sonra gerçekleşmiştir?","o":["Musul sorununun Ankara Antlaşması ile çözülmesi","Türkiye'nin Milletler Cemiyeti'ne üye olması","Sadabat Paktı'nın imzalanması","Balkan Antantı'nın imzalanması","Montrö Boğazlar Sözleşmesi'nin imzalanması"],"a":2,"c":"Sıralama: Musul (1926), Milletler Cemiyeti (1932), Balkan Antantı (1934), Montrö (1936), Sadabat Paktı (1937)."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"Bu sözleşmeyle Boğazlar Komisyonu kaldırılarak yetkileri Türkiye'ye devredilmiş, Türkiye Boğazlar bölgesini silahlandırma hakkı elde etmiştir.\nSözü edilen sözleşme aşağıdakilerden hangisidir?","o":["Lozan Barış Antlaşması","Ankara Antlaşması","Montrö Boğazlar Sözleşmesi","Balkan Antantı","Sadabat Paktı"],"a":2,"c":"1936'da imzalanan Montrö Boğazlar Sözleşmesi ile Boğazlar üzerinde Türk egemenliği tam olarak sağlanmıştır."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"1934'te Türkiye, Yunanistan, Romanya ve Yugoslavya arasında imzalanan, bölgedeki sınırların korunmasını amaçlayan antlaşma aşağıdakilerden hangisidir?","o":["Sadabat Paktı","Montrö Boğazlar Sözleşmesi","Bağdat Paktı","Briand-Kellogg Paktı","Balkan Antantı"],"a":4,"c":"Balkan Antantı 1934'te Atina'da imzalanmıştır. Sadabat Paktı (1937) ise Türkiye, İran, Irak ve Afganistan arasındadır."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"Türkiye'nin 1952'de NATO'ya üye olmasında etkili olan en önemli gelişme aşağıdakilerden hangisidir?","o":["Bağdat Paktı'nın kurulması","Kıbrıs Barış Harekâtı","Kore Savaşı'na asker gönderilmesi","Balkan Paktı'nın imzalanması","Avrupa Ekonomik Topluluğu ile Ankara Anlaşması'nın imzalanması"],"a":2,"c":"Türkiye 1950'de BM kararı doğrultusunda Kore'ye asker göndermiş, bu durum 1952'de NATO üyeliğinin yolunu açmıştır."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"Türkiye, 1974 Kıbrıs Barış Harekâtı'nı aşağıdakilerin hangisiyle elde ettiği garantörlük hakkına dayanarak gerçekleştirmiştir?","o":["Lozan Barış Antlaşması","Londra ve Zürih Antlaşmaları","Montrö Boğazlar Sözleşmesi","Paris Barış Antlaşması","Ankara Anlaşması"],"a":1,"c":"1959-1960 Londra ve Zürih Antlaşmaları ile kurulan Kıbrıs Cumhuriyeti'nde Türkiye, İngiltere ve Yunanistan garantör devlet olmuştur."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"I. Berlin Duvarı'nın yıkılması\nII. Sovyetler Birliği'nin dağılması\nIII. Varşova Paktı'nın feshedilmesi\nYukarıdakilerden hangileri Soğuk Savaş döneminin sona erdiğini gösteren gelişmelerdendir?","o":["Yalnız I","Yalnız II","I ve II","II ve III","I, II ve III"],"a":4,"c":"Berlin Duvarı'nın yıkılması (1989), Varşova Paktı'nın feshi (1991) ve SSCB'nin dağılması (1991) Soğuk Savaş'ın sona erişini gösterir."},{"d":"tarih","k":"Dış politika ve çağdaş tarih","q":"II. Dünya Savaşı'nın sona ermesiyle 1945'te San Francisco Konferansı sonucunda kurulan ve Türkiye'nin de kurucu üyeleri arasında yer aldığı örgüt aşağıdakilerden hangisidir?","o":["Milletler Cemiyeti","NATO","Birleşmiş Milletler","Avrupa Konseyi","OECD"],"a":2,"c":"Birleşmiş Milletler 1945'te kurulmuş, Türkiye kurucu üyeler arasında yer almıştır."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Dede Korkut hikâyeleri, yüzyıllar boyunca ozanların dilinde yaşadıktan sonra yazıya geçirilmiştir. Bu yüzden hikâyelerde hem sözlü anlatımın canlılığı hem de yazının düzenleyici etkisi bir arada görülür. Kahramanların ağzından dökülen uzun soylamalar, dinleyicinin önünde okunmak için kurulmuş gibidir; olayların belirli bir düzen içinde birbirine bağlanması ise bir derleyicinin elinden çıktığını sezdirir. Hikâyeleri okurken bu iki katmanı birlikte görebilen okur, metnin yalnızca bir masal değil, sözden yazıya geçişin canlı bir belgesi olduğunu fark eder.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Dede Korkut hikâyeleri, sözlü gelenekle yazılı geleneğin izlerini birlikte taşıyan bir geçiş metnidir.","Dede Korkut hikâyelerinin asıl değeri, kahramanlarının yiğitliğinden gelir.","Ozanlar, hikâyeleri anlatırken derleyicilerden daha özgür davranmıştır.","Sözlü edebiyat ürünleri, yazıya geçirildiğinde canlılığını tümüyle yitirir.","Soylamalar, Dede Korkut hikâyelerinin en eski bölümleridir."],"a":0,"c":"Parça, hikâyelerde sözlü anlatımın canlılığı ile yazının düzenleyici etkisinin bir arada bulunduğunu ve metnin sözden yazıya geçişin belgesi olduğunu vurguluyor. Diğer seçenekler ya parçada yer almıyor ya da parçayla çelişiyor."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Ebru sanatçısı, kitreli suyun yüzeyine boyayı serptiği anda her şeyi denetleyemeyeceğini bilir. Boyanın nasıl yayılacağı suyun kıvamına, havanın nemine, hatta odadaki küçük bir esintiye bağlıdır. Usta ile acemiyi ayıran şey, bu belirsizliği ortadan kaldırmak değil, ona uyum sağlayabilmektir. Usta, beklenmedik bir dalgalanmayı bozulma olarak görmez; onu desenin bir parçasına dönüştürür. Ebrunun her yaprağının tek ve benzersiz olması da bu yüzdendir.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Ebru yapımında en önemli malzeme, suyun kıvamını sağlayan kitredir.","Ebru sanatçıları, çalışırken odadaki hava akımını tamamen engellemelidir.","Acemi ebru sanatçıları, ustalara göre daha canlı renkler kullanır.","Ebru, teknik bilgiden çok şansa dayanan bir uğraştır.","Ebru sanatında ustalık, denetlenemeyen etkenleri esere katabilmekle ilgilidir."],"a":4,"c":"Parçaya göre usta, belirsizliği yok etmeye çalışmaz; beklenmedik dalgalanmaları desene dönüştürür. Ebrunun şansa dayandığı ise söylenmemiştir; vurgulanan, rastlantıya uyum sağlama becerisidir."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Bir deneyin beklenen sonucu vermemesi çoğu zaman başarısızlık olarak görülür ve bu tür sonuçlar bilimsel dergilerde pek yer bulmaz. Oysa bir yöntemin işe yaramadığını göstermek, başka araştırmacıları aynı yolu boşuna yürümekten kurtarır. Yayımlanmayan her olumsuz sonuç, başka bir laboratuvarda aynı deneyin yeniden yapılmasına, dolayısıyla zamanın ve kaynağın boşa harcanmasına yol açabilir. Bilimin bir bütün olarak ilerlemesi, yalnızca bulunanların değil, bulunamayanların da paylaşılmasına bağlıdır.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Bilimsel dergiler, yalnızca başarılı deneylerin sonuçlarını yayımlamalıdır.","Laboratuvarlar arasındaki rekabet, bilimsel ilerlemeyi hızlandırır.","Bir deneyin tekrarlanması her zaman gereksiz bir kaynak israfıdır.","Araştırmacılar, deneylerine başlamadan önce sonucu tahmin edebilmelidir.","Olumsuz sonuçlanan araştırmaların da paylaşılması, bilimin ilerlemesi için gereklidir."],"a":4,"c":"\"Oysa\" ile başlayan cümle ve son cümle, olumsuz sonuçların da paylaşılmasının bilime katkı sağladığını vurguluyor. Diğer seçenekler parçada savunulmuyor."},{"d":"turkce","k":"Paragrafta ana düşünce","q":"Yunus Emre, döneminin pek çok şairi Arapça ve Farsça sözcüklerle yüklü bir dili tercih ederken halkın konuştuğu Türkçeyle yazmayı seçmiştir. Onun şiirlerinde derin tasavvufi düşünceler, bir köylünün de anlayabileceği yalınlıkta dile getirilir. Bu tercih, şiirlerinin yüzyıllar boyunca dilden dile dolaşmasını, ilahiler hâlinde okunmasını sağlamıştır. Yunus'u bugün hâlâ canlı kılan, düşüncesinin derinliği kadar bu derinliği herkese açan dilidir.\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","o":["Yunus Emre'nin kalıcılığında, derin düşünceleri yalın bir Türkçeyle anlatması belirleyici olmuştur.","Yunus Emre, tasavvufi düşünceyi şiire taşıyan ilk şairdir.","Arapça ve Farsça sözcükler, şiirin anlaşılmasını her zaman zorlaştırır.","Yunus Emre'nin şiirleri yalnızca köylüler arasında sevilmiştir.","İlahiler, Türk müziğinin en eski türüdür."],"a":0,"c":"Son cümle, Yunus'u canlı kılanın derin düşünceyi herkese açan yalın dili olduğunu söylüyor. Tasavvufu ilk kez şiire taşıdığı ya da yalnızca köylülerce sevildiği gibi yargılar parçada yoktur."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Karagöz oyunu, deve ya da sığır derisinden kesilip boyanan tasvirlerin, arkadan aydınlatılan beyaz bir perdeye yansıtılmasıyla oynanır. Oyunu tek başına yöneten hayalî, bütün karakterleri farklı ağızlarla seslendirir ve tasvirleri ince çubuklarla hareket ettirir. Oyun genellikle bir giriş şiiriyle başlar, ardından Karagöz ile Hacivat arasındaki söz dalaşmasına geçilir. Hacivat'ın süslü ve kitabi dili ile Karagöz'ün yalın, halktan konuşması arasındaki çatışma, güldürünün temel kaynağıdır. Eskiden özellikle ramazan gecelerinde kahvehanelerde sahnelenen oyun, bugün daha çok çocuklara yönelik gösterilerde yaşatılmaktadır.\nBu parçada Karagöz oyunuyla ilgili aşağıdakilerden hangisine değinilmemiştir?","o":["Tasvirlerin yapıldığı malzemeye","Oyunu yöneten kişinin üstlendiği görevlere","İlk kez hangi dönemde ortaya çıktığına","Güldürünün neye dayandığına","Geçmişte nerede ve ne zaman sahnelendiğine"],"a":2,"c":"Parçada tasvirlerin deriden yapıldığı, hayalînin görevleri, güldürünün iki karakterin dil farkından doğduğu ve oyunun ramazan gecelerinde kahvehanelerde oynandığı anlatılmış; oyunun ortaya çıkış dönemine ise hiç değinilmemiştir."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Sait Faik, öykülerinde büyük olaylar yerine sıradan insanların küçük anlarını anlatır. Balıkçılar, kahveciler, işsiz gençler, adada kışı geçiren yalnız insanlar onun en sevdiği kahramanlardır. Öykülerinde çoğu zaman belirgin bir olay örgüsü bulunmaz; okur, bir manzaranın ya da bir duygunun içine bırakılmış gibidir. Anlatıcı sık sık kendinden söz eder, gördüklerine kendi duygularını karıştırır. Bu yüzden onun öyküleri, klasik anlamda bir serüvenden çok bir ruh hâlinin kaydı gibidir.\nBu parçaya göre Sait Faik'in öyküleriyle ilgili aşağıdakilerden hangisi söylenemez?","o":["Kahramanlar, sürükleyici serüvenlerin içinde yer alır.","Kahramanlar genellikle toplumun sıradan insanlarıdır.","Olay örgüsü çoğu zaman geri plandadır.","Anlatıcı, kendi duygularını anlatıma katar.","Duygu ve izlenimler ön plandadır."],"a":0,"c":"Parça, öykülerin klasik anlamda bir serüvenden çok bir ruh hâlinin kaydı olduğunu söylüyor. Kahramanların sürükleyici serüvenler yaşadığı yargısı bununla çelişir."},{"d":"turkce","k":"Paragrafta yardımcı düşünce","q":"Ahtapotlar, sinir hücrelerinin yaklaşık üçte ikisini beyinlerinde değil, kollarında taşır. Bu nedenle her kol, beyinden ayrıntılı bir komut beklemeden dokunduğu nesneyi tanıyabilir, tadına bakabilir ve kavrayabilir. Ahtapotlar ayrıca derilerindeki özel hücreler sayesinde birkaç saniye içinde renk ve doku değiştirebilir. İlginç olan, bu hayvanların renk körü olduğu düşünülmesine rağmen çevrelerine bu kadar iyi uyum sağlayabilmeleridir. Bilim insanları, bu yeteneğin ışığı deride algılayan hücrelerle ilgili olabileceğini düşünmektedir.\nBu parçadan aşağıdakilerin hangisine ulaşılamaz?","o":["Ahtapotların kolları, belli ölçüde beyinden bağımsız davranabilir.","Ahtapotlar, kısa sürede görünüml
